<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أكاديمية كيلنج شوت - لوحة التحكم</title>
    <style>
        :root {
            --primary: #1B2A4A;
            --accent: #C53030;
            --secondary: #2B6CB0;
            --bg: #F4F7FA;
            --card-bg: #FFFFFF;
            --text-main: #2D3748;
            --text-muted: #718096;
            --badge-bg: #EDF2F7;
            --badge-text: #4A5568;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }
        .header {
            background-color: var(--primary);
            color: white;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 12px rgba(27, 42, 74, 0.2);
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 4px solid var(--accent);
        }
        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .logo-img {
            height: 55px;
            width: auto;
            background: white;
            padding: 4px 8px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            object-fit: contain;
        }
        .logo-text h1 {
            margin: 0;
            font-size: 22px;
            letter-spacing: 0.5px;
        }
        .logo-text span {
            font-size: 12px;
            color: #A0AEC0;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .header-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .search-bar {
            padding: 10px 18px;
            width: 280px;
            border-radius: 25px;
            border: 2px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1);
            color: white;
            outline: none;
            font-size: 15px;
            transition: all 0.3s;
        }
        .search-bar::placeholder {
            color: #CBD5E0;
        }
        .search-bar:focus {
            background: white;
            color: var(--text-main);
            border-color: var(--secondary);
        }
        .btn-add {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 2px 6px rgba(197, 48, 48, 0.3);
        }
        .btn-add:hover {
            background-color: #9B2C2C;
            transform: translateY(-1px);
        }
        .btn-add-branch {
            background-color: #319795;
            color: white;
            border: 2px solid #319795;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.2s;
        }
        .btn-add-branch:hover {
            background-color: #2C7A7B;
            border-color: #2C7A7B;
        }
        .dashboard-container {
            max-width: 1250px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .nav-section {
            margin-bottom: 20px;
            background: white;
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }
        .nav-title {
            font-size: 13px;
            font-weight: bold;
            color: var(--text-muted);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .levels-nav {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        .btn-filter {
            padding: 8px 16px;
            background-color: var(--card-bg);
            border: 2px solid #E2E8F0;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.2s;
            color: var(--text-main);
        }
        .btn-filter:hover {
            border-color: var(--secondary);
            color: var(--secondary);
        }
        .btn-filter.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 2px 4px rgba(27, 42, 74, 0.2);
        }
        .btn-branch {
            border-color: #CBD5E0;
            color: #2D3748;
            background-color: #F7FAFC;
        }
        .btn-branch.active {
            background-color: var(--secondary);
            color: white;
            border-color: var(--secondary);
        }
        .btn-absent {
            background-color: #FFF5F5;
            color: var(--accent);
            border-color: #FEB2B2;
        }
        .btn-absent.active {
            background-color: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }
        .player-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.04);
            border-right: 6px solid var(--secondary);
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }
        .player-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 15px rgba(27, 42, 74, 0.08);
        }
        .player-card.absent-card {
            border-right-color: var(--accent);
            background-color: #FFFAFA;
        }
        .p-name {
            font-size: 18px;
            font-weight: bold;
            margin: 0 0 15px 0;
            color: var(--primary);
            padding-left: 50px; 
        }
        .absent-card .p-name {
            color: var(--accent);
        }
        .age-badge {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: var(--badge-bg);
            color: var(--badge-text);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .p-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            border-bottom: 1px dashed #EDF2F7;
            padding-bottom: 6px;
        }
        .info-label {
            color: var(--text-muted);
        }
        .info-value {
            font-weight: bold;
            color: var(--text-main);
        }
        .card-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .edit-btn {
            background-color: #EDF2F7;
            border: none;
            padding: 7px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            color: #4A5568;
            flex: 1;
            transition: background 0.2s;
        }
        .edit-btn:hover {
            background-color: #CBD5E0;
        }
        .delete-btn {
            background-color: #FFF5F5;
            border: 1px solid #FEB2B2;
            padding: 7px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            color: var(--accent);
            transition: background 0.2s;
        }
        .delete-btn:hover {
            background-color: #FED7D7;
        }
        .no-results {
            text-align: center;
            grid-column: 1 / -1;
            padding: 50px;
            background: white;
            border-radius: 12px;
            color: var(--text-muted);
            font-size: 18px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(27, 42, 74, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }
        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            width: 420px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            border-top: 5px solid var(--secondary);
        }
        .modal-content h3 {
            margin-top: 0;
            color: var(--primary);
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
            color: var(--text-main);
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #CBD5E0;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: var(--secondary);
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
        .btn-save {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-save:hover {
            background-color: #0f172a;
        }
        .btn-cancel {
            background-color: #E2E8F0;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: #4A5568;
        }
        .btn-cancel:hover {
            background-color: #CBD5E0;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-container">
            <img class="logo-img" src="IMG_9908.jpg" onerror="this.src='https://i.ibb.co/6R2N299/IMG-9908.jpg'" alt="Killing Shot Logo">
            <div class="logo-text">
                <h1>KILLING SHOT</h1>
                <span>Not Just A Club</span>
            </div>
        </div>
        <div class="header-actions">
            <button class="btn-add" onclick="openAddModal()">➕ إضافة لاعب جديد</button>
            <input type="text" id="searchInput" class="search-bar" placeholder="ابحث بالاسم، السن، المستوى، أو الفرع...">
        </div>
    </div>

    <div class="dashboard-container">
        <!-- قسم الفروع وزر إضافة فرع -->
        <div class="nav-section">
            <div class="nav-title" style="display: flex; justify-content: space-between; align-items: center;">
                <span>تصفية حسب الفرع:</span>
                <button class="btn-add-branch" onclick="openAddBranchModal()">➕ فرع جديد</button>
            </div>
            <div class="levels-nav" id="branchesNav">
                <!-- أزرار الفروع تتولد تلقائياً هنا -->
            </div>
        </div>

        <!-- قسم المستويات والحالة -->
        <div class="nav-section">
            <div class="nav-title">تصفية حسب المستوى والحالة:</div>
            <div class="levels-nav" id="levelsNav">
                <button class="btn-filter active" data-type="category" data-filter="all">كل المستويات (النشطين)</button>
                <button class="btn-filter" data-type="category" data-filter="beginner">Beginner</button>
                <button class="btn-filter" data-type="category" data-filter="1">Level 1</button>
                <button class="btn-filter" data-type="category" data-filter="2">Level 2</button>
                <button class="btn-filter" data-type="category" data-filter="3">Level 3</button>
                <button class="btn-filter" data-type="category" data-filter="gold">Gold</button>
                <button class="btn-filter" data-type="category" data-filter="platinum">Platinum</button>
                <button class="btn-filter" data-type="category" data-filter="diamond">Diamond</button>
                <button class="btn-filter" data-type="category" data-filter="team">فريق</button>
                <button class="btn-filter" data-type="category" data-filter="elite">Elite</button>
                <button class="btn-filter btn-absent" data-type="status" data-filter="absent">المعتذرين</button>
            </div>
        </div>

        <!-- شبكة اللاعبين -->
        <div class="players-grid" id="playersGrid">
            <!-- البطاقات ستظهر هنا -->
        </div>
    </div>

    <!-- نافذة إضافة فرع جديد -->
    <div class="modal" id="addBranchModal">
        <div class="modal-content">
            <h3>إضافة فرع جديد</h3>
            <div class="form-group">
                <label>اسم الفرع:</label>
                <input type="text" id="newBranchName" placeholder="أدخل اسم الفرع الجديد">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal('addBranchModal')">إلغاء</button>
                <button class="btn-save" onclick="saveNewBranch()">إضافة الفرع</button>
            </div>
        </div>
    </div>

    <!-- نافذة تعديل بيانات اللاعب -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <h3>تعديل بيانات اللاعب</h3>
            <input type="hidden" id="editIndex">
            <div class="form-group">
                <label>اسم اللاعب:</label>
                <input type="text" id="editName">
            </div>
            <div class="form-group">
                <label>السن:</label>
                <input type="number" id="editAge">
            </div>
            <div class="form-group">
                <label>المستوى:</label>
                <input type="text" id="editLevel">
            </div>
            <div class="form-group">
                <label>الفرع:</label>
                <input type="text" id="editBranch">
            </div>
            <div class="form-group">
                <label>المدرب:</label>
                <input type="text" id="editCoach">
            </div>
            <div class="form-group">
                <label>التصنيف (للمستويات):</label>
                <select id="editCategory">
                    <option value="beginner">Beginner</option>
                    <option value="1">Level 1</option>
                    <option value="2">Level 2</option>
                    <option value="3">Level 3</option>
                    <option value="gold">Gold</option>
                    <option value="platinum">Platinum</option>
                    <option value="diamond">Diamond</option>
                    <option value="team">فريق</option>
                    <option value="elite">Elite</option>
                </select>
            </div>
            <div class="form-group">
                <label>الحالة:</label>
                <select id="editStatus">
                    <option value="active">نشط</option>
                    <option value="absent">معتذر</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal('editModal')">إلغاء</button>
                <button class="btn-save" onclick="savePlayer()">حفظ التعديلات</button>
            </div>
        </div>
    </div>

    <!-- نافذة إضافة لاعب جديد -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <h3>إضافة لاعب جديد</h3>
            <div class="form-group">
                <label>اسم اللاعب:</label>
                <input type="text" id="addName" placeholder="أدخل اسم اللاعب">
            </div>
            <div class="form-group">
                <label>السن:</label>
                <input type="number" id="addAge" placeholder="السن">
            </div>
            <div class="form-group">
                <label>المستوى:</label>
                <input type="text" id="addLevel" placeholder="مثال: Gold, Platinum, Beginner">
            </div>
            <div class="form-group">
                <label>الفرع:</label>
                <input type="text" id="addBranch" placeholder="مثال: دايموند، المعادي، لوريس...">
            </div>
            <div class="form-group">
                <label>المدرب:</label>
                <input type="text" id="addCoach" placeholder="اسم المدرب">
            </div>
            <div class="form-group">
                <label>التصنيف (للمستويات):</label>
                <select id="addCategory">
                    <option value="beginner">Beginner</option>
                    <option value="1">Level 1</option>
                    <option value="2">Level 2</option>
                    <option value="3">Level 3</option>
                    <option value="gold">Gold</option>
                    <option value="platinum">Platinum</option>
                    <option value="diamond">Diamond</option>
                    <option value="team">فريق</option>
                    <option value="elite">Elite</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal('addModal')">إلغاء</button>
                <button class="btn-save" onclick="addNewPlayer()">إضافة وحفظ</button>
            </div>
        </div>
    </div>

        let playersData = JSON.parse(localStorage.getItem('killingshot_players')) || completePlayersData;
        let branchesData = JSON.parse(localStorage.getItem('killingshot_branches')) || ["دايموند", "المعادي", "بارك", "توليب جاردنز", "جولدن جيت", "النرجس", "لوريس"];

        function saveData() {
            localStorage.setItem('killingshot_players', JSON.stringify(playersData));
            localStorage.setItem('killingshot_branches', JSON.stringify(branchesData));
        }

        let currentBranchFilter = 'all';
        let currentCategoryFilter = 'all';
        let currentStatusFilter = 'active'; 
        let searchQuery = '';

        const grid = document.getElementById('playersGrid');
        const searchInput = document.getElementById('searchInput');
        const levelButtons = document.querySelectorAll('#levelsNav .btn-filter');

        function renderBranches() {
            const branchesNav = document.getElementById('branchesNav');
            let html = `<button class="btn-filter btn-branch ${currentBranchFilter === 'all' ? 'active' : ''}" data-type="branch" data-filter="all">جميع الفروع</button>`;
            
            branchesData.forEach(branch => {
                html += `<button class="btn-filter btn-branch ${currentBranchFilter === branch ? 'active' : ''}" data-type="branch" data-filter="${branch}">${branch}</button>`;
            });
            
            branchesNav.innerHTML = html;

            document.querySelectorAll('#branchesNav .btn-filter').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('#branchesNav .btn-filter').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentBranchFilter = e.target.getAttribute('data-filter');
                    renderPlayers();
                });
            });
        }

        function renderPlayers() {
            grid.innerHTML = '';
            
            const filteredData = playersData.map((player, originalIndex) => ({ ...player, originalIndex })).filter(player => {
                let matchBranch = (currentBranchFilter === 'all' || player.branch === currentBranchFilter);

                let matchStatus = false;
                if (currentStatusFilter === 'absent') {
                    matchStatus = (player.status === 'absent');
                } else {
                    matchStatus = (player.status === 'active');
                }

                let matchCategory = true;
                if (currentCategoryFilter !== 'all' && currentStatusFilter !== 'absent') {
                    matchCategory = (player.category === currentCategoryFilter);
                }

                const searchLower = searchQuery.toLowerCase().trim();
                const matchSearch = searchLower === "" || 
                                    player.name.toLowerCase().includes(searchLower) || 
                                    player.coach.toLowerCase().includes(searchLower) || 
                                    player.level.toLowerCase().includes(searchLower) ||
                                    player.branch.toLowerCase().includes(searchLower) ||
                                    player.age.toString() === searchLower; 

                return matchBranch && matchStatus && matchCategory && matchSearch;
            });

            if (filteredData.length === 0) {
                grid.innerHTML = '<div class="no-results">لا يوجد لاعبين مطابقيين للبحث أو الفلتر الحالي.</div>';
                return;
            }

            filteredData.forEach(player => {
                const isAbsent = player.status === 'absent';
                const card = document.createElement('div');
                card.className = `player-card ${isAbsent ? 'absent-card' : ''}`;
                
                card.innerHTML = `
                    <div class="age-badge">${player.age} سنة</div>
                    <h3 class="p-name">${player.name} ${isAbsent ? '(معتذر)' : ''}</h3>
                    <div class="p-info">
                        <span class="info-label">المستوى:</span>
                        <span class="info-value">${player.level}</span>
                    </div>
                    <div class="p-info">
                        <span class="info-label">الفرع:</span>
                        <span class="info-value">${player.branch}</span>
                    </div>
                    <div class="p-info">
                        <span class="info-label">المدرب:</span>
                        <span class="info-value">${player.coach}</span>
                    </div>
                    <div class="card-actions">
                        <button class="edit-btn" onclick="openEditModal(${player.originalIndex})">✏️ تعديل</button>
                        <button class="delete-btn" onclick="deletePlayer(${player.originalIndex})">🗑️ حذف</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openAddBranchModal() {
            document.getElementById('newBranchName').value = '';
            document.getElementById('addBranchModal').style.display = 'flex';
        }

        function saveNewBranch() {
            const branchName = document.getElementById('newBranchName').value.trim();
            if(!branchName) {
                alert('برجاء إدخال اسم الفرع.');
                return;
            }
            if(branchesData.includes(branchName)) {
                alert('هذا الفرع موجود بالفعل!');
                return;
            }
            branchesData.push(branchName);
            saveData();
            renderBranches();
            closeModal('addBranchModal');
        }

        function openAddModal() {
            document.getElementById('addName').value = '';
            document.getElementById('addAge').value = '';
            document.getElementById('addLevel').value = '';
            document.getElementById('addBranch').value = '';
            document.getElementById('addCoach').value = '';
            document.getElementById('addModal').style.display = 'flex';
        }

        function addNewPlayer() {
            const name = document.getElementById('addName').value.trim();
            const age = parseInt(document.getElementById('addAge').value) || 0;
            const level = document.getElementById('addLevel').value.trim();
            const branch = document.getElementById('addBranch').value.trim();
            const coach = document.getElementById('addCoach').value.trim();
            const category = document.getElementById('addCategory').value;

            if(!name) {
                alert('برجاء إدخال اسم اللاعب على الأقل.');
                return;
            }

            playersData.push({ name, age, level, branch, coach, status: "active", category });
            saveData();
            closeModal('addModal');
            renderPlayers();
        }

        function openEditModal(index) {
            const player = playersData[index];
            document.getElementById('editIndex').value = index;
            document.getElementById('editName').value = player.name;
            document.getElementById('editAge').value = player.age;
            document.getElementById('editLevel').value = player.level;
            document.getElementById('editBranch').value = player.branch;
            document.getElementById('editCoach').value = player.coach;
            document.getElementById('editCategory').value = player.category || 'beginner';
            document.getElementById('editStatus').value = player.status;
            
            document.getElementById('editModal').style.display = 'flex';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function savePlayer() {
            const index = document.getElementById('editIndex').value;
            playersData[index].name = document.getElementById('editName').value;
            playersData[index].age = parseInt(document.getElementById('editAge').value) || 0;
            playersData[index].level = document.getElementById('editLevel').value;
            playersData[index].branch = document.getElementById('editBranch').value;
            playersData[index].coach = document.getElementById('editCoach').value;
            playersData[index].category = document.getElementById('editCategory').value;
            playersData[index].status = document.getElementById('editStatus').value;

            saveData();
            closeModal('editModal');
            renderPlayers();
        }

        // دالة الحذف النهائي للاعب من النظام
        function deletePlayer(index) {
            if(confirm(`هل أنت متأكد من حذف اللاعب "${playersData[index].name}" نهائياً؟`)) {
                playersData.splice(index, 1);
                saveData();
                renderPlayers();
            }
        }

        levelButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                levelButtons.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                
                const type = e.target.getAttribute('data-type');
                const filter = e.target.getAttribute('data-filter');

                if (type === 'status') {
                    currentStatusFilter = filter;
                    currentCategoryFilter = 'all';
                } else {
                    currentStatusFilter = 'active';
                    currentCategoryFilter = filter;
                }
                renderPlayers();
            });
        });

        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderPlayers();
        });

        // التشغيل الأولي
        renderBranches();
        renderPlayers();
    </script>
