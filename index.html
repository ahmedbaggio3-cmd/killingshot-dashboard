<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Killing Shot | Not Just a Club</title>
<meta name="description" content="نظام متابعة لاعبي أكاديمية Killing Shot — ملفات اللاعبين، التوصيات، الواجبات، الحضور، والبيانات الصحية.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 46 60'%3E%3Crect width='46' height='60' rx='10' fill='%230c1120'/%3E%3Ccircle cx='20' cy='16' r='7' fill='%23f3f5fa'/%3E%3Cpath d='M8 52 L20 24 L28 24 L16 52 Z' fill='%234a6fa1'/%3E%3Cpath d='M16 38 L26 24 L34 24 L20 52 Z' fill='%23f3f5fa'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy-950:#080e1e;
  --navy-900:#0d1528;
  --navy-800:#111e3a;
  --navy-700:#1a2d55;
  --navy-600:#243d72;
  --blue:#4a6fa1;
  --blue-light:#7198cc;
  --red:#a6373b;
  --red-light:#c85458;
  --paper:#eef1fa;
  --paper-dim:#b8c3db;
  --ink:#080e1e;
  --line:rgba(255,255,255,0.08);
  --line-soft:rgba(12,17,32,0.08);
  --ok:#3a8f6b;
  --warn:#c98a2c;
  --shadow: 0 24px 56px -18px rgba(4,8,20,0.7);
  --shadow-sm: 0 8px 24px -8px rgba(4,8,20,0.5);
  --glow-red: 0 0 40px -10px rgba(166,55,59,0.35);
  --glow-blue: 0 0 40px -10px rgba(74,111,161,0.3);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:'Tajawal', sans-serif;
  background:var(--navy-950);
  color:var(--paper);
  min-height:100vh;
  overflow-x:hidden;
}
h1,h2,h3,h4,.display{font-family:'Cairo', sans-serif;}
button{font-family:inherit; cursor:pointer;}
input, select, textarea{font-family:inherit;}
::selection{background:var(--red); color:#fff;}

/* ---------- scrollbar ---------- */
::-webkit-scrollbar{width:5px; height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12); border-radius:99px;}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.22);}

/* ---------- utility ---------- */
.hidden{display:none !important;}
.muted{color:var(--paper-dim);}
.pill{
  display:inline-flex; align-items:center; gap:6px;
  padding:4px 12px; border-radius:99px; font-size:12.5px; font-weight:700;
}
.pill.blue{background:rgba(74,111,161,0.18); color:#a9c1e6;}
.pill.red{background:rgba(166,55,59,0.18); color:#e79a9c;}
.pill.ok{background:rgba(63,143,107,0.18); color:#8fd6b4;}
.pill.warn{background:rgba(201,138,44,0.18); color:#f0c584;}
.star-rating{display:flex; gap:3px; direction:ltr; justify-content:center;}
.star-rating .star{font-size:20px; color:rgba(255,255,255,0.18); cursor:pointer; transition:color .12s, transform .12s; user-select:none;}
.star-rating .star:hover{transform:scale(1.15);}
.star-rating.readonly .star{cursor:default;}
.star-rating.readonly .star:hover{transform:none;}
.star-rating .star.filled{color:#f0c584;}
.skill-eval-table{width:100%; border-collapse:collapse; margin-bottom:8px;}
.skill-eval-table th{background:rgba(255,255,255,0.04); color:var(--paper-dim); font-size:12.5px; font-weight:700; padding:8px; text-align:center; border-bottom:1px solid var(--line);}
.skill-eval-table td{padding:8px; border-bottom:1px solid rgba(255,255,255,0.04); font-size:13px;}
.skill-eval-table td:first-child{font-weight:700; text-align:right;}
.skill-eval-section-title{font-weight:800; color:var(--blue-light); margin:16px 0 8px; font-size:14px;}

/* ---------- BUTTONS ---------- */
.btn{
  border:none; border-radius:12px; padding:11px 20px; font-weight:700; font-size:14.5px;
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;
  letter-spacing:0.01em;
}
.btn:hover{filter:brightness(1.1);}
.btn:active{transform:scale(0.96);}
.btn-primary{
  background:linear-gradient(135deg, #c04246 0%, var(--red) 50%, #7c2226 100%);
  color:#fff;
  box-shadow:0 10px 28px -8px rgba(166,55,59,0.65), var(--glow-red);
}
.btn-primary:hover{box-shadow:0 14px 36px -8px rgba(166,55,59,0.8), var(--glow-red);}
.btn-blue{
  background:linear-gradient(135deg, #5a7fb5 0%, var(--blue) 50%, #354f78 100%);
  color:#fff;
  box-shadow:0 10px 28px -8px rgba(74,111,161,0.6), var(--glow-blue);
}
.btn-ghost{background:rgba(255,255,255,0.06); color:var(--paper); border:1px solid rgba(255,255,255,0.1);}
.btn-ghost:hover{background:rgba(255,255,255,0.11); border-color:rgba(255,255,255,0.16);}
.btn-sm{padding:7px 14px; font-size:13px; border-radius:99px;}
.btn-block{width:100%;}

/* ---------- CARD ---------- */
.card{
  background:linear-gradient(160deg, rgba(26,45,85,0.7) 0%, rgba(13,21,40,0.95) 100%);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:18px;
  padding:22px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(2px);
}

/* ---------- FIELDS ---------- */
.field{margin-bottom:16px;}
.field label{display:block; font-size:13px; font-weight:700; color:var(--paper-dim); margin-bottom:7px; letter-spacing:0.02em;}
.field input, .field select, .field textarea{
  width:100%; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.09);
  color:var(--paper); padding:12px 14px; border-radius:10px; font-size:15px; outline:none;
  transition:border-color .2s ease, background .2s ease, box-shadow .2s ease;
}
.field input:focus, .field select:focus, .field textarea:focus{
  border-color:var(--blue-light);
  background:rgba(74,111,161,0.08);
  box-shadow:0 0 0 3px rgba(74,111,161,0.15);
}
.field textarea{resize:vertical; min-height:80px;}
.field select option, select option {background:#0d1528; color:var(--paper);}

/* ---------- LOGIN ---------- */
#loginScreen{
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:24px; position:relative; overflow:hidden;
}
#loginScreen::before{
  content:''; position:absolute; inset:0; pointer-events:none;
  background:
    radial-gradient(ellipse 60% 50% at 15% 20%, rgba(74,111,161,0.32), transparent),
    radial-gradient(ellipse 50% 40% at 85% 80%, rgba(166,55,59,0.28), transparent),
    radial-gradient(ellipse 40% 60% at 50% 50%, rgba(26,45,85,0.5), transparent),
    var(--navy-950);
}
#loginParticles{position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0;}
#loginParticles span{
  position:absolute; border-radius:50%;
  background:rgba(255,255,255,0.55);
  animation:floatDot linear infinite;
}
@keyframes floatDot{
  0%{transform:translateY(100vh) scale(0); opacity:0;}
  10%{opacity:1;}
  90%{opacity:0.6;}
  100%{transform:translateY(-10vh) scale(1); opacity:0;}
}
.login-bolt-bg{position:absolute; top:50%; left:50%; transform:translate(-50%,-52%) rotate(8deg); opacity:0.04; width:900px; z-index:0; pointer-events:none;}
.login-wrap{position:relative; z-index:1; width:100%; max-width:440px;}
.brand-row{display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:30px; text-align:center;}
.brand-title{font-size:30px; font-weight:900; letter-spacing:0.5px;}
.brand-title span{color:var(--red);}
.brand-sub{font-size:13px; letter-spacing:3px; color:var(--paper-dim); text-transform:uppercase; font-family:'Cairo',sans-serif;}
.login-card{padding:30px 26px;}
.login-tabs{display:flex; gap:4px; margin-bottom:22px; background:rgba(255,255,255,0.04); border-radius:12px; padding:5px;}
.login-tab{flex:1; text-align:center; padding:8px 4px; border-radius:99px; font-weight:700; font-size:12.5px; color:var(--paper-dim); background:none; border:none; cursor:pointer; white-space:nowrap; transition:all .2s;}
.login-tab.active{background:var(--navy-700); color:#fff; box-shadow:0 4px 16px -4px rgba(0,0,0,0.5);}
#loginError{color:var(--red-light); font-size:13px; font-weight:700; margin-top:10px; text-align:center; min-height:16px;}

/* ---------- APP SHELL ---------- */
#appScreen{display:flex; min-height:100vh;}
.sidebar{
  width:252px; flex-shrink:0;
  background:linear-gradient(180deg, #0d1834 0%, #080e1e 100%);
  border-left:1px solid rgba(255,255,255,0.07);
  display:flex; flex-direction:column; padding:20px 14px;
  position:sticky; top:0; height:100vh;
  overflow-y:auto; overflow-x:hidden;
  scrollbar-width:thin; scrollbar-color:rgba(255,255,255,0.1) transparent;
}
.sidebar-brand{display:flex; align-items:center; gap:10px; padding:6px 8px 20px; border-bottom:1px solid rgba(255,255,255,0.07); margin-bottom:14px;}
.sidebar::-webkit-scrollbar{width:4px;}
.sidebar::-webkit-scrollbar-track{background:transparent;}
.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1); border-radius:4px;}
.sidebar::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.2);}
.sidebar-brand .bolt{width:26px; height:34px;}
.sidebar-brand-text{font-family:'Cairo',sans-serif; font-weight:800; font-size:16px; line-height:1.2;}
.sidebar-brand-text span{color:var(--red);}

/* nav groups separator */
.nav-group-label{
  font-size:10.5px; font-weight:800; letter-spacing:0.1em; color:rgba(255,255,255,0.28);
  padding:14px 14px 5px; text-transform:uppercase;
}
.nav-divider{height:1px; background:rgba(255,255,255,0.06); margin:8px 4px;}

.nav-item{
  display:flex; align-items:center; gap:11px; padding:11px 14px; border-radius:11px;
  color:var(--paper-dim); font-weight:700; font-size:13.5px; margin-bottom:3px; border:none; background:none; width:100%; text-align:right;
  transition:background .18s, color .18s;
}
.nav-item svg{width:17px; height:17px; flex-shrink:0; opacity:0.7;}
.nav-item:hover{background:rgba(255,255,255,0.06); color:var(--paper);}
.nav-item:hover svg{opacity:1;}
.nav-item.active{
  background:linear-gradient(135deg, rgba(166,55,59,0.9) 0%, rgba(120,26,30,0.95) 100%);
  color:#fff;
  box-shadow:0 6px 20px -6px rgba(166,55,59,0.7), inset 0 1px 0 rgba(255,255,255,0.1);
}
.nav-item.active svg{opacity:1;}
.nav-group{margin-bottom:3px;}
.nav-group-summary{cursor:pointer; list-style:none; justify-content:space-between; margin-bottom:0;}
.nav-group-summary::-webkit-details-marker{display:none;}
.nav-group-summary::marker{display:none; content:'';}
.nav-group-summary > span:first-of-type{flex:1;}
.nav-caret{font-size:11px; transition:transform .18s; color:var(--paper-dim); flex-shrink:0; opacity:0.6;}
.nav-group[open] .nav-caret{transform:rotate(180deg);}
.nav-group-children{display:flex; flex-direction:column; padding-right:14px; margin-top:2px;}
.nav-subitem{font-size:13px; padding:9px 14px;}
.sidebar-footer{margin-top:auto; padding-top:14px; border-top:1px solid rgba(255,255,255,0.07);}
.user-chip{display:flex; align-items:center; gap:10px; padding:8px; margin-bottom:8px;}
.user-avatar{
  width:38px; height:38px; border-radius:50%;
  background:linear-gradient(135deg, var(--blue) 0%, var(--navy-700) 100%);
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; flex-shrink:0;
  box-shadow:0 4px 12px -4px rgba(74,111,161,0.5);
}
.user-meta{overflow:hidden;}
.user-name{font-size:13.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.user-role{font-size:11px; color:var(--paper-dim);}

.main{flex:1; min-width:0; padding:28px 24px; max-width:100%;}
/* ══ تابات داخل النظام ══ */
#ksTabsBar{display:none; position:sticky; top:0; z-index:30; margin:-10px -4px 18px; padding:8px 4px 0; background:linear-gradient(180deg, rgba(8,14,30,0.97), rgba(8,14,30,0.9)); backdrop-filter:blur(8px); border-bottom:1px solid rgba(255,255,255,0.08);}
#ksTabsBar.show{display:block;}
.ks-tabs{display:flex; gap:4px; overflow-x:auto; scrollbar-width:thin; align-items:flex-end;}
.ks-tabs::-webkit-scrollbar{height:3px;} .ks-tabs::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15); border-radius:3px;}
.ks-tab{display:flex; align-items:center; gap:8px; padding:9px 12px 9px 8px; min-width:110px; max-width:210px; border-radius:12px 12px 0 0; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.07); border-bottom:none; color:rgba(255,255,255,0.55); font-family:inherit; font-size:12.5px; font-weight:700; cursor:pointer; white-space:nowrap; transition:all .15s; position:relative;}
.ks-tab:hover{background:rgba(255,255,255,0.08); color:var(--paper);}
.ks-tab.active{background:linear-gradient(180deg, rgba(166,55,59,0.35), rgba(166,55,59,0.12)); color:#fff; border-color:rgba(200,80,85,0.45);}
.ks-tab.active::after{content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:var(--red);}
.ks-tab .ks-tab-lbl{overflow:hidden; text-overflow:ellipsis; flex:1;}
.ks-tab .ks-tab-x{width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; color:rgba(255,255,255,0.45); flex-shrink:0;}
.ks-tab .ks-tab-x:hover{background:rgba(255,255,255,0.15); color:#fff;}
.ks-tab-new{padding:8px 11px; border-radius:10px; background:transparent; border:1px dashed rgba(255,255,255,0.15); color:rgba(255,255,255,0.5); cursor:pointer; font-size:14px; margin-bottom:4px; flex-shrink:0;}
.ks-tab-new:hover{color:#fff; border-color:rgba(255,255,255,0.35);}
.ks-tab-hint{font-size:10.5px; color:rgba(255,255,255,0.3); padding:0 8px 6px; margin-right:auto; align-self:center; white-space:nowrap;}
@media(max-width:900px){ #ksTabsBar{margin:-6px 0 14px;} .ks-tab{min-width:90px; padding:8px 10px 8px 6px; font-size:12px;} .ks-tab-hint{display:none;} }

.topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:26px; flex-wrap:wrap; gap:14px;}
.page-title{font-size:24px; font-weight:800; font-family:'Cairo',sans-serif;}
.page-sub{color:var(--paper-dim); font-size:13.5px; margin-top:3px;}

.mobile-topbar{display:none; align-items:center; justify-content:space-between; padding:14px 18px; background:var(--navy-900); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20;}
.hamburger{width:38px; height:38px; border-radius:10px; background:rgba(255,255,255,0.06); border:1px solid var(--line); color:#fff; display:flex; align-items:center; justify-content:center;}

/* ---------- GRIDS ---------- */
.grid{display:grid; gap:18px;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-2{grid-template-columns:2fr 1fr;}
.grid-2-eq{grid-template-columns:1fr 1fr;}
@media(max-width:1000px){.grid-3{grid-template-columns:1fr 1fr;} .grid-4{grid-template-columns:1fr 1fr;} .grid-2{grid-template-columns:1fr;} .grid-2-eq{grid-template-columns:1fr;}}
@media(max-width:640px){.grid-3{grid-template-columns:1fr;} .grid-4{grid-template-columns:1fr;}}

/* ---------- STAT CARDS ---------- */
.stat-card{
  padding:20px; position:relative; overflow:hidden;
  border-top:3px solid transparent;
}
.stat-card::before{
  content:''; position:absolute; top:0; left:0; right:0; height:3px;
  background:linear-gradient(90deg, var(--red) 0%, var(--blue) 100%);
  border-radius:18px 18px 0 0;
}
.stat-card::after{
  content:''; position:absolute; bottom:0; right:0;
  width:80px; height:80px;
  background:radial-gradient(circle, rgba(255,255,255,0.03) 0%, transparent 70%);
  pointer-events:none;
}
.stat-label{font-size:12px; color:var(--paper-dim); font-weight:700; margin-bottom:10px; letter-spacing:0.04em; text-transform:uppercase;}
.stat-value{font-size:30px; font-weight:900; font-family:'Cairo',sans-serif; line-height:1;}
.stat-foot{font-size:12px; margin-top:8px; color:var(--paper-dim);}

/* ---------- PLAYER CARDS ---------- */
.player-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:16px;}
.player-card{
  padding:0; cursor:pointer; overflow:hidden;
  transition:transform .18s ease, box-shadow .18s ease;
  border-top:3px solid var(--blue);
}
.player-card:hover{transform:translateY(-4px); box-shadow:0 20px 40px -14px rgba(4,8,20,0.7), var(--glow-blue);}
.player-card-inner{padding:16px 18px 18px;}
.player-card-top{display:flex; align-items:center; gap:12px; margin-bottom:12px;}
.player-card-name{font-weight:800; font-size:15px; font-family:'Cairo',sans-serif;}
.player-card-meta{font-size:12px; color:var(--paper-dim); margin-top:2px;}

/* Level-based card top border colors */
.player-card[data-level="beginner"]{border-top-color:#6f92c4;}
.player-card[data-level="l1"]{border-top-color:#3a8f6b;}
.player-card[data-level="l2"]{border-top-color:#3a8f6b;}
.player-card[data-level="l3"]{border-top-color:#c98a2c;}
.player-card[data-level="gold"]{border-top-color:#d4a843;}
.player-card[data-level="platinum"]{border-top-color:#9bb0c9;}
.player-card[data-level="diamond"]{border-top-color:#7ae8f5;}
.player-card[data-level="private"]{border-top-color:#c85458;}

/* ---------- SECTION TITLE ---------- */
.section-title{font-size:15.5px; font-weight:800; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between; font-family:'Cairo',sans-serif;}

/* ---------- LIST ---------- */
.list-item{display:flex; align-items:flex-start; gap:12px; padding:14px 4px; border-bottom:1px solid var(--line);}
.list-item:last-child{border-bottom:none;}
.dot{width:9px; height:9px; border-radius:50%; margin-top:6px; flex-shrink:0;}
.dot.red{background:var(--red-light);}
.dot.blue{background:var(--blue-light);}
.dot.ok{background:var(--ok);}
.dot.warn{background:var(--warn);}
.item-text{flex:1; font-size:14px; line-height:1.7;}
.item-date{font-size:11.5px; color:var(--paper-dim); margin-top:3px;}

/* ---------- EMPTY STATE ---------- */
.empty-state{text-align:center; padding:40px 16px; color:var(--paper-dim);}
.empty-state svg{width:40px; height:40px; opacity:0.3; margin-bottom:10px;}
.empty-state p{font-size:13.5px;}

/* ---------- TABS ---------- */
.tabs-row{display:flex; gap:6px; margin-bottom:20px; overflow-x:auto; padding-bottom:2px;}
.tab-btn{
  padding:9px 16px; border-radius:10px; font-size:13.5px; font-weight:700; white-space:nowrap;
  background:rgba(255,255,255,0.04); color:var(--paper-dim); border:1px solid rgba(255,255,255,0.06); cursor:pointer;
  transition:all .18s;
}
.tab-btn.active{background:rgba(26,45,85,0.9); color:#fff; border-color:rgba(255,255,255,0.12); box-shadow:0 4px 14px -4px rgba(0,0,0,0.4);}
.tab-btn:hover:not(.active){background:rgba(255,255,255,0.08); color:var(--paper);}

/* ---------- CHECKBOX ---------- */
.checkbox-row{display:flex; align-items:center; gap:10px;}
.checkbox-row input[type=checkbox]{width:19px; height:19px; accent-color:var(--red);}

/* ---------- MODAL ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(4,8,18,0.82); backdrop-filter:blur(6px);
  display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;
}
.modal{width:100%; max-width:440px; padding:26px; max-height:88vh; overflow-y:auto;}
.modal h3{font-size:18px; margin-bottom:18px; font-family:'Cairo',sans-serif;}
.modal-actions{display:flex; gap:10px; margin-top:20px;}

/* ---------- TIMELINE ---------- */
.timeline{position:relative; padding-right:22px;}
.timeline::before{content:''; position:absolute; right:6px; top:6px; bottom:6px; width:2px; background:var(--line);}
.tl-item{position:relative; padding-bottom:22px;}
.tl-item:last-child{padding-bottom:0;}
.tl-dot{position:absolute; right:-22px; top:2px; width:12px; height:12px; border-radius:50%; background:var(--blue); border:2px solid var(--navy-900);}
.tl-item.branch-change .tl-dot{background:var(--red);}
.tl-card{background:rgba(255,255,255,0.03); border:1px solid var(--line); border-radius:12px; padding:13px 15px;}
.tl-date{font-size:11.5px; color:var(--paper-dim); margin-bottom:4px; font-weight:700;}
.tl-body{font-size:14px; line-height:1.6;}

/* ---------- MISC ---------- */
.health-form-grid{display:grid; grid-template-columns:1fr 1fr; gap:0 16px;}
@media(max-width:520px){.health-form-grid{grid-template-columns:1fr;}}
.chart-wrap{width:100%; overflow-x:auto;}
.priority-hi{color:var(--red-light);}
.priority-med{color:var(--warn);}
.priority-low{color:var(--paper-dim);}

/* ---------- TOAST ---------- */
.toast{
  position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(16px); opacity:0;
  background:linear-gradient(135deg, var(--navy-700) 0%, var(--navy-800) 100%);
  color:#fff; padding:14px 24px; border-radius:14px; font-size:14px; font-weight:700;
  box-shadow:var(--shadow); z-index:200; transition:all .28s cubic-bezier(.34,1.56,.64,1);
  pointer-events:none; border:1px solid rgba(255,255,255,0.1);
  display:flex; align-items:center; gap:10px;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
.toast-icon{font-size:18px; flex-shrink:0;}

/* ---------- PROGRESS BARS SHIMMER ---------- */
@keyframes shimmer{
  0%{background-position:200% center;}
  100%{background-position:-200% center;}
}
.progress-shimmer{
  background:linear-gradient(90deg, var(--ok) 0%, #6dcba8 40%, var(--ok) 60%, #2a7055 100%);
  background-size:200% auto;
  animation:shimmer 2.5s linear infinite;
}
.progress-shimmer-red{
  background:linear-gradient(90deg, var(--red) 0%, #e07074 40%, var(--red) 60%, #7c2226 100%);
  background-size:200% auto;
  animation:shimmer 2.5s linear infinite;
}
.progress-shimmer-warn{
  background:linear-gradient(90deg, var(--warn) 0%, #f0c060 40%, var(--warn) 60%, #9a6614 100%);
  background-size:200% auto;
  animation:shimmer 2.5s linear infinite;
}

/* ---------- SKELETON ---------- */
@keyframes pulse{0%,100%{opacity:.4;} 50%{opacity:.7;}}
.skeleton{border-radius:8px; background:rgba(255,255,255,0.06); animation:pulse 1.6s ease-in-out infinite;}
.skeleton-text{height:14px; margin-bottom:8px;}
.skeleton-title{height:22px; margin-bottom:12px; width:60%;}

/* ---------- RESPONSIVE ---------- */
@media(max-width:880px){
  #appScreen{flex-direction:column;}
  .sidebar{
    position:fixed; right:0; top:0; height:100vh; z-index:50; transform:translateX(100%);
    transition:transform .25s ease; box-shadow:-10px 0 40px rgba(0,0,0,0.4);
  }
  .sidebar.open{transform:translateX(0);}
  .sidebar-overlay{position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:40; display:none;}
  .sidebar-overlay.show{display:block;}
  .mobile-topbar{display:flex;}
  .main{padding:20px 16px;}
}
</style>
</head>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { initializeAppCheck, ReCaptchaV3Provider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app-check.js";
  import { initializeFirestore, doc, getDoc, setDoc, deleteDoc, runTransaction, onSnapshot, writeBatch } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC3n4BPMACQgWsr2G6NJOGZvlMzZbozYgQ",
    authDomain: "killingshot-academy-app.firebaseapp.com",
    projectId: "killingshot-academy-app",
    storageBucket: "killingshot-academy-app.firebasestorage.app",
    messagingSenderId: "660253996066",
    appId: "1:660253996066:web:a70ee8677c932d5825c67b"
  };

  const app = initializeApp(firebaseConfig);

  // ═══════════════════════════════════════════════════════════
  //  🔐 الحماية
  //  1) App Check: السيرفر مش هيقبل طلبات غير من موقعك على Vercel
  //  2) Auth: كل جهاز لازم يبقى عنده جلسة Firebase قبل ما يقرا أو يكتب
  // ═══════════════════════════════════════════════════════════
  // 👇 حط هنا الـ Site Key بتاع reCAPTCHA v3 (خطوة 2 في التعليمات)
  const KS_RECAPTCHA_SITE_KEY = '';

  const _isWebHost = /^https?:$/.test(location.protocol) && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  if (KS_RECAPTCHA_SITE_KEY && _isWebHost) {
    try {
      initializeAppCheck(app, { provider: new ReCaptchaV3Provider(KS_RECAPTCHA_SITE_KEY), isTokenAutoRefreshEnabled: true });
    } catch(e) { console.warn('App Check init failed', e); }
  }

  const auth = getAuth(app);
  let _authResolve;
  window._ksAuthReady = new Promise(r => { _authResolve = r; });
  onAuthStateChanged(auth, user => { _authResolve(user); });
  // منستناش أكتر من 6 ثواني (لو النت قاطع التطبيق يشتغل من الجهاز)
  const _waitAuth = () => Promise.race([window._ksAuthReady, new Promise(r => setTimeout(r, 6000))]);

  const db = initializeFirestore(app, {});

  // ═══════════════════════════════════════════════════════════
  //  🔑 حسابات الدخول الحقيقية (Firebase Auth)
  //  ksLogin/{h}     → {v, uid}  ربط اليوزر نيم بالحساب (مفيهوش بيانات سرية)
  //  ksMembers/{uid} → {role, playerId, username}  مين مسموحله يدخل
  //  ksMeta/bootstrap → أول حساب مطور (بيتعمل مرة واحدة بس)
  // ═══════════════════════════════════════════════════════════
  const KS_MAIL_DOMAIN = 'killingshot-academy.app';
  const _emailFor = (h, v) => `u${h}.v${v}@${KS_MAIL_DOMAIN}`;
  const _pwdFor  = (pin, h) => `KS!${pin}!${h.slice(0, 8)}`;
  let _secAuth = null;
  const _getSecAuth = () => {
    if (!_secAuth) _secAuth = getAuth(initializeApp(firebaseConfig, 'ks-provision'));
    return _secAuth;
  };

  window.ksAuth = {
    ready: () => _waitAuth(),
    currentUid: () => auth.currentUser ? auth.currentUser.uid : null,
    async getLogin(h) {
      const snap = await getDoc(doc(db, 'ksLogin', h));
      return snap.exists() ? snap.data() : null;
    },
    async bootstrapExists() {
      const snap = await getDoc(doc(db, 'ksMeta', 'bootstrap'));
      return snap.exists();
    },
    async signIn(h, v, pin) {
      await signInWithEmailAndPassword(auth, _emailFor(h, v), _pwdFor(pin, h));
    },
    async bootstrap({ h, pin, playerId, username }) {
      const cred = await createUserWithEmailAndPassword(auth, _emailFor(h, 1), _pwdFor(pin, h));
      const uid = cred.user.uid;
      const b = writeBatch(db);
      b.set(doc(db, 'ksMembers', uid), { role: 'developer', playerId, username, createdAt: new Date().toISOString() });
      b.set(doc(db, 'ksLogin', h), { v: 1, uid });
      b.set(doc(db, 'ksMeta', 'bootstrap'), { uid, at: new Date().toISOString() });
      await b.commit();
    },
    // إنشاء/تجديد حساب دخول لحد (أول مرة، أو لما الرقم السري أو اليوزر نيم يتغير)
    async provision({ h, oldH, pin, role, playerId, username }) {
      const myUid = auth.currentUser && auth.currentUser.uid;
      const existing = await this.getLogin(h);
      const oldRec = (oldH && oldH !== h) ? await this.getLogin(oldH) : null;
      const v = ((existing && existing.v) || 0) + 1;
      const sec = _getSecAuth();
      const cred = await createUserWithEmailAndPassword(sec, _emailFor(h, v), _pwdFor(pin, h));
      const newUid = cred.user.uid;
      await signOut(sec);
      const isSelf = !!myUid && ((existing && existing.uid === myUid) || (oldRec && oldRec.uid === myUid));
      const b = writeBatch(db);
      b.set(doc(db, 'ksMembers', newUid), { role, playerId, username, createdAt: new Date().toISOString() });
      b.set(doc(db, 'ksLogin', h), { v, uid: newUid });
      if (existing && existing.uid && !isSelf) b.delete(doc(db, 'ksMembers', existing.uid));
      if (oldRec) { b.delete(doc(db, 'ksLogin', oldH)); if (oldRec.uid && !isSelf) b.delete(doc(db, 'ksMembers', oldRec.uid)); }
      await b.commit();
      if (isSelf) {
        // حسابي أنا اتجدد: ادخل بالجديد وبعدين الغي القديم
        await signInWithEmailAndPassword(auth, _emailFor(h, v), _pwdFor(pin, h));
        await deleteDoc(doc(db, 'ksMembers', myUid)).catch(() => {});
      }
      return newUid;
    },
    async revoke(h) {
      const rec = await this.getLogin(h);
      if (!rec) return false;
      const b = writeBatch(db);
      if (rec.uid) b.delete(doc(db, 'ksMembers', rec.uid));
      b.delete(doc(db, 'ksLogin', h));
      await b.commit();
      return true;
    },
    async signOut() { try { await signOut(auth); } catch(e) {} }
  };

  window._memCache = window._memCache || {};

  window.pGet = async function(key) {
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : null;
  };
  window.pSet = async function(key, val) {
    localStorage.setItem(key, JSON.stringify(val));
    return true;
  };
  window.pDel = async function(key) {
    localStorage.removeItem(key);
  };

  // ═══ نسخة الأساس: آخر قيمة شفناها على السيرفر لكل مفتاح (عشان نعرف إيه اللي اتغير عندنا بالظبط) ═══
  window._baseCache = window._baseCache || {};
  const _clone = v => v === undefined ? undefined : JSON.parse(JSON.stringify(v));
  const _same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  const _isObj = v => v && typeof v === 'object' && !Array.isArray(v);
  const _idOf = x => (x && typeof x === 'object') ? (x.id ?? x._id ?? x.key ?? null) : null;
  const _idArray = arr => Array.isArray(arr) && arr.length > 0 && arr.every(x => _idOf(x) !== null);

  // دمج ثلاثي: أساس + تعديلاتي + نسخة السيرفر الحالية ← بيحافظ على تعديلات الطرفين
  function merge3(base, local, remote) {
    if (_same(local, remote)) return remote;
    if (base !== undefined && _same(local, base)) return remote;     // أنا ماغيرتش حاجة
    if (base !== undefined && _same(remote, base)) return local;     // السيرفر ماتغيرش
    if (remote === null || remote === undefined) return local;
    if ((_idArray(local) || _idArray(remote) || _idArray(base)) && Array.isArray(local) && Array.isArray(remote)) {
      const bMap = new Map((Array.isArray(base) ? base : []).map(x => [String(_idOf(x)), x]));
      const lMap = new Map(local.map(x => [String(_idOf(x)), x]));
      const out = [];
      const seen = new Set();
      for (const r of remote) {
        const id = String(_idOf(r)); seen.add(id);
        const inBase = bMap.has(id), inLocal = lMap.has(id);
        if (inBase && !inLocal) {
          // أنا حذفته: يتحذف، إلا لو حد تاني عدّله بعد ما أنا شفته
          if (_same(r, bMap.get(id))) continue;
          out.push(r); continue;
        }
        if (inLocal) out.push(merge3(bMap.get(id), lMap.get(id), r));
        else out.push(r);
      }
      for (const l of local) {
        const id = String(_idOf(l));
        if (seen.has(id)) continue;
        if (bMap.has(id)) continue;          // كان موجود وحد تاني حذفه ← يفضل محذوف
        out.push(l);                          // عنصر جديد أنا ضفته
      }
      return out;
    }
    if (_isObj(local) && _isObj(remote)) {
      const b = _isObj(base) ? base : {};
      const out = {};
      const keys = new Set([...Object.keys(remote), ...Object.keys(local)]);
      for (const k of keys) {
        const inB = k in b, inL = k in local, inR = k in remote;
        if (inL && inR) out[k] = merge3(b[k], local[k], remote[k]);
        else if (inL && !inR) { if (!inB || !_same(local[k], b[k])) out[k] = local[k]; }   // جديد عندي، أو حد حذفه وأنا عدلته
        else if (!inL && inR) { if (!inB || !_same(remote[k], b[k])) out[k] = remote[k]; } // جديد عنده، أو أنا حذفته وهو عدله
      }
      return out;
    }
    return local; // قيمة بسيطة اتغيرت عند الطرفين ← آخر حفظ يكسب
  }
  window._ksMerge3 = merge3;

  window.sGet = async function(key) {
    if (window._memCache[key] !== undefined) return window._memCache[key];
    const localVal = await window.pGet(key);
    const pending = ((await window.pGet('ks_sync_queue')) || []).some(q => q.key === key);

    if (navigator.onLine && !pending) {
      try {
        await _waitAuth();
        const docSnap = await getDoc(doc(db, "appData", key));
        // السيرفر هو المصدر الوحيد للحقيقة — مفيش "النسخة الأطول تكسب" تاني
        const cloudVal = docSnap.exists() ? docSnap.data().value : null;
        if (cloudVal === null && localVal !== null) {
          window._memCache[key] = localVal;
          return localVal;
        }
        window._memCache[key] = cloudVal;
        window._baseCache[key] = _clone(cloudVal);
        await window.pSet(key, cloudVal);
        window.ksWatchKey && window.ksWatchKey(key);
        return cloudVal;
      } catch(e) {
        console.warn("تنبيه: تعذر قراءة البيانات السحابية", e);
      }
    }
    if (localVal !== null) {
      window._memCache[key] = localVal;
      return localVal;
    }
    return null;
  };

  // كتابة آمنة: بتقرا نسخة السيرفر الحالية جوه transaction وتدمج تعديلاتي عليها
  async function _safeWrite(key, val, base) {
    await _waitAuth();
    return runTransaction(db, async (tx) => {
      const ref = doc(db, "appData", key);
      const snap = await tx.get(ref);
      const remote = snap.exists() ? snap.data().value : null;
      const merged = (remote === null) ? val : merge3(base, val, remote);
      tx.set(ref, { value: merged });
      return merged;
    });
  }
  async function _applyMerged(key, merged) {
    window._baseCache[key] = _clone(merged);
    window._memCache[key] = merged;
    await window.pSet(key, merged);
  }

  window.sSet = async function(key, val) {
    const base = window._baseCache[key] !== undefined ? _clone(window._baseCache[key]) : undefined;
    window._memCache[key] = val;
    await window.pSet(key, val);

    if (navigator.onLine) {
      try {
        const merged = await _safeWrite(key, val, base);
        await _applyMerged(key, merged);
        let queue = await window.pGet('ks_sync_queue') || [];
        queue = queue.filter(q => q.key !== key);
        await window.pSet('ks_sync_queue', queue);
        window.ksWatchKey && window.ksWatchKey(key);
        return true;
      } catch(e) {
        console.warn("تعذر الرفع المباشر للسيرفر، سيتم الحفظ محلياً لحين المزامنة.", e);
      }
    }

    let queue = await window.pGet('ks_sync_queue') || [];
    const prev = queue.find(q => q.key === key);
    queue = queue.filter(q => q.key !== key);
    // نحتفظ بأقدم أساس عشان الدمج بعدين يبقى صح
    queue.push({ key: key, val: val, base: prev ? prev.base : base });
    await window.pSet('ks_sync_queue', queue);
    window.processSyncQueue();
    return true;
  };

  let _syncing = false;
  window.processSyncQueue = async function() {
    if (!navigator.onLine || _syncing) return;
    _syncing = true;
    try {
      let queue = await window.pGet('ks_sync_queue') || [];
      while (queue.length) {
        const task = queue[0];
        try {
          const merged = await _safeWrite(task.key, task.val, task.base);
          await _applyMerged(task.key, merged);
        } catch (error) { break; }
        queue = (await window.pGet('ks_sync_queue') || []).filter(q => q !== task && !(q.key === task.key && _same(q.val, task.val)));
        await window.pSet('ks_sync_queue', queue);
      }
    } finally { _syncing = false; }
  };

  // ═══ تحديث تلقائي: متابعة لحظية لأي بيانات مفتوحة، ولو حد غيّرها من جهاز تاني الصفحة تتحدث ═══
  window._ksWatched = window._ksWatched || {};
  let _refreshTimer = null, _pendingRefresh = false;
  function _canRefreshNow() {
    const mr = document.getElementById('modalRoot');
    if (mr && mr.children.length) return false;
    const ae = document.activeElement;
    if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return false;
    if (typeof session === 'undefined' || !session) return false;
    return typeof renderPage === 'function';
  }
  function _scheduleRefresh() {
    _pendingRefresh = true;
    clearTimeout(_refreshTimer);
    _refreshTimer = setTimeout(async () => {
      if (!_pendingRefresh) return;
      if (!_canRefreshNow()) { _scheduleRefresh(); return; }  // مستني تقفل النافذة أو تخلص كتابة
      _pendingRefresh = false;
      const y = window.scrollY;
      try { await renderPage(); } catch(e) {}
      window.scrollTo(0, y);
      if (typeof showToast === 'function') showToast('🔄 اتحدثت البيانات من جهاز تاني');
    }, 1500);
  }
  window.ksWatchKey = function(key) {
    if (window._ksWatched[key] || key === 'ks_sync_queue' || key === 'ks_session') return;
    if (Object.keys(window._ksWatched).length > 150) return;
    if (!auth.currentUser) { _waitAuth().then(() => { if (auth.currentUser) window.ksWatchKey(key); }); return; }
    window._ksWatched[key] = onSnapshot(doc(db, "appData", key), async (snap) => {
      if (snap.metadata.hasPendingWrites) return;
      const remote = snap.exists() ? snap.data().value : null;
      if (_same(remote, window._baseCache[key])) return;                   // ده اللي أنا لسه كاتبه
      const queue = (await window.pGet('ks_sync_queue')) || [];
      if (queue.some(q => q.key === key)) return;                          // عندي تعديلات لسه ماترفعتش
      const local = window._memCache[key];
      const base = window._baseCache[key];
      // لو فيه تعديل عندي في الذاكرة لسه ما اتحفظش، ندمجه بدل ما نمسحه
      const next = (local !== undefined && base !== undefined && !_same(local, base)) ? merge3(base, local, remote) : remote;
      window._baseCache[key] = _clone(remote);
      window._memCache[key] = next;
      await window.pSet(key, next);
      _scheduleRefresh();
    }, () => { delete window._ksWatched[key]; });
  };
  // استبدال كامل من غير دمج (للاسترجاع من نسخة احتياطية بس)
  window.sForceSet = async function(key, val) {
    window._memCache[key] = val;
    await window.pSet(key, val);
    await _waitAuth();
    await setDoc(doc(db, "appData", key), { value: val });
    window._baseCache[key] = _clone(val);
    return true;
  };

  window.ksUnwatchAll = function() {
    Object.values(window._ksWatched).forEach(u => { try { u(); } catch(e){} });
    window._ksWatched = {};
  };

  window.forceSyncAllData = async function() {
    if(!confirm('هل أنت متأكد من رغبتك في رفع ومزامنة كل البيانات المخزنة على هذا الجهاز إلى السيرفر؟')) return;
    
    showToast('جاري رفع البيانات للسيرفر، برجاء الانتظار...');
    try {
        let successCount = 0;
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key.startsWith('ks_') && key !== 'ks_sync_queue' && key !== 'ks_session') {
                const val = await window.pGet(key);
                if (val !== null) {
                    await _waitAuth();
                    await setDoc(doc(db, "appData", key), { value: val });
                    successCount++;
                }
            }
        }
        alert(`تمت مزامنة ورفع (${successCount}) ملف بيانات بنجاح! ✅`);
        showToast('تمت المزامنة بنجاح!');
    } catch(e) {
        alert('فشل الرفع للسيرفر السحابي ❌');
        console.error(e);
    }
  };

  window.sDel = async function(key) {
    delete window._memCache[key];
    try {
      await window.pDel(key);
      await _waitAuth();
      await deleteDoc(doc(db, "appData", key));
    } catch(e) {}
  };

  window.addEventListener('online', window.processSyncQueue);
  setInterval(window.processSyncQueue, 15000);

  if (window.initAppLogic) {
    window.initAppLogic();
  }
</script>

<script>
function compressImage(file, callback) {
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const max_size = 200; 
      let w = img.width, h = img.height;
      if (w > h) { if (w > max_size) { h *= max_size / w; w = max_size; } }
      else { if (h > max_size) { w *= max_size / h; h = max_size; } }
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', 0.7));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function getPlayerAge(p) {
  if (p.birthdate) {
    const today = new Date();
    const bDate = new Date(p.birthdate);
    let age = today.getFullYear() - bDate.getFullYear();
    const m = today.getMonth() - bDate.getMonth();
    if (m < 0 || (m === 0 && today.getDate() < bDate.getDate())) {
      age--;
    }
    return age;
  }
  if (p.age != null && p.age !== undefined) return p.age;
  return null;
}

function getUpcomingTraining(schedule) {
  if (!schedule || schedule.length === 0) return null;
  const now = new Date();
  const currentDay = now.getDay();
  const currentTimeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

  let next = null;
  let minDiff = Infinity;

  schedule.forEach(s => {
    let sDay = s.day;
    if (sDay === undefined && s.date) {
        sDay = new Date(s.date).getDay();
    }
    
    let daysAhead = sDay - currentDay;
    if (daysAhead < 0) daysAhead += 7;
    if (daysAhead === 0 && s.time <= currentTimeStr) {
        daysAhead += 7;
    }

    const dateTarget = new Date(now);
    dateTarget.setDate(now.getDate() + daysAhead);
    const [h, m] = s.time.split(':');
    dateTarget.setHours(parseInt(h), parseInt(m), 0, 0);

    const diff = dateTarget.getTime() - now.getTime();
    if (diff < minDiff) {
        minDiff = diff;
        next = { ...s, upcomingDate: dateTarget };
    }
  });

  return next;
}

function getCachedPlayerRiskSync(playerId) {
  const healthData = window._memCache['ks_health_' + playerId] || JSON.parse(localStorage.getItem('ks_health_' + playerId) || '[]');
  if (!Array.isArray(healthData) || healthData.length < 3) return { risk: 'normal', label: '🟢 الحالة مستقرة', color: 'var(--ok)' };
  
  const recent = healthData.slice(-5);
  let lowEnergyCount = 0;
  let lowSleepCount = 0;
  
  recent.forEach(h => {
    if (h.energy <= 4) lowEnergyCount++;
    if (h.sleep < 6) lowSleepCount++;
  });

  if (lowEnergyCount >= 2 && lowSleepCount >= 2) {
    return { risk: 'high', label: '⚠️ خطر إجهاد حاد (محتمل إصابة)', color: 'var(--red-light)' };
  } else if (lowEnergyCount >= 1 || lowSleepCount >= 1) {
    return { risk: 'medium', label: '🟡 انخفاض مؤقت بالطاقة', color: 'var(--warn)' };
  }
  return { risk: 'low', label: '🟢 الحالة ممتازة', color: 'var(--ok)' };
}

async function sha256(ascii) {
  // Try WebCrypto only in secure contexts (https or localhost)
  if (window.crypto && window.crypto.subtle && window.location.protocol !== 'file:') {
    try {
      const buf = await window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(ascii));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    } catch (e) { /* fall through to JS impl */ }
  }
  function rightRotate(value, amount) { return (value>>>amount) | (value<<(32 - amount)); }
  var mathPow = Math.pow, maxWord = mathPow(2, 32), lengthProperty = 'length', i, j, result = '', words = [];
  var asciiBitLength = ascii[lengthProperty]*8, hash = sha256.h = sha256.h || [], k = sha256.k = sha256.k || [], primeCounter = k[lengthProperty], isComposite = {};
  for (var candidate = 2; primeCounter < 64; candidate++) {
    if (!isComposite[candidate]) {
      for (i = 0; i < 313; i += candidate) isComposite[i] = candidate;
      hash[primeCounter] = (mathPow(candidate, .5)*maxWord)|0;
      k[primeCounter++] = (mathPow(candidate, 1/3)*maxWord)|0;
    }
  }
  ascii += '\x80';
  while (ascii[lengthProperty]%64 - 56) ascii += '\x00';
  for (i = 0; i < ascii[lengthProperty]; i++) {
    j = ascii.charCodeAt(i);
    if (j>>8) return; 
    words[i>>2] |= j << ((3 - i)%4)*8;
  }
  words[words[lengthProperty]] = ((asciiBitLength/maxWord)|0);
  words[words[lengthProperty]] = (asciiBitLength);
  for (j = 0; j < words[lengthProperty];) {
    var w = words.slice(j, j += 16), oldHash = hash;
    hash = hash.slice(0, 8);
    for (i = 0; i < 64; i++) {
      var w15 = w[i - 15], w2 = w[i - 2], a = hash[0], e = hash[4];
      var temp1 = hash[7] + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25)) + ((e&hash[5])^((~e)&hash[6])) + k[i] + (w[i] = (i < 16) ? w[i] : (w[i - 16] + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15>>>3)) + w[i - 7] + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2>>>10)))|0);
      var temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22)) + ((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash = [(temp1 + temp2)|0].concat(hash);
      hash[4] = (hash[4] + temp1)|0;
    }
    for (i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i])|0;
  }
  for (i = 0; i < 8; i++) {
    for (j = 3; j + 1; j--) {
      var b = (hash[i]>>(j*8))&255;
      result += ((b < 16) ? 0 : '') + b.toString(16);
    }
  }
  return result;
}

  let teamPlayers = await sGet('ks_team_players');
  if(!teamPlayers) {
    await sSet('ks_team_players', []);
  }

  let coaches = await sGet('ks_coaches');
  if(!coaches || coaches.length === 0){
    await sSet('ks_coaches', INITIAL_COACHES);
  }

  let checklists = await sGet('ks_coach_checklists');
  if(!checklists){
    await sSet('ks_coach_checklists', {});
    checklists = {};
  }

  const currentMonthKey = todayISO().slice(0, 7);
  const lastResetMonth = await sGet('ks_last_coach_tasks_reset');

  if (lastResetMonth !== currentMonthKey) {
    let hasChanges = false;
    for (const coachId in checklists) {
      if (Array.isArray(checklists[coachId])) {
        checklists[coachId].forEach(task => {
          if (task.done) {
            task.done = false;
            hasChanges = true;
          }
        });
      }
    }
    if (hasChanges) {
      await sSet('ks_coach_checklists', checklists);
    }
    await sSet('ks_last_coach_tasks_reset', currentMonthKey);
  }

  return players;
}

const normalize = (str) => {
  if(!str) return '';
  return str.replace(/[أإآا]/g, 'ا')
            .replace(/ة/g, 'ه')
            .replace(/[ىي]/g, 'ي')
            .replace(/[_\s]+/g, ' ')
            .trim();
};

// ═══ حسابات الدخول (Firebase Auth) ═══
async function ksUserHash(username){
  const h = await sha256('ks-user:' + encodeURIComponent(normalize(username)));
  return String(h).slice(0, 32);
}
function ksAuthActive(){ return !!(window.ksAuth && window.ksAuth.currentUid() && navigator.onLine); }
function ksRoleKey(u){
  if(u.role === 'admin') return 'admin';
  if(u.role === 'coach') return u.staffLevel === 'senior' ? 'superadmin' : 'developer';
  return u.role;
}
async function ksProvisionStaff(user, pin, oldUsername){
  if(!ksAuthActive()) return false;
  if(!pin){ showToast('⚠️ مفيش رقم سري محفوظ لـ '+(user.name||user.username)+' — حدد له رقم سري جديد'); return false; }
  const h = await ksUserHash(user.username);
  const oldH = (oldUsername && oldUsername !== user.username) ? await ksUserHash(oldUsername) : null;
  await window.ksAuth.provision({ h, oldH, pin: String(pin), role: ksRoleKey(user), playerId: user.id, username: user.username });
  return true;
}
function ksIsActivatableStaff(u){ return u.role === 'admin' || u.role === 'coach'; }

async function submitChangeMyPin(e){
  e.preventDefault();
  const err = document.getElementById('cpErr');
  const oldPin = document.getElementById('cpOld').value.trim();
  const newPin = document.getElementById('cpNew').value.trim();
  if(newPin !== document.getElementById('cpNew2').value.trim()){ err.textContent = 'الرقم الجديد والتأكيد مش زي بعض'; return false; }
  if(newPin.length < 4){ err.textContent = 'الرقم السري لازم يكون 4 أرقام على الأقل'; return false; }
  if(newPin === oldPin){ err.textContent = 'الرقم الجديد زي القديم'; return false; }
  const players = (await sGet('ks_players')) || [];
  const me = players.find(p => p.id === session.id);
  if(!me){ err.textContent = 'تعذر إيجاد حسابك'; return false; }
  const oldHash = await sha256(oldPin);
  const oldOk = (oldHash && me.pinHash === oldHash) || (me.pinText && String(me.pinText) === oldPin);
  if(!oldOk){ err.textContent = 'الرقم السري الحالي غلط'; return false; }
  document.getElementById('cpBtn').disabled = true;
  err.style.color = 'var(--muted)'; err.textContent = 'جاري الحفظ...';
  try {
    if(ksAuthActive() && ksIsActivatableStaff(me)) await ksProvisionStaff(me, newPin);
  } catch(ex){
    err.style.color = 'var(--red)'; err.textContent = 'تعذر تحديث حساب الدخول ('+(ex.code||ex.message)+') — ماتغيرش حاجة';
    document.getElementById('cpBtn').disabled = false;
    return false;
  }
  me.pinHash = await sha256(newPin);
  me.pinText = newPin;
  await sSet('ks_players', players);
  closeModal();
  showToast('✅ اتغير رقمك السري — ادخل بيه المرة الجاية');
  return false;
}

async function ksActivateAllAccounts(){
  if(!ksAuthActive()){ showToast('⚠️ لازم تبقى متصل بالنت وداخل بحساب مفعّل'); return; }
  if(!confirm('هيتعمل حساب دخول لكل الإداريين والإدارة العليا اللي لسه ماتفعلوش.\nكل واحد هيدخل بنفس اليوزر نيم والرقم السري بتوعه.\nنكمل؟')) return;
  const players = (await sGet('ks_players')) || [];
  const targets = players.filter(ksIsActivatableStaff);
  let done = 0, already = 0; const failed = [];
  showToast('⏳ جاري تفعيل الحسابات...');
  for(const u of targets){
    try{
      const h = await ksUserHash(u.username);
      if(await window.ksAuth.getLogin(h)){ already++; continue; }
      if(!u.pinText){ failed.push((u.name||u.username)+' (مفيش رقم سري محفوظ)'); continue; }
      await ksProvisionStaff(u, u.pinText);
      done++;
    }catch(err){ failed.push((u.name||u.username)+' ('+(err.code||err.message)+')'); }
  }
  alert('✅ اتفعّل: '+done+'\n☑️ كانوا مفعّلين قبل كده: '+already + (failed.length ? '\n\n❌ ماتفعلوش:\n- '+failed.join('\n- ') : ''));
  renderPage();
}

async function handleLogin(e){
  e.preventDefault();
  const rawUsername = document.getElementById('loginUser').value.trim();
  const pin = document.getElementById('loginPin').value.trim();
  const errEl = document.getElementById('loginError');
  errEl.textContent = 'جارِ التحقق والدخول...';

  let usedCloudAuth = false;
  if(window.ksAuth && navigator.onLine){
    const h = await ksUserHash(rawUsername);
    let rec;
    try { rec = await window.ksAuth.getLogin(h); } catch(err){ rec = undefined; console.warn(err); }
    if(rec === null){
      const isDevBootstrap = loginRole === 'developer' && normalize(rawUsername) === normalize('أحمد مجدي') && pin === '3007';
      let canBootstrap = false;
      if(isDevBootstrap){ try { canBootstrap = !(await window.ksAuth.bootstrapExists()); } catch(err){} }
      if(!canBootstrap){
        errEl.textContent = 'حسابك لسه متفعلش على النظام — تواصل مع الإدارة';
        return false;
      }
      try {
        const localPlayers = (await pGet('ks_players')) || [];
        const dev = localPlayers.find(p => p.role === 'coach' && p.staffLevel !== 'senior' && normalize(p.username) === normalize(rawUsername));
        await window.ksAuth.bootstrap({ h, pin, playerId: dev ? dev.id : 'td_ahmed', username: 'أحمد مجدي' });
        usedCloudAuth = true;
      } catch(err){
        errEl.textContent = 'تعذر تفعيل حساب المطور ('+(err.code||err.message)+')';
        return false;
      }
    } else if(rec){
      try {
        await window.ksAuth.signIn(h, rec.v, pin);
        usedCloudAuth = true;
      } catch(err){
        errEl.textContent = err.code === 'auth/too-many-requests'
          ? 'محاولات كتير غلط — استنى شوية وجرب تاني'
          : 'اسم المستخدم أو الرقم السري غير صحيح';
        return false;
      }
    }
    if(usedCloudAuth){ window._memCache = {}; window._baseCache = {}; }
  }

  const players = await ensureSeed();
  const hash = await sha256(pin);
  const normalizedInputUser = normalize(rawUsername);

  const match = players.find(p => {
    if(normalize(p.username) !== normalizedInputUser) return false;
    // pinHash أولاً (https) — pinText fallback (file://)
    const pinOk = (hash && p.pinHash && p.pinHash === hash) || (p.pinText && String(p.pinText) === String(pin));
    if(!pinOk) return false;
    if(loginRole === 'superadmin') return p.role === 'coach' && p.staffLevel === 'senior';
    if(loginRole === 'developer' || loginRole === 'coach') return p.role === 'coach' && p.staffLevel !== 'senior';
    return p.role === loginRole;
  });

  if(!match){
    if(usedCloudAuth) await window.ksAuth.signOut();
    errEl.textContent = 'اسم المستخدم أو الرقم السري غير صحيح (تأكد من اختيار التبويب الصحيح للأعلى)';
    return false;
  }

  session = {id: match.id, role: match.role, name: match.name, username: match.username, branch: match.branch, branches: match.branches, staffLevel: match.staffLevel};
  await pSet('ks_session', {id: match.id});
  await enterApp();
  return false;
}

async function tryAutoLogin(){
  const saved = await pGet('ks_session');
  if(!saved) return false;
  if(window.ksAuth && navigator.onLine){
    await window.ksAuth.ready();
    if(!window.ksAuth.currentUid()){ await pDel('ks_session'); return false; }  // لازم يدخل تاني بحسابه
  }
  const players = await ensureSeed();
  const match = players && players.find(p=>p.id===saved.id);
  if(!match) return false;
  session = {id: match.id, role: match.role, name: match.name, username: match.username, branch: match.branch, branches: match.branches, staffLevel: match.staffLevel};
  await enterApp();
  return true;
}

const PAGE_TO_SECTION = {profile:'notes', recs:'recs', homework:'homework', journey:'timeline', evaluations:'evals', schedule:'schedule'};
async function getLastSeen(pid){ return (await sGet('ks_lastseen_'+pid)) || {}; }
async function markSeen(pid, section){
  if(!section) return;
  const obj = await getLastSeen(pid);
  obj[section] = new Date().toISOString();
  await sSet('ks_lastseen_'+pid, obj);
}
async function computeUnreadBadges(pid){
  const lastSeen = await getLastSeen(pid);
  const sections = {notes:'ks_notes_', recs:'ks_recs_', homework:'ks_homework_', timeline:'ks_timeline_', evals:'ks_evals_', schedule:'ks_schedule_'};
  const out = {};
  for(const [key, prefix] of Object.entries(sections)){
    const arr = (await sGet(prefix+pid)) || [];
    const since = lastSeen[key] || '1970-01-01T00:00:00.000Z';
    out[key] = arr.filter(x => (x.createdAt || x.date+'T00:00:00.000Z') > since).length;
  }
  const skillEvalsArr = (await sGet('ks_skillevals_'+pid)) || [];
  const evalsSince = lastSeen['evals'] || '1970-01-01T00:00:00.000Z';
  out.evals += skillEvalsArr.filter(x => (x.createdAt || x.date+'T00:00:00.000Z') > evalsSince).length;
  return out; 
}

              ${svgIcon(ch.icon)} <span>${ch.label}</span> ${navBadge(badges[ch.id]||0)}

async function scopedPlayers(storageKey = 'ks_players'){
  let players = (await sGet(storageKey)||[]).filter(p=>p.role==='player');
  if(!sessionCanSeeAllBranches()) players = players.filter(p=>sessionCanSeeBranch(p.branch));
  if(session.role === 'trainer') players = players.filter(p=>p.trainer === session.name);
  return players;
}

async function getAllActivePlayers() {
  let acadPlayers = await scopedPlayers('ks_players');
  let teamPlayers = await scopedPlayers('ks_team_players');
  let combined = [...acadPlayers, ...teamPlayers];
  return combined.filter(p => (p.status || 'active') === 'active');
}

async function addExtraSubRow(month) {
    const subPrefix = 'ks_extra_subs_';
    let subs = (await sGet(subPrefix + month)) || [];
    subs.push({ playerId: '', externalName: '', externalBranch: '', workoutType: '', repeatCount: '', expected: '', paidAmt: '', paid: false, date: '', notes: '' });
    await sSet(subPrefix + month, subs);
    renderPage();
}

async function deleteExtraSubRow(index, month) {
    if(!confirm('هل تريد حذف هذا السجل؟')) return;
    const subPrefix = 'ks_extra_subs_';
    let subs = (await sGet(subPrefix + month)) || [];
    if(subs[index] && subs[index].treasuryEntryId){
      await syncTreasuryFromSubscription({existingId: subs[index].treasuryEntryId, amount: 0});
    }
    subs.splice(index, 1);
    await sSet(subPrefix + month, subs);
    showToast('تم حذف السجل بنجاح');
    renderPage();
}

async function updateExtraPlayer(index, playerId, month) {
    const subPrefix = 'ks_extra_subs_';
    let subs = (await sGet(subPrefix + month)) || [];
    if(subs[index]) {
        subs[index].playerId = playerId;
        await sSet(subPrefix + month, subs);
        renderPage();
    }
}

async function saveExtraSub(index, month) {
    const subPrefix = 'ks_extra_subs_';
    let subs = (await sGet(subPrefix + month)) || [];
    
    const workoutType = document.getElementById('ext_workoutType_'+index).value.trim();
    const repeatCount = document.getElementById('ext_repeatCount_'+index).value.trim();
    const expected = document.getElementById('ext_expected_'+index).value;
    const paidAmt = document.getElementById('ext_paidAmt_'+index).value;
    const status = document.getElementById('ext_status_'+index).value === 'true';
    const date = document.getElementById('ext_date_'+index).value;
    const notes = document.getElementById('ext_notes_'+index).value.trim();

    if(subs[index]) {
        if(subs[index].playerId === 'external') {
            const extNameEl = document.getElementById('ext_extName_'+index);
            const extBranchEl = document.getElementById('ext_extBranch_'+index);
            if(extNameEl) subs[index].externalName = extNameEl.value.trim();
            if(extBranchEl) subs[index].externalBranch = extBranchEl.value.trim();
        }

        // تحديد الفرع المستهدف
        let targetBranch = '';
        if(subs[index].playerId === 'external'){
          targetBranch = subs[index].externalBranch || '';
        } else if(subs[index].playerId){
          const allP = await getAllActivePlayers();
          const pp = allP.find(x=>x.id===subs[index].playerId);
          if(pp) targetBranch = pp.branch || '';
        }

        // إداري في فرع تاني → إرسال للموافقة مع كامل البيانات
        if(!isCoachOrSenior() && targetBranch && !sessionCanSeeBranch(targetBranch)){
          const playerName = subs[index].externalName || subs[index].playerId || '#'+index;
          const subData = {
            workoutType, repeatCount, expected, paidAmt, paid: status, date, notes,
            externalName: subs[index].externalName || '',
            externalBranch: subs[index].externalBranch || '',
            playerId: subs[index].playerId
          };
          await submitForApproval('extra_edit', {index, month, subData},
            `تدريب إضافي: ${playerName} — فرع ${targetBranch} — ${month} — ${Number(paidAmt).toLocaleString()} ج.م`);
          return;
        }
        subs[index].workoutType = workoutType;
        subs[index].repeatCount = repeatCount;
        subs[index].expected = expected;
        subs[index].paidAmt = paidAmt;
        subs[index].paid = status;
        subs[index].date = date;
        subs[index].notes = notes;

        let branch = '', beneficiaryName = '';
        if(subs[index].playerId === 'external'){
          branch = subs[index].externalBranch || '';
          beneficiaryName = subs[index].externalName || 'لاعب خارجي';
        } else if(subs[index].playerId){
          const allPlayers = await getAllActivePlayers();
          const p = allPlayers.find(x=>x.id===subs[index].playerId);
          if(p){ branch = p.branch; beneficiaryName = p.name; }
        }

        if(branch){
          const amount = Number(paidAmt)||0;
          const linkedId = await syncTreasuryFromSubscription({
            existingId: subs[index].treasuryEntryId,
            branch,
            category: 'اشتراك',
            amount,
            date,
            beneficiaryName,
            statement: `تمرين إضافي (${workoutType||'—'}) - ${monthNameFromKey(month)}`,
            dueMonthName: monthNameFromKey(month)
          });
          subs[index].treasuryEntryId = linkedId;
        }

        await sSet(subPrefix + month, subs);
        showToast('تم حفظ بيانات التمرين الإضافي بنجاح 🎯');
        renderPage();
    }
}

async function pageFitnessSubscriptions() {
    if(session.role === 'trainer') return emptyState('صفحة اشتراكات الفيتنس غير متاحة لحسابات المدربين');
    const month = window._fitnessSubsMonth || todayISO().slice(0, 7);
    const subPrefix = 'ks_fitness_subs_';
    
    let allPlayers = await getAllActivePlayers();
    let subs = (await sGet(subPrefix + month)) || [];
    const subInScope = (sub) => !sub.playerId ? true : (sub.playerId === 'external' ? (!sub.externalBranch || sessionCanSeeBranch(sub.externalBranch)) : allPlayers.some(p => p.id === sub.playerId));
    
    let branches = [];
    if (sessionCanSeeAllBranches()) {
        branches = [...new Set(allPlayers.map(p => p.branch))].filter(Boolean);
    }
    
    let currentFilter = window._fitnessSubsBranchFilter || 'all';

    let subsCountByBranch = {};
    let validSubsCount = 0;
    subs.forEach(sub => {
        if (!subInScope(sub)) return;
        let branch = '';
        if (sub.playerId === 'external') {
            branch = sub.externalBranch || 'خارجي';
        } else if (sub.playerId) {
            let p = allPlayers.find(x => x.id === sub.playerId);
            if (p) branch = p.branch;
        }
        if (branch) {
            subsCountByBranch[branch] = (subsCountByBranch[branch] || 0) + 1;
            validSubsCount++;
        }
    });

    let filterHtml = '';
    if (branches.length > 0) {
        filterHtml = `
        <div class="tabs-row" style="margin-bottom: 16px;">
            <button class="tab-btn ${currentFilter === 'all' ? 'active' : ''}" onclick="setFitnessSubsBranchFilter('all')">الكل (${validSubsCount})</button>

                const count = subsCountByBranch[b] || 0;
                return `<button class="tab-btn ${currentFilter === b ? 'active' : ''}" onclick="setFitnessSubsBranchFilter('${b}')">${b} (${count})</button>`;

    let filteredPlayersForDropdown = allPlayers;

        filteredPlayersForDropdown = allPlayers.filter(p => p.branch === currentFilter);

    let tableRows = subs.map((sub, index) => {
        if (!subInScope(sub)) return '';
        const isExternal = sub.playerId === 'external';
        const playerObj = !isExternal ? (allPlayers.find(p => p.id === sub.playerId) || null) : null;
        
        if (currentFilter !== 'all') {
            if (isExternal) {
                if (sub.externalBranch && sub.externalBranch !== currentFilter) return '';

                </select>

async function addFitnessSubRow(month) {
    const subPrefix = 'ks_fitness_subs_';
    let subs = (await sGet(subPrefix + month)) || [];
    subs.push({ playerId: '', externalName: '', externalBranch: '', sessionsRemaining: '', expected: '', paidAmt: '', paid: false, date: '', notes: '' });
    await sSet(subPrefix + month, subs);
    renderPage();
}

async function deleteFitnessSubRow(index, month) {
    if(!confirm('هل تريد حذف هذا السجل؟')) return;
    const subPrefix = 'ks_fitness_subs_';
    let subs = (await sGet(subPrefix + month)) || [];
    if(subs[index] && subs[index].treasuryEntryId){
      await syncTreasuryFromSubscription({existingId: subs[index].treasuryEntryId, amount: 0});
    }
    subs.splice(index, 1);
    await sSet(subPrefix + month, subs);
    showToast('تم حذف السجل بنجاح');
    renderPage();
}

async function updateFitnessPlayer(index, playerId, month) {
    const subPrefix = 'ks_fitness_subs_';
    let subs = (await sGet(subPrefix + month)) || [];
    if(subs[index]) {
        subs[index].playerId = playerId;
        await sSet(subPrefix + month, subs);
        renderPage();
    }
}

async function saveFitnessSub(index, month) {
    const subPrefix = 'ks_fitness_subs_';
    let subs = (await sGet(subPrefix + month)) || [];
    
    const sessions = document.getElementById('fit_sessions_'+index).value;
    const expected = document.getElementById('fit_expected_'+index).value;
    const paidAmt = document.getElementById('fit_paidAmt_'+index).value;
    const status = document.getElementById('fit_status_'+index).value === 'true';
    const date = document.getElementById('fit_date_'+index).value;
    const notes = document.getElementById('fit_notes_'+index).value.trim();

    if(subs[index]) {
        if(subs[index].playerId === 'external') {
            const extNameEl = document.getElementById('fit_extName_'+index);
            const extBranchEl = document.getElementById('fit_extBranch_'+index);
            if(extNameEl) subs[index].externalName = extNameEl.value.trim();
            if(extBranchEl) subs[index].externalBranch = extBranchEl.value.trim();
        }

        // تحديد الفرع المستهدف
        let targetBranch = '';
        if(subs[index].playerId === 'external'){
          targetBranch = subs[index].externalBranch || '';
        } else if(subs[index].playerId){
          const allP = await getAllActivePlayers();
          const pp = allP.find(x=>x.id===subs[index].playerId);
          if(pp) targetBranch = pp.branch || '';
        }

        // إداري في فرع تاني → إرسال للموافقة مع كامل البيانات
        if(!isCoachOrSenior() && targetBranch && !sessionCanSeeBranch(targetBranch)){
          const playerName = subs[index].externalName || subs[index].playerId || '#'+index;
          const subData = {
            sessions, expected, paidAmt, paid: status, date, notes,
            externalName: subs[index].externalName || '',
            externalBranch: subs[index].externalBranch || '',
            playerId: subs[index].playerId
          };
          await submitForApproval('fitness_edit', {index, month, subData},
            `اشتراك فتنس: ${playerName} — فرع ${targetBranch} — ${month} — ${Number(paidAmt).toLocaleString()} ج.م`);
          return;
        }

        subs[index].sessionsRemaining = sessions;
        subs[index].expected = expected;
        subs[index].paidAmt = paidAmt;
        subs[index].paid = status;
        subs[index].date = date;
        subs[index].notes = notes;

        let branch = '', beneficiaryName = '';
        if(subs[index].playerId === 'external'){
          branch = subs[index].externalBranch || '';
          beneficiaryName = subs[index].externalName || 'لاعب خارجي';
        } else if(subs[index].playerId){
          const allPlayers = await getAllActivePlayers();
          const p = allPlayers.find(x=>x.id===subs[index].playerId);
          if(p){ branch = p.branch; beneficiaryName = p.name; }
        }

        if(branch){
          const amount = Number(paidAmt)||0;
          const linkedId = await syncTreasuryFromSubscription({
            existingId: subs[index].treasuryEntryId,
            branch,
            category: 'فيتنس',
            amount,
            date,
            beneficiaryName,
            statement: `اشتراك فيتنس - ${monthNameFromKey(month)}`,
            dueMonthName: monthNameFromKey(month)
          });
          subs[index].treasuryEntryId = linkedId;
        }

        await sSet(subPrefix + month, subs);
        showToast('تم حفظ بيانات اشتراك الفيتنس بنجاح 🏋️‍♂️');
        renderPage();
    }
}

async function saveSub(pid, month, isTeam = false) {
    const expected = document.getElementById('sub_expected_'+pid).value;
    const paidAmt = document.getElementById('sub_paidAmt_'+pid).value;
    const status = document.getElementById('sub_status_'+pid).value === 'true';
    const date = document.getElementById('sub_date_'+pid).value;
    const notes = document.getElementById('sub_notes_'+pid).value.trim();
    const method = (document.getElementById('sub_method_'+pid)||{}).value || '';

    const subPrefix = isTeam ? 'ks_team_subs_' : 'ks_subs_';
    let subs = (await sGet(subPrefix + month)) || {};
    const existing = subs[pid] || {};
    const isNewEntry = !existing.paidAmt && !existing.paid; // إدخال جديد بدون بيانات سابقة

    // غير coach/senior:
    //   - إدخال جديد → حفظ مباشر
    //   - تعديل على بيانات موجودة → إرسال للموافقة
    if(!isCoachOrSenior() && !isNewEntry){
      const allP = [...((await sGet('ks_players'))||[]), ...((await sGet('ks_team_players'))||[])];
      const player = allP.find(p=>p.id===pid);
      const subData = {expected, paidAmt, paid: status, date, notes, method, treasuryEntryId: existing.treasuryEntryId};
      await submitForApproval('sub_edit', {pid, month, isTeam, subData},
        `تعديل اشتراك ${player?.name||pid} — ${month} — ${Number(paidAmt).toLocaleString()} ج.م`);
      return;
    }

    subs[pid] = { expected, paidAmt, paid: status, date, notes, method, treasuryEntryId: existing.treasuryEntryId };

    const storageKey = isTeam ? 'ks_team_players' : 'ks_players';
    const players = (await sGet(storageKey)) || [];
    const player = players.find(p=>p.id===pid);

    if(player && player.branch){
      const amount = Number(paidAmt)||0;
      // تحديد receiptType من طريقة الدفع
      const methodToReceipt = {
        'خزينة نقدي': 'وارد خزينة',
        'بنك':        'وارد بنك',
        'إنستاباي':   'انستاباي',
        'ميزا':       'وارد بنك',
      };
      const receiptType = methodToReceipt[method] || 'وارد خزينة';
      // فقط لو مسدد → سجّل في الخزينة | لو لم يسدد → احذف القيد لو موجود
      const linkedId = await syncTreasuryFromSubscription({
        existingId: existing.treasuryEntryId,
        branch: player.branch,
        category: isTeam ? 'جماعي' : 'اشتراك',
        receiptType,
        amount: status ? amount : 0,  // 0 = يحذف القيد لو مش مسدد
        date,
        beneficiaryName: player.name,
        statement: `اشتراك ${isTeam?'الفريق':'الأكاديمية'} - ${monthNameFromKey(month)}`,
        dueMonthName: monthNameFromKey(month)
      });
      subs[pid].treasuryEntryId = linkedId;
    }

    await sSet(subPrefix + month, subs);
    showToast('تم حفظ بيانات الاشتراك بنجاح 💰');
    // Log activity
    const methodLabel = method ? ` (${method})` : '';
    await logPlayerActivity(pid, 'sub', `تم تسجيل اشتراك ${month} — ${Number(paidAmt).toLocaleString()} ج.م${methodLabel}`);
    renderPage();
}

const TREASURY_CATEGORIES = ['اشتراك','ايجار مثبت','ايجار غير مثبت','وي فت','فيتنس','مرافق','استروكر','جماعي','جماعي خارجي','الاعداد','ايرادات اخرى','معسكر','بطولة','الاتحاد','مصروفات','عيد','سلف','راتب','راتب مشاهر','تمويل','رصيد مرحل','شهر قادم','تأمين ملاعب مثبتة','فيتنس / جيم'];
const TREASURY_LEVELS = ['Beginner','L1','L2','L3','Gold','Platinum','Diamond','Private الاكاديمية (البراعم)','Private الفريق (مدرب من الخارج)','Private الفريق (مدرب الاكاديمية)'];
const TREASURY_ACTIVITIES = ['الاسكواش','فيتنس اسكواش','بادل','الريشة الطائرة','فيتنس الريشة الطائرة','الجمباز','الكاراتيه','كونغ فو','كيك بوكسينج','كورة قدم','مساج و حجامة','MMA','EMS'];

function isCoachOrSenior(){
  return session.role === 'coach';
}

async function submitForApproval(type, payload, description){
  const pending = (await sGet('ks_pending_approvals')) || [];
  const req = {
    id: uid(),
    type,               // 'treasury_entry' | 'sub_edit' | 'fitness_edit' | 'extra_edit'
    payload,            // full data needed to apply the change
    description,        // human-readable summary
    requestedBy: session.name,
    requestedByRole: session.role,
    requestedAt: new Date().toISOString(),
    status: 'pending'  // pending | approved | rejected
  };
  pending.push(req);
  await sSet('ks_pending_approvals', pending);
  showToast('✅ تم إرسال التعديل للمدير الفني للموافقة');
}

async function getPendingApprovalsCount(){
  if(!isCoachOrSenior()) return 0;
  const pending = (await sGet('ks_pending_approvals')) || [];
  return pending.filter(r => r.status === 'pending').length;
}

async function approveRequest(reqId){
  const pending = (await sGet('ks_pending_approvals')) || [];
  const req = pending.find(r => r.id === reqId);
  if(!req) return;
  req.status = 'approved';
  req.approvedBy = session.name;
  req.approvedAt = new Date().toISOString();

  // Apply the change
  try {
    if(req.type === 'treasury_entry'){
      const {branch, entryId, data} = req.payload;
      let all = (await sGet('ks_treasury_entries')) || [];
      if(entryId){
        const idx = all.findIndex(x=>x.id===entryId);
        if(idx>-1){ const before={...all[idx]}; all[idx]={...all[idx],...data}; await logTreasuryAudit('edit',before,all[idx]); }
      } else {
        const newEntry = {id:uid(), createdAt:new Date().toISOString(), createdBy:req.requestedBy, ...data};
        all.push(newEntry);
        await logTreasuryAudit('create', null, newEntry);
      }
      await sSet('ks_treasury_entries', all);
    } else if(req.type === 'sub_edit'){
      const {pid, month, isTeam, subData} = req.payload;
      const subPrefix = isTeam ? 'ks_team_subs_' : 'ks_subs_';
      let subs = (await sGet(subPrefix + month)) || {};
      subs[pid] = {...(subs[pid]||{}), ...subData};
      await sSet(subPrefix + month, subs);
    } else if(req.type === 'fitness_edit'){
      const {index, month, subData} = req.payload;
      let subs = (await sGet('ks_fitness_subs_'+month)) || [];
      if(subs[index]){
        subs[index] = {...subs[index], ...subData};
        // طبّق الاسم والفرع لو موجودين في الـ payload
        if(subData.externalName) subs[index].externalName = subData.externalName;
        if(subData.externalBranch) subs[index].externalBranch = subData.externalBranch;
        // سجّل في الخزينة
        const branch = subs[index].externalBranch || '';
        const beneficiaryName = subs[index].externalName || 'لاعب خارجي';
        if(branch && subData.paidAmt){
          const linkedId = await syncTreasuryFromSubscription({
            existingId: subs[index].treasuryEntryId,
            branch, category:'فيتنس / جيم',
            amount: Number(subData.paidAmt)||0,
            date: subData.date||'', beneficiaryName,
            statement:`اشتراك فتنس - ${monthNameFromKey(month)}`,
            dueMonthName: monthNameFromKey(month)
          });
          subs[index].treasuryEntryId = linkedId;
        }
      }
      await sSet('ks_fitness_subs_'+month, subs);
    } else if(req.type === 'extra_edit'){
      const {index, month, subData} = req.payload;
      let subs = (await sGet('ks_extra_subs_'+month)) || [];
      if(subs[index]){
        subs[index] = {...subs[index], ...subData};
        // طبّق الاسم والفرع لو موجودين في الـ payload
        if(subData.externalName) subs[index].externalName = subData.externalName;
        if(subData.externalBranch) subs[index].externalBranch = subData.externalBranch;
        // سجّل في الخزينة
        const branch = subs[index].externalBranch || '';
        const beneficiaryName = subs[index].externalName || 'لاعب خارجي';
        if(branch && subData.paidAmt){
          const linkedId = await syncTreasuryFromSubscription({
            existingId: subs[index].treasuryEntryId,
            branch, category:'اشتراك',
            amount: Number(subData.paidAmt)||0,
            date: subData.date||'', beneficiaryName,
            statement:`تمرين إضافي (${subData.workoutType||'—'}) - ${monthNameFromKey(month)}`,
            dueMonthName: monthNameFromKey(month)
          });
          subs[index].treasuryEntryId = linkedId;
        }
      }
      await sSet('ks_extra_subs_'+month, subs);
    }
    await sSet('ks_pending_approvals', pending);
    showToast('✅ تم تطبيق التعديل بنجاح');
  } catch(e){ showToast('❌ حصل خطأ أثناء تطبيق التعديل'); }
  renderPage();
}

async function rejectRequest(reqId){

  req.rejectedAt = new Date().toISOString();
  await sSet('ks_pending_approvals', pending);

async function logTreasuryAudit(action, entryBefore, entryAfter){
  const log = (await sGet('ks_treasury_audit')) || [];
  log.push({
    id: uid(),
    action,
    entryId: (entryAfter||entryBefore)?.id,
    branch: (entryAfter||entryBefore)?.branch,
    before: entryBefore ? {...entryBefore} : null,
    after: entryAfter ? {...entryAfter} : null,
    by: session.name,
    byRole: session.role,
    at: new Date().toISOString()
  });
  await sSet('ks_treasury_audit', log);
}

async function isPeriodLocked(branch, year, month){
  if(month === 'all') return false;
  const locks = (await sGet('ks_treasury_locks')) || [];
  const key = branch+'|'+year+'-'+String(month).padStart(2,'0');
  return locks.includes(key);
}

async function toggleTreasuryPeriodLock(branch, year, month){
  if(month === 'all'){ showToast('اختاري شهر محدد الأول عشان تقفليه أو تفتحيه'); return; }
  let locks = (await sGet('ks_treasury_locks')) || [];
  const key = branch+'|'+year+'-'+String(month).padStart(2,'0');
  if(locks.includes(key)){
    if(!confirm('متأكد إنك عايز تفتحي قفل شهر '+TREASURY_MONTHS[Number(month)-1]+' '+year+'؟')) return;
    locks = locks.filter(k=>k!==key);
    await sSet('ks_treasury_locks', locks);
    showToast('تم فتح قفل الشهر 🔓');
  } else {
    if(!confirm('هتقفلي شهر '+TREASURY_MONTHS[Number(month)-1]+' '+year+'؟ بعد القفل محدش هيقدر يضيف أو يعدل أو يحذف فيه غير الإدارة العليا.')) return;
    locks.push(key);
    await sSet('ks_treasury_locks', locks);
    showToast('تم قفل الشهر 🔒');
  }
  renderPage();
}

async function guardTreasuryLock(branch, dateStr){
  if(!dateStr) return true;
  const y = dateStr.slice(0,4), m = String(Number(dateStr.slice(5,7)));
  const locked = await isPeriodLocked(branch, y, m);
  if(!locked) return true;
  if(session.role === 'coach'){
    return confirm('⚠️ الشهر ده مقفول. متأكد إنك عايز تعدل فيه كإدارة عليا؟');
  }
  showToast('🔒 الشهر ده مقفول، محدش يقدر يضيف أو يعدل أو يحذف فيه غير الإدارة العليا');
  return false;
}

async function getCarriedBalance(branch, year, month){
  const all = ((await sGet('ks_treasury_entries')) || []).filter(e=>!e.deleted);
  const cutoff = (month==='all') ? (year+'-01-01') : (year+'-'+String(month).padStart(2,'0')+'-01');
  const priorEntries = all.filter(e=>e.branch===branch && e.entryDate && e.entryDate < cutoff);
  const inflow = priorEntries.reduce((s,e)=> s + (treasuryReceiptSign(e.receiptType)>0? Number(e.amount||0):0), 0);
  const outflow = priorEntries.reduce((s,e)=> s + (treasuryReceiptSign(e.receiptType)<0? Number(e.amount||0):0), 0);
  return inflow - outflow;
}

function monthNameFromKey(monthKey){
  if(!monthKey) return '';
  const parts = monthKey.split('-');
  return TREASURY_MONTHS[Number(parts[1])-1] || '';
}

async function syncTreasuryFromSubscription(opts){
  let all = (await sGet('ks_treasury_entries')) || [];
  let idx = opts.existingId ? all.findIndex(e=>e.id===opts.existingId) : -1;

  if(!opts.amount || opts.amount <= 0){
    if(idx>-1 && !all[idx].deleted){
      const before = {...all[idx]};
      all[idx].deleted = true;
      all[idx].deletedAt = new Date().toISOString();
      all[idx].deletedBy = session.name + ' (تلقائي)';
      await sSet('ks_treasury_entries', all);
      await logTreasuryAudit('delete', before, null);
    }
    return opts.existingId || null;
  }

  if(idx>-1){
    const before = {...all[idx]};
    all[idx].amount = opts.amount;
    all[idx].entryDate = opts.date || all[idx].entryDate;
    all[idx].beneficiaryName = opts.beneficiaryName;
    all[idx].statement = opts.statement;
    all[idx].dueMonth = opts.dueMonthName;
    all[idx].branch = opts.branch;
    all[idx].category = opts.category;
    all[idx].receiptType = opts.receiptType || all[idx].receiptType || 'وارد خزينة';
    all[idx].deleted = false;
    await sSet('ks_treasury_entries', all);
    await logTreasuryAudit('edit', before, all[idx]);
    return all[idx].id;
  } else {
    const newEntry = {
      id: uid(), branch: opts.branch, entryDate: opts.date || todayISO(), dueMonth: opts.dueMonthName,
      receiptNo: '', receiptType: opts.receiptType || 'وارد خزينة', amount: opts.amount, visaBatchNo: '',
      category: opts.category, receivedFrom: opts.beneficiaryName, deliveredBy: session.name,
      beneficiaryName: opts.beneficiaryName, coachName: '', rentalDuration: '', level: '', activityType: '',
      statement: opts.statement, createdAt: new Date().toISOString(), createdBy: session.name,
      autoLinked: true
    };
    all.push(newEntry);
    await sSet('ks_treasury_entries', all);
    await logTreasuryAudit('create', null, newEntry);
    return newEntry.id;
  }
}
