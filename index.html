async function pageCoachHome(){
  const today = todayISO();
  const currentMonth = today.slice(0,7);
  const monthLabel = TREASURY_MONTHS[Number(currentMonth.slice(5))-1];
  const dayNames = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  const dayName = dayNames[new Date().getDay()];
  const scopeLabel = sessionCanSeeAllBranches() ? 'كل الفروع' : sessionBranchLabel();

  // ── data gathering ──────────────────────────────────────
  let players = await scopedPlayers('ks_players');
  players = players.filter(p => (p.status||'active') === 'active');

  let pendingHw=0, totalAttend30=0, totalAttendMonth=0;
  const urgent=[], followUp=[], congrats=[];
  const leaderboard=[];

  await Promise.all(players.map(async p=>{
    const [hw, att] = await Promise.all([sGet('ks_homework_'+p.id), sGet('ks_attendance_'+p.id)]);
    const risk = getCachedPlayerRiskSync(p.id);
    const hwArr = hw||[], attArr = att||[];

    pendingHw += hwArr.filter(h=>!h.done).length;
    const att30 = attArr.filter(d=>d>=daysAgo(30)).length;
    const attMonth = attArr.filter(d=>d.startsWith(currentMonth)).length;
    totalAttend30 += att30;
    totalAttendMonth += attMonth;

    // 🔴 urgent: absent > 14 days
    const noAttend14 = attArr.filter(d=>d>=daysAgo(14)).length===0;
    if(noAttend14 && p.joinDate < daysAgo(14))
      urgent.push({player:p, reason:'غائب أكثر من أسبوعين', icon:'🔴'});

    // 🔴 urgent: high injury risk
    if(risk.risk==='high')
      urgent.push({player:p, reason:'خطر إصابة مرتفع', icon:'🔴'});

    // 🟡 follow-up: pending homework
    const pendingPlayer = hwArr.filter(h=>!h.done).length;
    if(pendingPlayer>0)
      followUp.push({player:p, reason:`${pendingPlayer} واجب متأخر`, icon:'🟡'});

    // score for leaderboard & congrats
    const monthHw = hwArr.filter(h=>h.done&&(h.date||'').startsWith(currentMonth)).length;
    const score = (attMonth*10)+(monthHw*5);
    if(score>0) leaderboard.push({player:p, score, branch:p.branch});
  }));

  leaderboard.sort((a,b)=>b.score-a.score);
  const topPlayers = leaderboard.slice(0,5);
  topPlayers.forEach(t=>{
    if(t.score>=50) congrats.push({player:t.player, reason:`نقاط التزام ممتازة هذا الشهر (${t.score} نقطة)`, icon:'🟢'});
  });

  // subscription expiry alerts — فقط للمدير الفني والإداريين، مش للمدربين
  if(session.role !== 'trainer'){
    const subAlerts = await getExpiringSubscriptions();
    subAlerts.forEach(s => {
      if(s.type === 'unpaid') urgent.push({player: s.player, reason: s.reason, icon: '🔴'});
      else followUp.push({player: s.player, reason: s.reason, icon: '🟡'});
    });
  }

  const avgAttend = players.length ? (totalAttend30/players.length).toFixed(1) : '0';
  const attendRate = players.length ? Math.round((totalAttendMonth/(players.length*12))*100) : 0;

  // treasury this month
  const allEntries = ((await sGet('ks_treasury_entries'))||[]).filter(e=>!e.deleted&&e.entryDate&&e.entryDate.startsWith(currentMonth));
  const monthlyInflow = allEntries.reduce((s,e)=>s+(treasuryReceiptSign(e.receiptType)>0?Number(e.amount||0):0),0);

  // subscriptions collection rate
  const acadSubs = (await sGet('ks_subs_'+currentMonth))||{};
  let subExpected=0, subCollected=0;
  players.forEach(p=>{ subExpected+=Number((acadSubs[p.id]||{}).expected||0); subCollected+=Number((acadSubs[p.id]||{}).paidAmt||0); });
  const collectionRate = subExpected>0 ? Math.round((subCollected/subExpected)*100) : 0;
  const rateColor = collectionRate>=80?'var(--ok)':collectionRate>=50?'var(--warn)':'var(--red-light)';

  // attention list: urgent first, then followup, then congrats (capped at 8 total)
  const attentionList = [...urgent, ...followUp, ...congrats].slice(0,8);

  // KPI vs last month delta
  const prevMonth = (()=>{ const d=new Date(currentMonth+'-01'); d.setMonth(d.getMonth()-1); return d.toISOString().slice(0,7); })();
  const prevEntries = ((await sGet('ks_treasury_entries'))||[]).filter(e=>!e.deleted&&e.entryDate&&e.entryDate.startsWith(prevMonth));
  const prevInflow = prevEntries.reduce((s,e)=>s+(treasuryReceiptSign(e.receiptType)>0?Number(e.amount||0):0),0);
  const inflowDelta = prevInflow>0 ? Math.round(((monthlyInflow-prevInflow)/prevInflow)*100) : null;

async function submitAddCoach(e){
  e.preventDefault();
  const name = document.getElementById('ncName').value.trim();
  const branch = document.getElementById('ncBranch').value.trim();
  const coaches = (await sGet('ks_coaches')) || [];
  coaches.push({id: uid(), name, branch});
  await sSet('ks_coaches', coaches);
  closeModal();
  showToast('تمت إضافة المدرب بنجاح');
  renderPage();
  return false;
}

async function deleteCoach(coachId){
  if(!confirm('متأكد من حذف هذا المدرب؟')) return;
  let coaches = (await sGet('ks_coaches')) || [];
  coaches = coaches.filter(c => c.id !== coachId);
  await sSet('ks_coaches', coaches);
  let checklists = (await sGet('ks_coach_checklists')) || {};
  delete checklists[coachId];
  await sSet('ks_coach_checklists', checklists);
  showToast('تم حذف المدرب');
  renderPage();
}

function openAddCoachTaskModal(coachId){
  document.getElementById('modalRoot').innerHTML = `
  <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="card modal">
      <h3>إضافة تكليف فني جديد</h3>

        <div class="modal-actions">
          <button type="button" class="btn btn-ghost btn-block" onclick="closeModal()">إلغاء</button>
          <button type="submit" class="btn btn-primary btn-block">إضافة التكليف</button>
        </div>
      </form>
    </div>

async function submitAddCoachTask(e, coachId){
  e.preventDefault();
  const text = document.getElementById('ctText').value.trim();
  const checklists = (await sGet('ks_coach_checklists')) || {};
  if(!checklists[coachId]) checklists[coachId] = [];
  checklists[coachId].push({id: uid(), text, done: false});
  await sSet('ks_coach_checklists', checklists);
  closeModal();
  showToast('تم إضافة التكليف بنجاح');
  renderPage();
  return false;
}

async function saveCoachChecklist(coachId) {
  const container = document.getElementById('tasks-list-' + coachId);
  if (!container) return;
  
  const checklists = (await sGet('ks_coach_checklists')) || {};
  let currentTasks = checklists[coachId] || [];

  const checkboxes = container.querySelectorAll('input[type="checkbox"]');
  checkboxes.forEach(cb => {
    const taskId = cb.getAttribute('data-task-id');
    const task = currentTasks.find(t => t.id === taskId);
    if (task) {
      task.done = cb.checked;
    }
  });

  checklists[coachId] = currentTasks;
  await sSet('ks_coach_checklists', checklists);
  showToast('تم حفظ مهام المدرب بنجاح ✅');
  renderPage();
}

async function deleteCoachTask(coachId, taskId){
  const checklists = (await sGet('ks_coach_checklists')) || {};
  if(checklists[coachId]){
    checklists[coachId] = checklists[coachId].filter(t => t.id !== taskId);
    await sSet('ks_coach_checklists', checklists);
    showToast('تم حذف التكليف');
    renderPage();
  }
}

async function pagePlayersList(){
  let players = await scopedPlayers('ks_players');
  const scopeLabel = !sessionCanSeeAllBranches() ? ' — '+sessionBranchLabel() : '';
  
  players.forEach(p => p.status = p.status || 'active');
  const tab = window._playerFilterTab || 'active';
  let filteredPlayers = players.filter(p => p.status === tab);

  const q = (window._playerSearch||'').trim();
  if(q){
    const needle = q.toLowerCase();
    filteredPlayers = filteredPlayers.filter(p =>
      p.name.toLowerCase().includes(needle) ||
      p.branch.toLowerCase().includes(needle) ||
      (p.level||'').toLowerCase().includes(needle) ||
      (p.trainer||'').toLowerCase().includes(needle) ||
      (p.code||'').toLowerCase().includes(needle));
  }

  // Feature 4: extra filters
  const filterBranch = window._plFilterBranch || '';
  const filterLevel  = window._plFilterLevel  || '';
  const filterSort   = window._plFilterSort   || 'branch';
  const filterSub    = window._plFilterSub    || '';
  if(filterBranch) filteredPlayers = filteredPlayers.filter(p=>p.branch===filterBranch);
  if(filterLevel)  filteredPlayers = filteredPlayers.filter(p=>(p.level||'')=== filterLevel);

  // Load sub data for sub-filter and card badge
  const currentMonth = todayISO().slice(0,7);
  const acadSubs = (await sGet('ks_subs_'+currentMonth))||{};
  const teamSubs = (await sGet('ks_team_subs_'+currentMonth))||{};

  if(filterSub === 'paid')    filteredPlayers = filteredPlayers.filter(p=>{ const s=acadSubs[p.id]||teamSubs[p.id]||{}; return s.paid===true||s.paid==='true'; });
  if(filterSub === 'unpaid')  filteredPlayers = filteredPlayers.filter(p=>{ const s=acadSubs[p.id]||teamSubs[p.id]||{}; return Number(s.expected||0)>0 && s.paid!==true && s.paid!=='true'; });

  // Sort
  if(filterSort==='name')    filteredPlayers.sort((a,b)=>a.name.localeCompare(b.name,'ar'));
  else if(filterSort==='join') filteredPlayers.sort((a,b)=>(b.joinDate||'').localeCompare(a.joinDate||''));
  else if(filterSort==='code') filteredPlayers.sort((a,b)=>Number((a.code||'').replace(/\D/g,''))-Number((b.code||'').replace(/\D/g,'')));

  const allBranches = [...new Set(players.map(p=>p.branch).filter(Boolean))].sort();
  const allLevels   = [...new Set(players.map(p=>p.level).filter(Boolean))].sort();

  const groups = {};
  if(filterSort==='branch'){
    filteredPlayers.forEach(p=>{ (groups[p.branch] = groups[p.branch]||[]).push(p); });
  } else {
    groups['__all__'] = filteredPlayers;
  }
  const branchNames = filterSort==='branch'
    ? Object.keys(groups).sort((a,b)=>groups[b].length-groups[a].length)
    : ['__all__'];

  const getSubBadge = (p) => {
    if(session.role === 'trainer') return ''; // المدرب لا يرى حالة السداد
    const s = acadSubs[p.id]||teamSubs[p.id]||{};
    if(!Number(s.expected||0)) return '';
    const isPaid = s.paid===true||s.paid==='true';
    const rem = Number(s.expected||0)-Number(s.paidAmt||0);
    if(isPaid) return `<span style="font-size:10.5px; font-weight:700; color:var(--ok);">✅ مسدد</span>`;
    return `<span style="font-size:10.5px; font-weight:700; color:var(--red-light);">❌ متبقي ${rem.toLocaleString()} ج.م</span>`;
  };

  const cardHtmlSync = (p) => {
    const risk = getCachedPlayerRiskSync(p.id);
    const computedAge = getPlayerAge(p);
    const subBadge = getSubBadge(p);
    return `
      <div class="card player-card" data-level="${(p.level||'').toLowerCase().replace(/\s+/g,'')}" onclick="openPlayer('${p.id}')">
        <div class="player-card-inner">
        <div class="player-card-top">
          <div class="user-avatar" style="${p.avatar ? 'background-image:url('+p.avatar+'); background-size:cover; background-position:center; color:transparent;' : ''}">${p.avatar ? '' : p.name.charAt(0)}</div>
          <div><div class="player-card-name">${p.name}</div><div class="player-card-meta">${p.branch}${computedAge!=null?' · '+computedAge+' سنة':''}</div></div>
        </div>
        <div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:6px;">
          <span class="pill blue">كود: ${p.code||'—'}</span>
          <span class="pill" style="background:rgba(255,255,255,0.06); color:var(--paper-dim);">مستوى ${p.level}</span>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:4px;">
          <div style="font-size:11.5px; font-weight:700; color:${risk.color};">${risk.label}</div>
          ${subBadge}
        </div>
        </div>
      </div>`;
  };

  let body = '';
  if (branchNames.length <= 1) {
    body = `<div class="player-grid">${filteredPlayers.map(p => cardHtmlSync(p)).join('') || ''}</div>`;
  } else {
    body = branchNames.map(b => `
      <div style="margin-bottom:22px;">
        <div class="section-title" style="margin-bottom:10px;">${b} <span class="muted" style="font-weight:400; font-size:12.5px;">— ${groups[b].length} لاعب</span></div>
        <div class="player-grid">${groups[b].map(p => cardHtmlSync(p)).join('')}</div>
      </div>`).join('');
  }

  const activeCount = players.filter(p => p.status === 'active').length;
  const excusedCount = players.filter(p => p.status === 'excused').length;

  return `
  <div class="topbar">
    <div><div class="page-title">لاعبين الأكاديمية${scopeLabel}</div><div class="page-sub">إجمالي المسجلين: ${players.length} لاعب — معروض: ${filteredPlayers.length}</div></div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      ${(session.role === 'coach' || session.role === 'admin') ? `<button class="btn btn-ghost" onclick="openImportPlayersModal(false)">📥 استيراد CSV</button>` : ''}
      ${(session.role === 'coach' || session.role === 'admin') ? `<button class="btn btn-ghost" onclick="exportPlayers()">📤 تصدير CSV</button>` : ''}
      ${(session.role === 'coach' || session.role === 'admin') ? `<button class="btn btn-primary" onclick="openAddPlayerModal(false)">${svgIcon('plus')} إضافة لاعب جديد</button>` : ''}
    </div>
  </div>

async function pageTeamPlayersList(){
  let teamPlayers = await scopedPlayers('ks_team_players');
  const scopeLabel = !sessionCanSeeAllBranches() ? ' — '+sessionBranchLabel() : '';
  teamPlayers.forEach(p => p.status = p.status || 'active');
  const tab = window._teamPlayerFilterTab || 'active';
  let filteredPlayers = teamPlayers.filter(p => p.status === tab);

  // بحث نصي
  const q = (window._teamPlayerSearch||'').trim();
  if(q){ const needle=q.toLowerCase(); filteredPlayers=filteredPlayers.filter(p=>p.name.toLowerCase().includes(needle)||p.branch.toLowerCase().includes(needle)||(p.level||'').toLowerCase().includes(needle)||(p.trainer||'').toLowerCase().includes(needle)||(p.code||'').toLowerCase().includes(needle)); }

  // فلاتر متقدمة
  const filterBranch = window._tmFilterBranch || '';
  const filterLevel  = window._tmFilterLevel  || '';
  const filterSort   = window._tmFilterSort   || 'branch';
  const filterSub    = window._tmFilterSub    || '';
  if(filterBranch) filteredPlayers=filteredPlayers.filter(p=>p.branch===filterBranch);
  if(filterLevel)  filteredPlayers=filteredPlayers.filter(p=>(p.level||'')===filterLevel);

  const currentMonth = todayISO().slice(0,7);
  const teamSubs = (await sGet('ks_team_subs_'+currentMonth))||{};
  const acadSubs = (await sGet('ks_subs_'+currentMonth))||{};
  if(filterSub==='paid')   filteredPlayers=filteredPlayers.filter(p=>{ const s=teamSubs[p.id]||acadSubs[p.id]||{}; return s.paid===true||s.paid==='true'; });
  if(filterSub==='unpaid') filteredPlayers=filteredPlayers.filter(p=>{ const s=teamSubs[p.id]||acadSubs[p.id]||{}; return Number(s.expected||0)>0&&s.paid!==true&&s.paid!=='true'; });

  // ترتيب
  if(filterSort==='name')  filteredPlayers.sort((a,b)=>a.name.localeCompare(b.name,'ar'));
  else if(filterSort==='join') filteredPlayers.sort((a,b)=>(b.joinDate||'').localeCompare(a.joinDate||''));
  else if(filterSort==='code') filteredPlayers.sort((a,b)=>Number((a.code||'').replace(/\D/g,''))-Number((b.code||'').replace(/\D/g,'')));

  const allBranches=[...new Set(teamPlayers.map(p=>p.branch).filter(Boolean))].sort();
  const allLevels  =[...new Set(teamPlayers.map(p=>p.level).filter(Boolean))].sort();

  const groups={};
  if(filterSort==='branch'){ filteredPlayers.forEach(p=>{ (groups[p.branch]=groups[p.branch]||[]).push(p); }); }
  else { groups['__all__']=filteredPlayers; }
  const branchNames=filterSort==='branch'?Object.keys(groups).sort((a,b)=>groups[b].length-groups[a].length):['__all__'];

  const getSubBadge=(p)=>{
    if(session.role==='trainer') return '';
    const s=teamSubs[p.id]||acadSubs[p.id]||{};
    if(!Number(s.expected||0)) return '';
    const isPaid=s.paid===true||s.paid==='true';
    const rem=Number(s.expected||0)-Number(s.paidAmt||0);
    if(isPaid) return `<span style="font-size:10.5px; font-weight:700; color:var(--ok);">✅ مسدد</span>`;
    return `<span style="font-size:10.5px; font-weight:700; color:var(--red-light);">❌ متبقي ${rem.toLocaleString()} ج.م</span>`;
  };

  const cardHtmlSync=(p)=>{
    const risk=getCachedPlayerRiskSync(p.id); const age=getPlayerAge(p); const sub=getSubBadge(p);
    return `<div class="card player-card" onclick="openPlayer('${p.id}')"><div class="player-card-inner">
      <div class="player-card-top">
        <div class="user-avatar" style="${p.avatar?'background-image:url('+p.avatar+'); background-size:cover; background-position:center; color:transparent;':''}">${p.avatar?'':p.name.charAt(0)}</div>
        <div><div class="player-card-name">${p.name}</div><div class="player-card-meta">${p.branch}${age!=null?' · '+age+' سنة':''}</div></div>
      </div>
      <div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:6px;">
        <span class="pill blue">كود: ${p.code||'—'}</span>
        <span class="pill" style="background:rgba(255,255,255,0.06); color:var(--paper-dim);">مستوى ${p.level}</span>
      </div>
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:4px;">
        <div style="font-size:11.5px; font-weight:700; color:${risk.color};">${risk.label}</div>${sub}
      </div>
    </div></div>`;
  };

  let body='';
  if(branchNames.length<=1){ body=`<div class="player-grid">${filteredPlayers.map(p=>cardHtmlSync(p)).join('')||''}</div>`; }
  else { body=branchNames.map(b=>`<div style="margin-bottom:22px;"><div class="section-title" style="margin-bottom:10px;">${b} <span class="muted" style="font-weight:400; font-size:12.5px;">— ${groups[b].length} لاعب</span></div><div class="player-grid">${groups[b].map(p=>cardHtmlSync(p)).join('')}</div></div>`).join(''); }

  const activeCount=teamPlayers.filter(p=>p.status==='active').length;
  const excusedCount=teamPlayers.filter(p=>p.status==='excused').length;
  const sel=`padding:9px 12px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); border-radius:10px; color:#fff; font-size:13px;`;

  return `
  <div class="topbar">
    <div><div class="page-title">لاعبين الفريق${scopeLabel}</div><div class="page-sub">إجمالي المسجلين: ${teamPlayers.length} لاعب — معروض: ${filteredPlayers.length}</div></div>
    <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
      ${(session.role==='coach'||session.role==='admin')?`<button class="btn btn-ghost" onclick="openImportPlayersModal(true)">📥 استيراد CSV</button><button class="btn btn-ghost" onclick="exportTeamPlayers()">📤 تصدير CSV</button><button class="btn btn-primary" onclick="openAddPlayerModal(true)">${svgIcon('plus')} إضافة لاعب جديد للفريق</button>`:''}
    </div>
  </div>
  <div class="tabs-row" style="margin-bottom:16px;">
    <button class="tab-btn ${tab==='active'?'active':''}" onclick="setTeamPlayerFilterTab('active')">النشطون (${activeCount})</button>
    <button class="tab-btn ${tab==='excused'?'active':''}" onclick="setTeamPlayerFilterTab('excused')">المعتذرون (${excusedCount})</button>
  </div>
  <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; align-items:center;">
    <input type="text" placeholder="🔍 ابحث بالاسم، الكود، الفرع..." value="${q}" oninput="filterPlayers(this.value,true)" style="flex:1; min-width:200px; padding:9px 14px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); border-radius:10px; color:#fff; font-size:13px; font-family:inherit; outline:none;">
    <select onchange="window._tmFilterBranch=this.value; renderPage()" style="${sel}">
      <option value="">كل الفروع</option>
      ${allBranches.map(b=>`<option value="${b}" ${b===filterBranch?'selected':''}>${b}</option>`).join('')}
    </select>
    <select onchange="window._tmFilterLevel=this.value; renderPage()" style="${sel}">
      <option value="">كل المستويات</option>
      ${allLevels.map(l=>`<option value="${l}" ${l===filterLevel?'selected':''}>${l}</option>`).join('')}
    </select>
    <select onchange="window._tmFilterSub=this.value; renderPage()" style="${sel} ${session.role==='trainer'?'display:none':''}">
      <option value="">كل الاشتراكات</option>
      <option value="paid" ${filterSub==='paid'?'selected':''}>✅ مسددين</option>
      <option value="unpaid" ${filterSub==='unpaid'?'selected':''}>❌ غير مسددين</option>
    </select>
    <select onchange="window._tmFilterSort=this.value; renderPage()" style="${sel}">
      <option value="branch" ${filterSort==='branch'?'selected':''}>ترتيب: بالفرع</option>
      <option value="name"   ${filterSort==='name'?'selected':''}>ترتيب: بالاسم</option>
      <option value="join"   ${filterSort==='join'?'selected':''}>ترتيب: تاريخ الانضمام</option>

    ${(filterBranch||filterLevel||filterSub)?`<button class="btn btn-ghost btn-sm" onclick="window._tmFilterBranch=''; window._tmFilterLevel=''; window._tmFilterSub=''; renderPage()">✕ مسح الفلاتر</button>`:''}
  </div>

function filterPlayers(val, isTeam = false){
  if (isTeam) { window._teamPlayerSearch = val; } else { window._playerSearch = val; }

  const focusPos = document.activeElement && document.activeElement.selectionStart;
  const renderFn = isTeam ? pageTeamPlayersList : pagePlayersList;
  renderFn().then(html=>{
    main.innerHTML = html;
    const input = main.querySelector('input[type="text"]');
    if(input){ input.focus(); if(focusPos!=null) input.setSelectionRange(focusPos, focusPos); }
  });
}

function lineChartSVG(values, labels, color, maxHint){
  const w = Math.max(320, values.length*46), h=140, pad=24;
  const max = Math.max(maxHint||0, ...values, 1);
  const min = 0;
  const stepX = (w-pad*2) / Math.max(1,(values.length-1));
  const pts = values.map((v,i)=>{
    const x = pad + i*stepX;
    const y = h-pad - ((v-min)/(max-min||1))*(h-pad*2);
    return [x,y];
  });
  const path = pts.map((pt,i)=>(i===0?'M':'L')+pt[0].toFixed(1)+pt[1].toFixed(1)).join(' ');
  const areaPath = path + ` L${pts[pts.length-1][0].toFixed(1)},${h-pad} L${pts[0][0].toFixed(1)},${h-pad} Z`;
  const dots = pts.map((pt,i)=>`<circle cx="${pt[0].toFixed(1)}" cy="${pt[1].toFixed(1)}" r="3.5" fill="${color}"/>`).join('');
  const labelsSvg = labels.map((l,i)=>`<text x="${pts[i][0].toFixed(1)}" y="${h-4}" font-size="10" fill="var(--paper-dim)" text-anchor="middle">${l}</text>`).join('');
  return `<div class="chart-wrap"><svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <defs><linearGradient id="grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity="0.35"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${areaPath}" fill="url(#grad)"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}${labelsSvg}
  </svg></div>`;
}

async function submitAddPlayer(e, isTeam = false){
  e.preventDefault();
  const username = document.getElementById('npUsername').value.trim();
  const storageKey = isTeam ? 'ks_team_players' : 'ks_players';
  const players = (await sGet(storageKey)) || [];
  
  if(username && players.some(p=>p.username===username)){ 
    showToast('اسم المستخدم ده مستخدم قبل كده'); 
    return false; 
  }
  
  const pinText = document.getElementById('npPin').value.trim();
  const pinHash = pinText ? await sha256(pinText) : '';
  const birthdateVal = document.getElementById('npBirthdate').value;
  
  const prefixCode = isTeam ? 'T' : '';
  const maxCode = players.reduce((max, p) => (p.role === 'player' && p.code) ? Math.max(max, parseInt(p.code.replace('T',''), 10) || 0) : max, 0);
  const newCode = prefixCode + (maxCode + 1).toString();

  const newP = {
    id: uid(),
    role: 'player',
    username,
    pinHash,
    pinText,
    name: document.getElementById('npName').value.trim(),
    birthdate: birthdateVal || null,
    age: null,
    branch: document.getElementById('npBranch').value.trim(),
    level: document.getElementById('npLevel').value.trim(),
    trainer: document.getElementById('npTrainer').value.trim(),
    phone: document.getElementById('npPhone').value.trim(),
    code: newCode,
    status: 'active',
    joinDate: todayISO(),
    subEnd: (document.getElementById('npSubEnd')||{}).value || null,
    avatar: ''
  };
  
  players.push(newP);
  await sSet(storageKey, players);
  closeModal();
  showToast('تم إضافة اللاعب بنجاح ✅ (كود: ' + newCode + ')');
  renderPage();
  return false;
}

    const m = String(i+1).padStart(2,'0');

async function runGlobalSearch(query){
  const drop = document.getElementById('searchDropdown');
  if(!query || query.trim().length < 2){ drop.innerHTML = ''; drop.style.display = 'none'; return; }
  drop.style.display = 'block';
  const q = query.trim().toLowerCase();
  const acad = (await sGet('ks_players')) || [];
  const team = (await sGet('ks_team_players')) || [];
  const all = [...acad, ...team].filter(p => (p.status||'active') === 'active');
  const results = all.filter(p =>
    (p.name||'').toLowerCase().includes(q) ||
    (p.code||'').toLowerCase().includes(q) ||
    (p.branch||'').toLowerCase().includes(q) ||
    (p.level||'').toLowerCase().includes(q)
  ).slice(0, 10);

  if(!results.length){
    drop.innerHTML = `<div style="padding:14px; text-align:center; color:var(--paper-dim); font-size:13px;">لا توجد نتائج</div>`;
    return;
  }
  drop.innerHTML = results.map(p => `

      style="display:flex; align-items:center; gap:10px; padding:10px 14px; cursor:pointer; border-bottom:1px solid rgba(255,255,255,0.05); transition:background .12s;"

      </div>
      <span style="font-size:11px; color:var(--blue-light); white-space:nowrap;">${p.level||''}</span>
    </div>`).join('');
}

// ── Subscription Expiry Check ──────────────────────────────
async function getExpiringSubscriptions(){
  const thisMonth = todayISO().slice(0,7);
  const nextMonthDate = new Date(thisMonth + '-01');
  nextMonthDate.setMonth(nextMonthDate.getMonth() + 1);
  const nextMonth = nextMonthDate.toISOString().slice(0,7);

  const acad = await scopedPlayers('ks_players');
  const team = await scopedPlayers('ks_team_players');
  const allPlayers = [...acad, ...team].filter(p => (p.status||'active') === 'active');
  const acadSubs = (await sGet('ks_subs_'+thisMonth)) || {};
  const teamSubs = (await sGet('ks_team_subs_'+thisMonth)) || {};
  const nextAcadSubs = (await sGet('ks_subs_'+nextMonth)) || {};
  const nextTeamSubs = (await sGet('ks_team_subs_'+nextMonth)) || {};

  const expiring = [];
  allPlayers.forEach(p => {
    const thisSub = acadSubs[p.id] || teamSubs[p.id] || {};
    const nextSub = nextAcadSubs[p.id] || nextTeamSubs[p.id] || {};
    const hasThisMonth = Number(thisSub.expected || 0) > 0;
    const hasNextMonth = Number(nextSub.expected || 0) > 0;
    const paidThisMonth = thisSub.paid === true || thisSub.paid === 'true';
    if(hasThisMonth && !hasNextMonth)
      expiring.push({player: p, type: 'expiring', reason: 'اشتراكه ينتهي هذا الشهر ولم يُجدَّد'});
    else if(hasThisMonth && !paidThisMonth)
      expiring.push({player: p, type: 'unpaid', reason: 'لم يسدد اشتراك الشهر الحالي'});
  });
  return expiring;
}

async function getNotificationCount(){
  let count = 0;
  if(session.role === 'player'){
    const inbox = (await sGet('ks_player_inbox'))||[];
    count += inbox.filter(m=>!m.read && (m.to===session.id||m.to==='all')).length;
  } else if(session.role === 'coach'){
    count += await getPendingApprovalsCount();
    const inbox = (await sGet('ks_player_inbox'))||[];
    count += inbox.filter(m=>!m.read).length;
  } else {
    const pending = ((await sGet('ks_pending_approvals'))||[]).filter(r=>r.status==='pending'&&r.requestedBy===session.name).length;
    count += pending; // feedback to admin on their own requests
  }
  return count;
}

function updateBulkRowStyle(pid, checked){
  const row = document.getElementById('bulkRow_'+pid);
  if(!row) return;
  row.style.background = checked ? 'rgba(58,143,107,0.12)' : 'rgba(255,255,255,0.03)';
  row.style.border = `1px solid ${checked?'rgba(58,143,107,0.3)':'rgba(255,255,255,0.07)'}`;
}
function bulkSelectAll(val){
  document.querySelectorAll('.bulkCheck').forEach(cb=>{ cb.checked=val; updateBulkRowStyle(cb.dataset.pid, val); });
}
async function saveBulkAttendance(){
  const dateVal = document.getElementById('bulkDate')?.value || todayISO();
  const checks = document.querySelectorAll('.bulkCheck');
  let saved=0;
  for(const cb of checks){
    const pid = cb.dataset.pid;
    let arr = (await sGet('ks_attendance_'+pid))||[];
    const has = arr.includes(dateVal);
    if(cb.checked && !has){ arr.push(dateVal); arr.sort(); await sSet('ks_attendance_'+pid, arr); saved++; }
    else if(!cb.checked && has){ arr = arr.filter(d=>d!==dateVal); await sSet('ks_attendance_'+pid, arr); saved++; }
  }
  showToast(`✅ تم حفظ حضور ${saved} لاعب بتاريخ ${fmtDate(dateVal)}`);
}

// 4. SMART DEBT TRACKER — متابعة المديونيات الذكية
// ══════════════════════════════════════════════════════════
async function pageDebtTracker(){
  const today = todayISO();
  const currentMonth = today.slice(0,7);
  const prevMonth = (() => { const d=new Date(currentMonth+'-01'); d.setMonth(d.getMonth()-1); return d.toISOString().slice(0,7); })();
  const acad = await scopedPlayers('ks_players');
  const team = await scopedPlayers('ks_team_players');
  const all = [...acad, ...team].filter(p=>(p.status||'active')==='active');

  const acadSubs = (await sGet('ks_subs_'+currentMonth))||{};
  const teamSubs = (await sGet('ks_team_subs_'+currentMonth))||{};
  const prevAcad = (await sGet('ks_subs_'+prevMonth))||{};
  const prevTeam = (await sGet('ks_team_subs_'+prevMonth))||{};
  const followUps = (await sGet('ks_debt_followups'))||{};

  const debtors = all.map(p=>{
    const cur = acadSubs[p.id]||teamSubs[p.id]||{};
    const prev = prevAcad[p.id]||prevTeam[p.id]||{};
    const curRem = Math.max(0, Number(cur.expected||0) - Number(cur.paidAmt||0));
    const prevRem = Math.max(0, Number(prev.expected||0) - Number(prev.paidAmt||0));
    const totalDebt = curRem + prevRem;
    if(totalDebt <= 0) return null;
    const fu = followUps[p.id]||{};
    return {p, curRem, prevRem, totalDebt, lastContact: fu.lastContact||null, promiseDate: fu.promiseDate||null, note: fu.note||''};
  }).filter(Boolean).sort((a,b)=>b.totalDebt-a.totalDebt);

  const totalDebt = debtors.reduce((s,d)=>s+d.totalDebt,0);

  return `
  <div class="topbar">
    <div><div class="page-title">💰 متابعة المديونيات</div><div class="page-sub">إجمالي المديونيات: ${totalDebt.toLocaleString()} ج.م</div></div>
  </div>
  <div class="grid grid-3" style="margin-bottom:20px;">
    <div class="card stat-card"><div class="stat-label">إجمالي الديون</div><div class="stat-value" style="color:var(--red-light);">${totalDebt.toLocaleString()}</div><div class="stat-foot">ج.م</div></div>
    <div class="card stat-card"><div class="stat-label">عدد المدينين</div><div class="stat-value">${debtors.length}</div><div class="stat-foot">لاعب</div></div>
    <div class="card stat-card"><div class="stat-label">يوعدوا بالدفع</div><div class="stat-value" style="color:var(--warn);">${debtors.filter(d=>d.promiseDate&&d.promiseDate>=today).length}</div><div class="stat-foot">طلب مهلة</div></div>
  </div>
  <div class="card" style="padding:0; overflow-x:auto;">
    <table style="width:100%; border-collapse:collapse; font-size:13px;">
      <thead><tr style="background:rgba(255,255,255,0.04);">
        <th style="padding:11px 14px; text-align:right;">اللاعب</th>
        <th style="padding:11px;">الشهر الحالي</th>
        <th style="padding:11px;">الشهر السابق</th>
        <th style="padding:11px;">الإجمالي</th>
        <th style="padding:11px;">وعد بالدفع</th>
        <th style="padding:11px;">ملاحظة</th>
        <th style="padding:11px;">تواصل</th>
      </tr></thead>
      <tbody>
        ${debtors.map(d=>{
          const overdue = d.promiseDate && d.promiseDate < today;
          return `<tr style="border-bottom:1px solid rgba(255,255,255,0.04); ${overdue?'background:rgba(200,84,88,0.08);':''}">
            <td style="padding:10px 14px;">
              <div style="display:flex; align-items:center; gap:8px; cursor:pointer;" onclick="openPlayer('${d.p.id}')">
                <div class="user-avatar" style="width:28px; height:28px; font-size:11px; flex-shrink:0;">${d.p.name.charAt(0)}</div>
                <div>
                  <div style="font-weight:800;">${d.p.name}</div>
                  <div style="font-size:11px; color:var(--paper-dim);">${d.p.branch}</div>
                </div>
              </div>
            </td>
            <td style="padding:10px; text-align:center; color:${d.curRem>0?'var(--red-light)':'var(--paper-dim)'}; font-weight:700;">${d.curRem>0?d.curRem.toLocaleString()+' ج.م':'✓'}</td>
            <td style="padding:10px; text-align:center; color:${d.prevRem>0?'var(--warn)':'var(--paper-dim)'}; font-weight:700;">${d.prevRem>0?d.prevRem.toLocaleString()+' ج.م':'✓'}</td>
            <td style="padding:10px; text-align:center; font-weight:800; color:var(--red-light);">${d.totalDebt.toLocaleString()} ج.م</td>
            <td style="padding:10px; text-align:center;">
              <input type="date" value="${d.promiseDate||''}" style="background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); border-radius:8px; color:#fff; padding:4px 8px; font-size:12px; width:130px;"
                onchange="saveDebtFollowup('${d.p.id}','promiseDate',this.value)">
              ${overdue ? '<div style="font-size:10.5px; color:var(--red-light); margin-top:2px;">⚠️ فات الموعد!</div>' : ''}
            </td>
            <td style="padding:10px;">
              <input type="text" value="${d.note}" placeholder="ملاحظة..." style="background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); border-radius:8px; color:#fff; padding:4px 8px; font-size:12px; width:140px;"
                onblur="saveDebtFollowup('${d.p.id}','note',this.value)">
            </td>
            <td style="padding:10px; text-align:center;">
              <a href="https://wa.me/?text=${encodeURIComponent('السلام عليكم '+d.p.name+'،\nنود تذكيرك بسداد اشتراكك في Killing Shot Academy.\nالمبلغ المتبقي: '+d.totalDebt.toLocaleString()+' ج.م\nشكراً لك 🙏')}" target="_blank"
                class="btn btn-ghost btn-sm" style="color:#25d366; border-color:rgba(37,211,102,0.3);" onclick="saveDebtFollowup('${d.p.id}','lastContact','${today}')">📲 واتساب</a>
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>`;
}

async function saveDebtFollowup(pid, field, value){
  const followUps = (await sGet('ks_debt_followups'))||{};
  if(!followUps[pid]) followUps[pid] = {};
  followUps[pid][field] = value;
  await sSet('ks_debt_followups', followUps);
  if(field==='lastContact') showToast('✅ تم تسجيل التواصل');
}

async function openAddScheduleSlot(branch, dayIdx, slot){
  const coaches = (await sGet('ks_coaches'))||[];
  const scheduleKey = `ks_branch_schedule_${branch}`;
  const schedule = (await sGet(scheduleKey))||{};
  const days = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  const slots = ['8:00','9:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00','20:00','21:00'];
  const editKey = (dayIdx!==undefined && slot) ? `${dayIdx}_${slot}` : null;
  const existing = editKey ? (schedule[editKey]||{}) : {};

  document.getElementById('modalRoot').innerHTML = `
  <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="card modal" style="max-width:420px;">

      <div class="field"><label>الوقت</label><select id="ssSlot">${slots.map(s=>`<option value="${s}" ${s===slot?'selected':''}>${s}</option>`).join('')}</select></div>
      <div class="field"><label>اسم المجموعة</label><input id="ssGroup" value="${existing.group||''}" placeholder="مثال: مجموعة A"></div>
      <div class="field"><label>المدرب</label><select id="ssTrainer">
        <option value="">اختر مدرب</option>
        ${coaches.map(c=>`<option value="${c.name}" ${c.name===existing.trainer?'selected':''}>${c.name}</option>`).join('')}
      </select></div>
      <div class="field"><label>الملعب/الصالة</label><input id="ssCourt" value="${existing.court||''}" placeholder="مثال: ملعب 1"></div>
      <div class="field"><label>عدد اللاعبين المتوقع</label><input id="ssCount" type="number" value="${existing.count||''}" placeholder="مثال: 8"></div>
      <div class="modal-actions">
        <button class="btn btn-primary" onclick="saveScheduleSlot('${branch}')">💾 حفظ</button>
        <button class="btn btn-ghost" onclick="closeModal()">إلغاء</button>
      </div>
    </div>
  </div>`;
}
async function openEditScheduleSlot(branch, cellKey){
  const [dayIdx, slot] = cellKey.split('_');
  await openAddScheduleSlot(branch, Number(dayIdx), slot);
  // store cellKey so save knows what to overwrite
  window._editingScheduleKey = cellKey;
}
async function saveScheduleSlot(branch){
  const dayIdx = document.getElementById('ssDayIdx').value;
  const slot = document.getElementById('ssSlot').value;
  const cellKey = `${dayIdx}_${slot}`;
  const scheduleKey = `ks_branch_schedule_${branch}`;
  const schedule = (await sGet(scheduleKey))||{};
  schedule[cellKey] = {
    group: document.getElementById('ssGroup').value.trim(),
    trainer: document.getElementById('ssTrainer').value,
    court: document.getElementById('ssCourt').value.trim(),
    count: document.getElementById('ssCount').value
  };
  await sSet(scheduleKey, schedule);
  closeModal();
  showToast('✅ تم حفظ الحصة');
  renderPage();
}
async function deleteScheduleSlot(branch, cellKey){
  if(!confirm('حذف الحصة دي؟')) return;
  const scheduleKey = `ks_branch_schedule_${branch}`;
  const schedule = (await sGet(scheduleKey))||{};
  delete schedule[cellKey];
  await sSet(scheduleKey, schedule);
  showToast('تم حذف الحصة');
  renderPage();
}

// 6. BRANCH COMPARISON — مقارنة الفروع البصرية
// ══════════════════════════════════════════════════════════
async function pageBranchCompare(){
  const today = todayISO();
  const currentMonth = today.slice(0,7);
  const prevMonth = (() => { const d=new Date(currentMonth+'-01'); d.setMonth(d.getMonth()-1); return d.toISOString().slice(0,7); })();
  const acad = await scopedPlayers('ks_players');
  const team = await scopedPlayers('ks_team_players');
  const all = [...acad, ...team].filter(p=>(p.status||'active')==='active');
  const branches = [...new Set(all.map(p=>p.branch))].sort();

  const entries = ((await sGet('ks_treasury_entries'))||[]).filter(e=>!e.deleted);

  const branchStats = await Promise.all(branches.map(async b => {
    const players = all.filter(p=>p.branch===b);
    const acadSubs = (await sGet('ks_subs_'+currentMonth))||{};
    const teamSubs = (await sGet('ks_team_subs_'+currentMonth))||{};
    const prevAcad = (await sGet('ks_subs_'+prevMonth))||{};

    let expected=0, paid=0, prevPaid=0;
    players.forEach(p=>{
      const s = acadSubs[p.id]||teamSubs[p.id]||{};
      expected += Number(s.expected||0);
      paid += Number(s.paidAmt||0);
      const ps = prevAcad[p.id]||{};
      prevPaid += Number(ps.paidAmt||0);
    });
    const rate = expected>0 ? Math.round((paid/expected)*100) : 0;
    const branchEntries = entries.filter(e=>e.branch===b&&(e.entryDate||'').startsWith(currentMonth));
    const inflow = branchEntries.filter(e=>e.receiptType!=='صادر'&&e.receiptType!=='لاغي').reduce((s,e)=>s+Number(e.amount||0),0);
    const outflow = branchEntries.filter(e=>e.receiptType==='صادر').reduce((s,e)=>s+Number(e.amount||0),0);
    return {b, count:players.length, expected, paid, prevPaid, rate, inflow, outflow, net:inflow-outflow};
  }));

  branchStats.sort((a,b)=>b.paid-a.paid);
  const maxPaid = Math.max(...branchStats.map(s=>s.paid),1);
  const maxPlayers = Math.max(...branchStats.map(s=>s.count),1);

  const best = branchStats[0];
  const worst = [...branchStats].sort((a,b)=>a.rate-b.rate)[0];

  return `
  <div class="topbar">
    <div><div class="page-title">📊 مقارنة الفروع</div><div class="page-sub">${currentMonth} — ${branches.length} فرع</div></div>
  </div>
  <div class="grid grid-3" style="margin-bottom:20px;">
    <div class="card stat-card" style="border-top:3px solid var(--ok);">
      <div class="stat-label">🏆 الأفضل تحصيلاً</div>
      <div class="stat-value" style="font-size:18px;">${best?.b||'—'}</div>
      <div class="stat-foot">${best?.paid.toLocaleString()||0} ج.م — ${best?.rate||0}%</div>
    </div>
    <div class="card stat-card">
      <div class="stat-label">💰 إجمالي التحصيل</div>
      <div class="stat-value">${branchStats.reduce((s,b)=>s+b.paid,0).toLocaleString()}</div>
      <div class="stat-foot">من أصل ${branchStats.reduce((s,b)=>s+b.expected,0).toLocaleString()} ج.م</div>
    </div>
    <div class="card stat-card" style="border-top:3px solid var(--red-light);">
      <div class="stat-label">⚠️ الأضعف تحصيلاً</div>
      <div class="stat-value" style="font-size:18px; color:var(--warn);">${worst?.b||'—'}</div>
      <div class="stat-foot">${worst?.rate||0}% نسبة تحصيل</div>
    </div>
  </div>

  <!-- BAR CHART: Collection -->
  <div class="card" style="margin-bottom:18px;">
    <div class="section-title">تحصيل الاشتراكات بالفرع (${currentMonth})</div>
    <div style="margin-top:14px; display:flex; flex-direction:column; gap:10px;">
      ${branchStats.map(s=>{

// 8. EXPORT TO CSV/EXCEL — تصدير البيانات

function exportToCSV(data, filename){
  if(!data.length){ showToast('لا توجد بيانات للتصدير'); return; }
  const headers = Object.keys(data[0]);
  const rows = [headers.join(','), ...data.map(row => headers.map(h=>`"${(row[h]||'').toString().replace(/"/g,'""')}"`).join(','))];
  const bom = '\uFEFF'; // BOM for Excel Arabic support
  const blob = new Blob([bom+rows.join('\n')], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename+'.csv'; a.click();
  URL.revokeObjectURL(url);
  showToast('✅ تم تصدير '+filename+'.csv');
}

async function exportMonthlySubscriptions(month){
  month = month || todayISO().slice(0,7);
  const acad = (await sGet('ks_players'))||[];
  const team = (await sGet('ks_team_players'))||[];
  const all = [...acad, ...team].filter(p=>p.role==='player');
  const acadSubs = (await sGet('ks_subs_'+month))||{};
  const teamSubs = (await sGet('ks_team_subs_'+month))||{};
  const data = all.map(p=>{
    const s = acadSubs[p.id]||teamSubs[p.id]||{};
    return {
      'الاسم': p.name||'',
      'الفرع': p.branch||'',
      'الشهر': month,
      'المتوقع': s.expected||0,
      'المسدد': s.paidAmt||0,
      'المتبقي': Math.max(0,Number(s.expected||0)-Number(s.paidAmt||0)),
      'الحالة': (s.paid===true||s.paid==='true')?'مسدد':'لم يسدد',
      'تاريخ السداد': s.date||''
    };
  });
  exportToCSV(data, 'الاشتراكات_'+month);
}

async function exportDebts(){
  const today = todayISO();
  const currentMonth = today.slice(0,7);
  const acad = (await sGet('ks_players'))||[];
  const team = (await sGet('ks_team_players'))||[];
  const all = [...acad, ...team].filter(p=>p.role==='player'&&(p.status||'active')==='active');
  const acadSubs = (await sGet('ks_subs_'+currentMonth))||{};
  const teamSubs = (await sGet('ks_team_subs_'+currentMonth))||{};
  const data = all.map(p=>{
    const s = acadSubs[p.id]||teamSubs[p.id]||{};
    const rem = Math.max(0,Number(s.expected||0)-Number(s.paidAmt||0));
    if(rem===0) return null;
    return { 'الاسم':p.name, 'الفرع':p.branch, 'المتوقع':s.expected||0, 'المسدد':s.paidAmt||0, 'المتبقي':rem, 'الهاتف':p.phone||'' };
  }).filter(Boolean).sort((a,b)=>b['المتبقي']-a['المتبقي']);
  exportToCSV(data, 'المديونيات_'+currentMonth);
}

async function exportFullBackup() {
  showToast('⏳ جاري تجميع البيانات...');
  try {
    const backup = {
      _meta: {
        version: '1.0',
        exportedAt: new Date().toISOString(),
        exportedBy: session.name,
        appName: 'Killing Shot Academy',
        totalKeys: 0
      },
      data: {}
    };

    // Collect all ks_ keys from localStorage
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith('ks_') && k !== 'ks_sync_queue' && k !== 'ks_session') {
        keys.push(k);
      }
    }

    // Read each key via sGet to get the most up-to-date value (cache+local)
    for (const key of keys) {
      const val = await sGet(key);
      if (val !== null && val !== undefined) {
        backup.data[key] = val;
      }
    }

    backup._meta.totalKeys = Object.keys(backup.data).length;

    const json = JSON.stringify(backup, null, 2);
    const blob = new Blob([json], { type: 'application/json;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const dateStr = new Date().toISOString().slice(0, 16).replace('T', '_').replace(/:/g, '-');
    const a = document.createElement('a');
    a.href = url; a.download = `KillingShot_Backup_${dateStr}.json`; a.click();
    URL.revokeObjectURL(url);

    // Save record of this backup locally
    const backupLog = (await sGet('ks_backup_log')) || [];
    backupLog.unshift({
      id: uid(),
      exportedAt: backup._meta.exportedAt,
      exportedBy: session.name,
      totalKeys: backup._meta.totalKeys,
      filename: `KillingShot_Backup_${dateStr}.json`
    });
    await sSet('ks_backup_log', backupLog.slice(0, 20)); // keep last 20 records

    showToast(`✅ تم تصدير ${backup._meta.totalKeys} ملف بيانات`);
    // Refresh modal
    setTimeout(() => openBackupRestoreModal(), 800);
  } catch(e) {
    console.error(e);
    showToast('❌ حصل خطأ أثناء التصدير');
  }
}

async function importBackupFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const backup = JSON.parse(e.target.result);

      // Validate format
      if (!backup._meta || !backup.data) {
        showToast('❌ الملف ده مش نسخة احتياطية صحيحة');
        return;
      }

      const keys = Object.keys(backup.data);
      const exportedAt = new Date(backup._meta.exportedAt).toLocaleString('ar-EG');
      const exportedBy = backup._meta.exportedBy || '—';

      // Confirmation with details
      const confirmed = confirm(
        `⚠️ تأكيد استيراد النسخة الاحتياطية\n\n` +
        `📅 تاريخ النسخة: ${exportedAt}\n` +
        `👤 أُنشئت بواسطة: ${exportedBy}\n` +
        `📦 عدد ملفات البيانات: ${keys.length}\n\n` +
        `⚠️ تحذير: سيتم استبدال البيانات الحالية بالكاملة بهذه النسخة.\n` +
        `هل أنت متأكد؟`
      );
      if (!confirmed) return;

      showToast('⏳ جاري استيراد البيانات...');

      // Clear memCache first
      window._memCache = {};

      // Restore each key
      let restored = 0;
      for (const [key, val] of Object.entries(backup.data)) {
        if (key.startsWith('ks_') && key !== 'ks_session') {
          await (window.sForceSet ? sForceSet(key, val) : sSet(key, val));
          restored++;
        }
      }

      // Log the restore event
      const restoreLog = (await sGet('ks_restore_log')) || [];
      restoreLog.unshift({
        id: uid(),
        restoredAt: new Date().toISOString(),
        restoredBy: session.name,
        backupDate: backup._meta.exportedAt,
        keysRestored: restored
      });
      await sSet('ks_restore_log', restoreLog.slice(0, 20));

      showToast(`✅ تم استيراد ${restored} ملف بيانات بنجاح`);
      closeModal();

      // Refresh after short delay
      setTimeout(() => { window._memCache = {}; renderPage(); }, 1200);

    } catch(err) {
      console.error(err);
      showToast('❌ فشل الاستيراد — الملف تالف أو بصيغة خاطئة');
    }
  };
  reader.readAsText(file, 'utf-8');
}

// ══════════════════════════════════════════════════════════
// FEATURE 1 — Month-over-Month comparison in Analytics
// helper already built into pageAnalytics via vsLastMonth
// Extended here with full MoM breakdown
// ══════════════════════════════════════════════════════════
async function getMoMData(thisMonth, prevMonth, activePlayers){
  const acadSubs     = (await sGet('ks_subs_'      + thisMonth)) || {};
  const teamSubs     = (await sGet('ks_team_subs_' + thisMonth)) || {};
  const prevAcadSubs = (await sGet('ks_subs_'      + prevMonth)) || {};
  const prevTeamSubs = (await sGet('ks_team_subs_' + prevMonth)) || {};
  const allEntries   = ((await sGet('ks_treasury_entries')) || []).filter(e=>!e.deleted);
  const curEntries   = allEntries.filter(e=>(e.entryDate||'').startsWith(thisMonth));
  const prevEntries  = allEntries.filter(e=>(e.entryDate||'').startsWith(prevMonth));

  const sumSubs = (subs, tsubs) => activePlayers.reduce((s,p)=>{
    const sub = subs[p.id]||tsubs[p.id]||{};
    return {exp: s.exp+Number(sub.expected||0), paid: s.paid+Number(sub.paidAmt||0)};
  }, {exp:0, paid:0});

  const cur  = sumSubs(acadSubs,  teamSubs);
  const prev = sumSubs(prevAcadSubs, prevTeamSubs);

  const treasury = (entries) => entries.reduce((s,e)=>{
    const sign = treasuryReceiptSign(e.receiptType);
    if(sign>0) s.inflow  += Number(e.amount||0);
    if(sign<0) s.outflow += Number(e.amount||0);
    return s;
  }, {inflow:0, outflow:0});

  const curTr  = treasury(curEntries);
  const prevTr = treasury(prevEntries);

  const delta = (a, b) => b===0 ? null : Math.round(((a-b)/b)*100);
  const fmt   = (v) => v===null ? '—' : `${v>=0?'▲':'▼'} ${Math.abs(v)}%`;
  const clr   = (v) => v===null ? 'var(--paper-dim)' : v>=0 ? 'var(--ok)' : 'var(--red-light)';

  return [
    {label:'تحصيل الاشتراكات', cur:cur.paid,        prev:prev.paid,       d:delta(cur.paid,prev.paid)},
    {label:'المتوقع',           cur:cur.exp,         prev:prev.exp,        d:delta(cur.exp,prev.exp)},
    {label:'الوارد (خزينة)',    cur:curTr.inflow,    prev:prevTr.inflow,   d:delta(curTr.inflow,prevTr.inflow)},
    {label:'الصادر (خزينة)',    cur:curTr.outflow,   prev:prevTr.outflow,  d:delta(curTr.outflow,prevTr.outflow)},
    {label:'الصافي',            cur:curTr.inflow-curTr.outflow, prev:prevTr.inflow-prevTr.outflow, d:delta(curTr.inflow-curTr.outflow, prevTr.inflow-prevTr.outflow)},
  ].map(r=>({...r, fmt:fmt(r.d), clr:clr(r.d)}));
}

// ══════════════════════════════════════════════════════════
// FEATURE 2 — Sub-Treasury sync gap detector
// ══════════════════════════════════════════════════════════
async function detectSyncGaps(month, activePlayers){
  const acadSubs = (await sGet('ks_subs_'+month))||{};
  const teamSubs = (await sGet('ks_team_subs_'+month))||{};
  const entries  = ((await sGet('ks_treasury_entries'))||[]).filter(e=>!e.deleted);
  const gaps = [];
  activePlayers.forEach(p=>{
    const sub = acadSubs[p.id]||teamSubs[p.id]||{};
    const isPaid = sub.paid===true||sub.paid==='true';
    const amt    = Number(sub.paidAmt||0);
    if(!isPaid || amt===0) return;
    const linked = sub.treasuryEntryId;
    const entryExists = linked && entries.some(e=>e.id===linked);
    if(!entryExists) gaps.push({name:p.name, branch:p.branch, amt, pid:p.id});
  });
  return gaps;
}

async function processImportCSV(file, isTeam=false){
  if(!file) return;
  const text = await file.text();
  const lines = text.trim().split('\n').map(l=>l.trim()).filter(Boolean);
  if(lines.length < 2){ showToast('الملف فارغ أو ما فيهوش بيانات'); return; }

  const headers = lines[0].split(',').map(h=>h.trim().replace(/"/g,'').toLowerCase());
  const col = (h) => headers.indexOf(h);

  const rows = lines.slice(1).map(line=>{
    const cols = line.split(',').map(c=>c.trim().replace(/"/g,''));
    return {
      name:      cols[col('name')]      || cols[0] || '',
      branch:    cols[col('branch')]    || cols[1] || '',
      level:     cols[col('level')]     || cols[2] || '',
      trainer:   cols[col('trainer')]   || cols[3] || '',
      phone:     cols[col('phone')]     || cols[4] || '',
      birthdate: cols[col('birthdate')] || cols[5] || ''
    };
  }).filter(r=>r.name && r.branch && r.level);

  if(!rows.length){ showToast('❌ لا توجد صفوف صالحة — تأكد من الأعمدة'); return; }

  const preview = document.getElementById('importPreview');
  preview.innerHTML = `
  <div class="card" style="padding:14px 16px; background:rgba(58,143,107,0.08); border:1px solid rgba(58,143,107,0.25); margin-bottom:12px;">
    <div style="font-weight:800; margin-bottom:6px;">✅ تم التحليل — ${rows.length} لاعب جاهز للاستيراد</div>
    <div style="max-height:180px; overflow-y:auto; font-size:12.5px;">
      ${rows.slice(0,10).map((r,i)=>`<div style="padding:4px 0; border-bottom:1px solid rgba(255,255,255,0.05);">${i+1}. ${r.name} — ${r.branch} — ${r.level}</div>`).join('')}
      ${rows.length>10?`<div style="color:var(--paper-dim); padding:4px 0;">... و ${rows.length-10} لاعب آخر</div>`:''}
    </div>
  </div>
  <button class="btn btn-primary btn-block" onclick="confirmImportPlayers(${JSON.stringify(rows).replace(/"/g,'&quot;')}, ${isTeam})">💾 استيراد ${rows.length} لاعب</button>`;
}

async function confirmImportPlayers(rows, isTeam=false){
  const storageKey = isTeam ? 'ks_team_players' : 'ks_players';
  const players    = (await sGet(storageKey)) || [];
  const maxCode    = players.reduce((m,p)=>p.code?Math.max(m,parseInt(p.code.replace(/\D/g,''))||0):m, 0);
  const prefix     = isTeam ? 'T' : '';
  let added = 0;
  rows.forEach((r,i)=>{
    if(players.some(p=>p.name===r.name && p.branch===r.branch)) return; // skip duplicate
    players.push({
      id: uid(), role:'player', code: prefix+(maxCode+added+1),
      name:r.name, branch:r.branch, level:r.level,
      trainer:r.trainer||'', phone:r.phone||'', birthdate:r.birthdate||null,
      status:'active', joinDate:todayISO(), username:'', pinHash:'', pinText:'', avatar:''
    });
    added++;
  });
  await sSet(storageKey, players);
  closeModal();
  showToast(`✅ تم إضافة ${added} لاعب بنجاح`);
  renderPage();
}

window._ksTabs = [];
window._ksActiveTab = null;
window._ksTabsOwner = null;
const KS_MAX_TABS = 10;
let _ksTabSeq = 0;
function ksNewTabId(){ return 'kt'+(++_ksTabSeq); }
const KS_TAB_ICONS = {home:'🏠', homeStaff:'🏠', accounting:'📒', treasury:'💰', subscriptions:'💳', teamSubscriptions:'💳', fitnessSubscriptions:'🏋️', extraSubscriptions:'➕', players:'👥', teamPlayers:'👥', playerDetail:'👤', coaches:'🧑‍🏫', trainers:'🧑‍🏫', bulkAttendance:'📋', debts:'💸', messages:'✉️'};

function ksTabsEnabled(){ return typeof session!=='undefined' && session && session.role && session.role!=='player'; }
function ksNavLabel(page){
  const b = document.querySelector(`.nav-item[onclick="goPage('${page}')"]`);
  return b ? b.textContent.replace(/\s+/g,' ').replace(/\d+\s*$/,'').trim() : '';
}
function ksCurrentTab(){ return window._ksTabs.find(t=>t.id===window._ksActiveTab); }
function ksResetTabsIfNewUser(){
  const owner = session ? (session.id||session.name) : null;
  if(window._ksTabsOwner!==owner){ window._ksTabs=[]; window._ksActiveTab=null; window._ksTabsOwner=owner; }
}
function ksSyncActiveTab(){
  ksResetTabsIfNewUser();
  let t = ksCurrentTab();
  if(!t){ t={id:ksNewTabId(), page:currentPage}; window._ksTabs.push(t); window._ksActiveTab=t.id; }
  t.page = currentPage;
  t.playerId = (currentPage==='playerDetail') ? viewingPlayerId : null;
}
function ksUpdateTabLabel(){
  const t = ksCurrentTab(); if(!t) return;
  const title = document.querySelector('#mainContent .page-title');
  let lbl = t.page==='playerDetail' && title ? title.textContent : (ksNavLabel(t.page) || (title?title.textContent:'') || t.page);
  t.label = lbl.replace(/\s+/g,' ').trim().slice(0,40);
}
function ksRenderTabsBar(){
  const bar = document.getElementById('ksTabsBar'); if(!bar) return;
  if(!ksTabsEnabled() || !window._ksTabs.length){ bar.classList.remove('show'); bar.innerHTML=''; return; }
  bar.classList.add('show');
  bar.innerHTML = `<div class="ks-tabs">
    ${window._ksTabs.map(t=>`
      <div class="ks-tab ${t.id===window._ksActiveTab?'active':''}" onclick="ksSwitchTab('${t.id}')" onauxclick="if(event.button===1){event.preventDefault(); ksCloseTab('${t.id}',event)}" title="${(t.label||'').replace(/"/g,'')}">
        <span>${KS_TAB_ICONS[t.page]||'📄'}</span>
        <span class="ks-tab-lbl">${t.label||'...'}</span>
        ${window._ksTabs.length>1?`<span class="ks-tab-x" onclick="ksCloseTab('${t.id}',event)">✕</span>`:''}
      </div>`).join('')}
    <button class="ks-tab-new" onclick="ksNewTab()" title="تابة جديدة (Alt + T)">＋</button>
    <span class="ks-tab-hint">اضغط ＋ لتابة جديدة، وبعدها اختار الصفحة من القائمة</span>
  </div>`;
  const act = bar.querySelector('.ks-tab.active'); if(act) act.scrollIntoView({block:'nearest', inline:'nearest'});
}
async function ksSwitchTab(id){
  if(id===window._ksActiveTab) return;
  const cur = ksCurrentTab(); if(cur) cur.scroll = window.scrollY;
  const t = window._ksTabs.find(x=>x.id===id); if(!t) return;
  window._ksActiveTab = id;
  currentPage = t.page;
  viewingPlayerId = t.playerId || null;
  await buildNav();
  toggleSidebar(false);
  await renderPage();
  setTimeout(()=>window.scrollTo(0, t.scroll||0), 30);
}
async function ksCloseTab(id, ev){
  if(ev) ev.stopPropagation();
  const i = window._ksTabs.findIndex(t=>t.id===id); if(i<0) return;
  const wasActive = id===window._ksActiveTab;
  window._ksTabs.splice(i,1);
  if(!window._ksTabs.length){ window._ksActiveTab=null; return _ksOrigGoPage(ksHomePage()); }
  if(wasActive){ const n = window._ksTabs[Math.min(i, window._ksTabs.length-1)]; window._ksActiveTab=null; return ksSwitchTab(n.id); }
  ksRenderTabsBar();
}
function ksHomePage(){ return (session.role==='trainer'||session.role==='admin') ? 'homeStaff' : 'home'; }
async function ksNewTab(){
  const cur = ksCurrentTab(); if(cur) cur.scroll = window.scrollY;
  if(window._ksTabs.length>=KS_MAX_TABS){ showToast('⚠️ أقصى عدد '+KS_MAX_TABS+' تابات — اقفل تابة الأول'); return; }
  const t = {id:ksNewTabId(), page:ksHomePage()};
  window._ksTabs.push(t); window._ksActiveTab=t.id;
  return _ksOrigGoPage(t.page);
}

const _ksOrigGoPage = goPage;
goPage = async function(page){
  // القائمة الجانبية بتفتح الصفحة في التابة الحالية — التابة الجديدة من زرار ＋ بس
  if(ksTabsEnabled()){ ksResetTabsIfNewUser(); const cur = ksCurrentTab(); if(cur) cur.scroll = 0; }
  const r = await _ksOrigGoPage(page);
  window.scrollTo(0,0);
  return r;
};

const _ksOrigRenderPage = renderPage;
renderPage = async function(){
  if(ksTabsEnabled()) ksSyncActiveTab();
  const r = await _ksOrigRenderPage.apply(this, arguments);
  if(ksTabsEnabled()){ ksUpdateTabLabel(); }
  ksRenderTabsBar();
  return r;
};

const _ksOrigLogout = logout;
logout = async function(){
  window._ksTabs=[]; window._ksActiveTab=null; window._ksTabsOwner=null;
  const bar=document.getElementById('ksTabsBar'); if(bar){ bar.classList.remove('show'); bar.innerHTML=''; }
  return _ksOrigLogout.apply(this, arguments);
};

document.addEventListener('keydown', e=>{
  if(!ksTabsEnabled() || !window._ksTabs.length) return;
  if(e.altKey && /^[1-9]$/.test(e.key)){ const t=window._ksTabs[Number(e.key)-1]; if(t){ e.preventDefault(); ksSwitchTab(t.id); } }
  if(e.altKey && (e.key==='t'||e.key==='T'||e.key==='ف')){ e.preventDefault(); ksNewTab(); }
  if(e.altKey && (e.key==='w'||e.key==='W'||e.key==='ص')){ e.preventDefault(); ksCloseTab(window._ksActiveTab); }
});

</script>
