async function deleteTreasuryEntry(entryId, branch){
  let all = (await sGet('ks_treasury_entries')) || [];
  const entry = all.find(x=>x.id===entryId);
  if(!entry) return;
  const canProceed = await guardTreasuryLock(branch, entry.entryDate);
  if(!canProceed) return;
  if(!confirm('متأكد إنك عايز تحذف العملية دي؟ هتفضل محفوظة في سجل التعديلات للمراجعة.')) return;
  const before = {...entry};
  entry.deleted = true;
  entry.deletedAt = new Date().toISOString();
  entry.deletedBy = session.name;
  await sSet('ks_treasury_entries', all);
  await logTreasuryAudit('delete', before, null);
  showToast('تم حذف العملية');
  renderPage();
}

async function migrateTreasuryBranchNames(){
  let branches = await sGet('ks_treasury_branches');
  if(branches && branches.length){
    let changed = false;
    branches = branches.map(b => {
      if(TREASURY_BRANCH_RENAME_MAP[b]){ changed = true; return TREASURY_BRANCH_RENAME_MAP[b]; }
      return b;
    });
    const deduped = [...new Set(branches)];
    if(deduped.length !== branches.length) changed = true;
    branches = deduped;
    if(changed) await sSet('ks_treasury_branches', branches);
  }
  let entries = await sGet('ks_treasury_entries');
  if(entries && entries.length){
    let entriesChanged = false;
    entries = entries.map(e => {
      if(e.branch && TREASURY_BRANCH_RENAME_MAP[e.branch]){ entriesChanged = true; return {...e, branch: TREASURY_BRANCH_RENAME_MAP[e.branch]}; }
      return e;
    });
    if(entriesChanged) await sSet('ks_treasury_entries', entries);
  }

  // تنظيف الفروع الفاسدة (نتيجة خطأ سابق: نص مجمّع بفاصلة أو "كل الفروع" اتسجل كفرع حقيقي)
  branches = await sGet('ks_treasury_branches');
  if(branches && branches.length){
    const freshEntries = (await sGet('ks_treasury_entries')) || [];
    const isBadName = (b) => b === 'الكل' || b === 'كل الفروع' || b.includes('،') || b.includes(',');
    let cleaned = false;
    const filteredBranches = branches.filter(b => {
      if(!isBadName(b)) return true;
      const hasEntries = freshEntries.some(e => e.branch === b && !e.deleted);
      if(hasEntries) return true;
      cleaned = true;
      return false;
    });
    if(cleaned) await sSet('ks_treasury_branches', filteredBranches);
  }

  // إصلاح حسابات الإداريين اللي اتسجل فرعها كنص مجمّع بفاصلة بدل قايمة فروع صحيحة
  let players = await sGet('ks_players');
  if(players && players.length){
    let playersChanged = false;
    players.forEach(p => {
      if(p.role === 'admin' && p.branch && (p.branch.includes('،') || p.branch.includes(','))){
        const parts = p.branch.split(/[،,]/).map(s=>s.trim()).filter(Boolean);
        if(parts.length > 1){
          p.branches = parts;
          p.branch = parts[0];
          playersChanged = true;
        }
      }
    });
    if(playersChanged) await sSet('ks_players', players);
  }
}

async function getTreasuryBranches(){
  await migrateTreasuryBranchNames();
  let branches = await sGet('ks_treasury_branches');
  if(!branches || !branches.length){
    branches = TREASURY_DEFAULT_BRANCHES.slice();
    await sSet('ks_treasury_branches', branches);
  }
  return branches;
}

      ${rows || emptyState('لا توجد فروع')}
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost btn-block" onclick="closeModal()">إغلاق</button>

}

async function deleteTreasuryBranch(branchName, entryCount){
  let msg = `متأكد إنك عايز تحذف فرع "${branchName}" من الخزينة؟`;
  if(entryCount > 0){
    msg += `\n\n⚠️ تنبيه: فيه ${entryCount} عملية مسجلة على الفرع ده، هيتم إخفاؤها كلها (مش هتتمسح نهائيًا، ممكن ترجعيها لاحقًا لو غلطتي).`;
  }
  if(!confirm(msg)) return;

  let branches = await getTreasuryBranches();
  branches = branches.filter(b => b !== branchName);
  await sSet('ks_treasury_branches', branches);

  if(entryCount > 0){
    let all = (await sGet('ks_treasury_entries')) || [];
    let changed = false;
    all.forEach(e => {
      if(e.branch === branchName && !e.deleted){
        e.deleted = true;
        e.deletedAt = new Date().toISOString();
        e.deletedBy = session.name + ' (حذف الفرع بالكامل)';
        changed = true;
      }
    });
    if(changed) await sSet('ks_treasury_entries', all);
    await logTreasuryAudit('delete_branch', {branch: branchName, category: 'حذف فرع', amount: 0, statement: `تم حذف فرع "${branchName}" بالكامل (${entryCount} عملية)`}, null);
  }

  if(window._treasuryBranch === branchName) window._treasuryBranch = 'overview';

  showToast('تم حذف الفرع بنجاح');
  closeModal();
  renderPage();
}

function treasuryReceiptSign(type){
  if(type==='وارد خزينة' || type==='وارد بنك' || type==='وارد فيزا' || type==='انستاباي') return 1;
  if(type==='صادر خزينة' || type==='صادر بنك' || type==='رد فيزا') return -1;
  return 0;
}

function setTreasuryBranch(b){
  window._treasuryBranch = b;
  renderPage();
}

function treasuryOptionsHtml(arr, val){
  return arr.map(o=>`<option value="${o}" ${val===o?'selected':''} style="background:#111a30; color:#fff;">${o}</option>`).join('');
}

async function pageAccounting(){
  if(session.role === 'trainer') return emptyState('صفحة المحاسبة غير متاحة للمدربين');

  const month  = window._acctMonth;
  const tab    = window._acctTab;
  const branch = window._acctBranch;

  // ── جلب البيانات ──────────────────────────────────────────
  const allEntries   = ((await sGet('ks_treasury_entries'))||[]).filter(e=>!e.deleted);
  const allPlayers   = (await sGet('ks_players'))||[];
  const acSubs       = (await sGet('ks_subs_'+month))||{};
  const teamSubs     = (await sGet('ks_team_subs_'+month))||{};
  const fitSubs      = (await sGet('ks_fitness_subs_'+month))||[];
  const extSubs      = (await sGet('ks_extra_subs_'+month))||[];
  const branches     = await getTreasuryBranches();

  const branchFilter = b => branch==='all' ? true : b===branch;

  // ── تصنيف القيود: إيرادات / مصروفات ─────────────────────
  const EXPENSE_CATS = ['مصروفات','راتب','راتب مشاهر','سلف','عيد','ايجار مثبت','ايجار غير مثبت','وي فت','مرافق','تمويل','رصيد مرحل','شهر قادم','تأمين ملاعب مثبتة'];
  const isExpense    = e => EXPENSE_CATS.includes(e.category);

  const periodEntries = allEntries.filter(e => {
    if(!e.entryDate) return false;
    if(!branchFilter(e.branch)) return false;
    return e.entryDate.slice(0,7) === month;
  });

  const totalRevenue  = periodEntries.filter(e=>!isExpense(e)).reduce((s,e)=>s+Number(e.amount||0),0);
  const totalExpenses = periodEntries.filter(e=> isExpense(e)).reduce((s,e)=>s+Number(e.amount||0),0);
  const netProfit     = totalRevenue - totalExpenses;

  // ── ملخص الاشتراكات للشهر ──────────────────────────────
  const activePlayers = allPlayers.filter(p=>p.role==='player' && p.status!=='inactive');
  const branchPlayers = activePlayers.filter(p=>branchFilter(p.branch));

  let subCollected=0, subExpected=0, subCount=0;
  branchPlayers.forEach(p=>{
    const s = acSubs[p.id] || teamSubs[p.id];
    if(s){ subExpected+=Number(s.expected||0); subCollected+=Number(s.paidAmt||0); if(s.paid) subCount++; }
  });
  const fitCollected = fitSubs.filter(s=>branchFilter(s.externalBranch||'all')).reduce((a,s)=>a+Number(s.paidAmt||0),0);
  const extCollected = extSubs.filter(s=>branchFilter(s.externalBranch||'all')).reduce((a,s)=>a+Number(s.paidAmt||0),0);
  const totalCollected = subCollected + fitCollected + extCollected;

  // ── تجميع حسب التصنيف ─────────────────────────────────
  const catTotals = {};
  periodEntries.forEach(e=>{
    const c = e.category||'غير محدد';
    catTotals[c] = (catTotals[c]||0) + Number(e.amount||0);
  });
  const catSorted = Object.entries(catTotals).sort((a,b)=>b[1]-a[1]);

  // ── بناء قيود اليومية بالقيد المزدوج الحقيقي ─────────────
  // خريطة الحسابات: receiptType → (حساب مدين، حساب دائن)
  function mapToDoubleEntry(e){
    const isExp  = EXPENSE_CATS.includes(e.category);
    const rType  = e.receiptType || 'وارد خزينة';
    const catAcc = e.category || 'إيراد متنوع';

    // حساب النقدية/البنك بحسب receiptType
    const cashAcc =
      (rType==='وارد بنك'||rType==='صادر بنك') ? 'م / البنك' :
      (rType==='وارد فيزا'||rType==='رد فيزا') ? 'م / حساب فيزا' :
      (rType==='انستاباي')                       ? 'م / انستاباي' : 'م / الخزينة';

    if(rType==='صادر خزينة'||rType==='صادر بنك'||rType==='رد فيزا'){
      // مصروف صادر: مدين = بند المصروف، دائن = الخزينة/البنك
      return { debitAcc: catAcc, creditAcc: cashAcc };
    } else {
      if(isExp){
        // حركة داخلية/مصروف وارد: مدين = الخزينة، دائن = بند
        return { debitAcc: cashAcc, creditAcc: catAcc };
      } else {
        // إيراد وارد: مدين = الخزينة/البنك، دائن = بند الإيراد
        return { debitAcc: cashAcc, creditAcc: catAcc };
      }
    }
  }

  const journalEntries = periodEntries.map(e=>{
    const de = mapToDoubleEntry(e);
    return {
      id:          e.id,
      date:        e.entryDate,
      ref:         e.receiptNo || ('ق-'+e.id.slice(-5)),
      debitAcc:    de.debitAcc,
      creditAcc:   de.creditAcc,
      amount:      Number(e.amount||0),

            <tfoot>

                <td colspan="3" style="padding:10px 8px; font-weight:800; font-size:13px;">إجمالي الفترة — ${monthNameFromKey(month)}</td>
                <td style="padding:10px 8px; font-size:14px; font-weight:900; color:var(--gold); text-align:left;">${Number(totalDebit).toLocaleString('ar-EG')} ج.م</td>

  // ══════════════════════════════════════════════════════════
  //  TAB 2: ميزان المراجعة
  // ══════════════════════════════════════════════════════════
  } else if(tab==='trial'){
    const tbRowsHtml = tbRows.map(([acc, v])=>{
      const bal = v.credit - v.debit;
      return `
        <tr style="border-bottom:1px solid var(--line-soft);">
          <td style="padding:9px 8px; font-size:13px; font-weight:700;">${acc}</td>
          <td style="padding:9px 8px; text-align:left; font-size:13px; color:var(--red-light); font-weight:${v.debit?800:400};">${v.debit ? fmt(v.debit)+' ج.م' : '—'}</td>
          <td style="padding:9px 8px; text-align:left; font-size:13px; color:var(--ok); font-weight:${v.credit?800:400};">${v.credit ? fmt(v.credit)+' ج.م' : '—'}</td>
          <td style="padding:9px 8px; text-align:left; font-size:13px; font-weight:900; color:${bal>=0?'var(--ok)':'var(--red-light)'};">${fmt(Math.abs(bal))} ج.م ${bal>=0?'د':'م'}</td>

    const isBalanced = Math.abs(tbTotalDebit-tbTotalCredit) < 1;
    tabContent = `
      <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:14px;">
        <div class="card" style="flex:1; padding:0; overflow:hidden;">
        <div style="padding:14px 16px; border-bottom:1px solid var(--line-soft); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
          <div style="font-weight:800; font-size:14px;">⚖️ ميزان المراجعة — ${monthNameFromKey(month)}</div>
          <div style="display:flex; gap:8px; align-items:center;">
            <div style="padding:5px 14px; border-radius:20px; font-size:12px; font-weight:800; background:${isBalanced?'rgba(63,143,107,0.2)':'rgba(166,55,59,0.2)'}; color:${isBalanced?'var(--ok)':'var(--red-light)'};">
              ${isBalanced ? '✅ الميزان متوازن' : '⚠️ الميزان غير متوازن'}
            </div>
            <button onclick="printFinancialReport('trial','${month}','${branch}')" style="padding:6px 14px; border-radius:8px; background:rgba(37,99,235,0.15); color:var(--blue-light); border:1px solid rgba(37,99,235,0.3); cursor:pointer; font-family:inherit; font-size:12px; font-weight:700;">🖨️ طباعة</button>
          </div>
        </div>
        <div style="overflow-x:auto;">
          <table style="width:100%; border-collapse:collapse;">
            <thead>
              <tr style="background:rgba(255,255,255,0.04);">
                <th style="padding:10px 8px; font-size:11px; color:rgba(255,255,255,0.5); text-align:right;">الحساب</th>
                <th style="padding:10px 8px; font-size:11px; color:var(--red-light); text-align:left;">مدين</th>

              </tr>
            </thead>
            <tbody>${tbRowsHtml}</tbody>
            <tfoot>
              <tr style="background:rgba(255,255,255,0.06); border-top:2px solid var(--line);">
                <td style="padding:10px 8px; font-weight:800;">الإجمالي</td>
                <td style="padding:10px 8px; text-align:left; font-weight:900; color:var(--red-light);">${fmt(tbTotalDebit)} ج.م</td>

  // ══════════════════════════════════════════════════════════
  //  TAB 3: قائمة الدخل
  // ══════════════════════════════════════════════════════════
  } else if(tab==='income'){
    // ══ قائمة الدخل الشاملة مع طباعة ══
    const margin = totalRevenue ? Math.round(netProfit/totalRevenue*100) : 0;
    const grossProfit = totalRevenue - totalExpenses;

    const revDetails = Object.entries(revByCategory).sort((a,b)=>b[1]-a[1]);
    const expDetails = Object.entries(expByCategory).sort((a,b)=>b[1]-a[1]);

      <button onclick="printFinancialReport('income','${month}','${branch}')"

      <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:14px;">

        <span style="font-size:12px; color:rgba(255,255,255,0.4);">${monthNameFromKey(month)}${branch!=='all'?' — '+branch:''}</span>

        ${colCard('صافي الربح', netProfit, 'هامش '+margin+'%', netProfit>=0?'var(--ok)':'var(--red-light)')}
        ${colCard('تحصيل الاشتراكات', totalCollected, subCount+' لاعب سدد', 'var(--gold)')}
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">
        <!-- إيرادات -->
        <div class="card" style="padding:0; overflow:hidden;">
          <div style="padding:12px 14px; border-bottom:1px solid var(--line-soft); display:flex; justify-content:space-between; align-items:center;">
            <span style="font-weight:800; color:var(--ok);">📈 الإيرادات</span>
            <span style="font-size:12px; color:var(--ok); font-weight:700;">${Number(totalRevenue).toLocaleString('ar-EG')} ج.م</span>
          </div>
          <table style="width:100%; border-collapse:collapse;">
            <thead><tr style="background:rgba(255,255,255,0.04);">
              <th style="padding:8px; font-size:11px; color:rgba(255,255,255,0.4); text-align:right;">البند</th>
              <th style="padding:8px; font-size:11px; color:rgba(255,255,255,0.4); text-align:left;">المبلغ</th>
              <th style="padding:8px; font-size:11px; color:rgba(255,255,255,0.4); text-align:left;">%</th>
            </tr></thead>
            <tbody>
              ${revDetails.map(([c,v])=>`
                <tr style="border-bottom:1px solid var(--line-soft);">
                  <td style="padding:9px 8px; font-size:12.5px;">${c}</td>
                  <td style="padding:9px 8px; font-size:12.5px; font-weight:800; color:var(--ok); text-align:left;">${Number(v).toLocaleString('ar-EG')} ج.م</td>
                  <td style="padding:9px 8px; font-size:11px; color:rgba(255,255,255,0.4); text-align:left;">${totalRevenue?Math.round(v/totalRevenue*100):0}%</td>
                </tr>`).join('') || '<tr><td colspan="3" style="padding:20px; text-align:center; opacity:.4;">لا توجد إيرادات</td></tr>'}
            </tbody>
            <tfoot><tr style="background:rgba(63,143,107,0.12);">
              <td style="padding:10px 8px; font-weight:900;">الإجمالي</td>
              <td style="padding:10px 8px; font-weight:900; color:var(--ok); text-align:left;">${Number(totalRevenue).toLocaleString('ar-EG')} ج.م</td>
              <td></td>
            </tr></tfoot>
          </table>
        </div>
        <!-- مصروفات -->
        <div class="card" style="padding:0; overflow:hidden;">
          <div style="padding:12px 14px; border-bottom:1px solid var(--line-soft); display:flex; justify-content:space-between; align-items:center;">
            <span style="font-weight:800; color:var(--red-light);">📉 المصروفات</span>
            <span style="font-size:12px; color:var(--red-light); font-weight:700;">${Number(totalExpenses).toLocaleString('ar-EG')} ج.م</span>
          </div>
          <table style="width:100%; border-collapse:collapse;">
            <thead><tr style="background:rgba(255,255,255,0.04);">
              <th style="padding:8px; font-size:11px; color:rgba(255,255,255,0.4); text-align:right;">البند</th>
              <th style="padding:8px; font-size:11px; color:rgba(255,255,255,0.4); text-align:left;">المبلغ</th>
              <th style="padding:8px; font-size:11px; color:rgba(255,255,255,0.4); text-align:left;">%</th>
            </tr></thead>
            <tbody>
              ${expDetails.map(([c,v])=>`
                <tr style="border-bottom:1px solid var(--line-soft);">
                  <td style="padding:9px 8px; font-size:12.5px;">${c}</td>
                  <td style="padding:9px 8px; font-size:12.5px; font-weight:800; color:var(--red-light); text-align:left;">${Number(v).toLocaleString('ar-EG')} ج.م</td>
                  <td style="padding:9px 8px; font-size:11px; color:rgba(255,255,255,0.4); text-align:left;">${totalExpenses?Math.round(v/totalExpenses*100):0}%</td>
                </tr>`).join('') || '<tr><td colspan="3" style="padding:20px; text-align:center; opacity:.4;">لا توجد مصروفات</td></tr>'}
            </tbody>
            <tfoot><tr style="background:rgba(166,55,59,0.12);">
              <td style="padding:10px 8px; font-weight:900;">الإجمالي</td>
              <td style="padding:10px 8px; font-weight:900; color:var(--red-light); text-align:left;">${Number(totalExpenses).toLocaleString('ar-EG')} ج.م</td>
              <td></td>
            </tr></tfoot>
          </table>
        </div>
      </div>
      <!-- خلاصة قائمة الدخل -->
      <div class="card" style="margin-top:14px; border:1px solid ${netProfit>=0?'rgba(63,143,107,0.3)':'rgba(166,55,59,0.3)'};">
        <div style="font-weight:800; font-size:14px; margin-bottom:14px; color:var(--gold);">📋 ملخص قائمة الدخل — ${monthNameFromKey(month)}</div>
        ${[
          ['إجمالي الإيرادات',  totalRevenue,  'var(--ok)'],
          ['(-) إجمالي المصروفات', -totalExpenses, 'var(--red-light)'],
          ['= صافي الربح / الخسارة', netProfit, netProfit>=0?'var(--ok)':'var(--red-light)'],
          ['هامش الربح الصافي', (totalRevenue?margin:0)+'%', netProfit>=0?'var(--ok)':'var(--warn)'],
        ].map(([l,v,c],i)=>`
          <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; ${i<3?'border-bottom:1px solid var(--line-soft);':''}${i===2?'border-top:2px solid var(--line); margin-top:4px;':''}">
            <span style="font-size:${i===2?14:13}px; font-weight:${i===2?900:600}; ${i===2?'color:var(--gold)':''}">${l}</span>
            <span style="font-size:${i===2?16:14}px; font-weight:900; color:${c};">${typeof v==='number'?Math.abs(v).toLocaleString('ar-EG')+' ج.م':v}</span>
          </div>`).join('')}
      </div>`;

  // ══════════════════════════════════════════════════════════
  //  TAB: قائمة المركز المالي (الميزانية)
  // ══════════════════════════════════════════════════════════
  } else if(tab==='position'){
    const tree = (await sGet('ks_chart_of_accounts')) || getDefaultChartOfAccounts();
    const allTreasury = ((await sGet('ks_treasury_entries'))||[]).filter(e=>!e.deleted);
    // رصيد الخزينة النقدي الفعلي
    const cashBalance = allTreasury.reduce((s,e)=>{
      const sign = treasuryReceiptSign(e.receiptType||'وارد خزينة');
      return s + sign*Number(e.amount||0);
    }, 0);

    // حساب أرصدة كل مجموعة من الشجرة
    const catBal = {};
    allTreasury.filter(e=>branchFilter(e.branch)).forEach(e=>{
      catBal[e.category||''] = (catBal[e.category||'']||0)+Number(e.amount||0);
    });

    function sumGroup(node){
      if(!node.children||!node.children.length) return catBal[node.name]||0;
      return node.children.reduce((s,c)=>s+sumGroup(c),0);
    }

    const assetNode  = tree.find(n=>n.type==='أصول');
    const liabNode   = tree.find(n=>n.type==='التزامات');
    const equityNode = tree.find(n=>n.type==='حقوق الملكية');

    const renderBSGroup = (node, indent=0) => {
      if(!node) return '';
      const val = sumGroup(node);
      const hasKids = node.children && node.children.length>0;
      return `
        <div style="display:flex; justify-content:space-between; padding:${hasKids?'10px 12px':'7px 12px'}; padding-right:${12+indent*16}px; border-bottom:1px solid rgba(255,255,255,0.04); ${indent===0?'background:rgba(255,255,255,0.04); font-weight:900;':indent===1?'font-weight:700;':''}">
          <span style="font-size:${13-indent}px;">${node.code?`<span style="color:rgba(255,255,255,0.3); font-size:10px; margin-left:6px;">${node.code}</span>`:''}${node.name}</span>
          ${!hasKids || indent>0 ? `<span style="font-size:${13-indent}px; font-weight:${indent===0?900:700}; color:${val>=0?'var(--ok)':'var(--red-light)'};">${Math.abs(val).toLocaleString('ar-EG')} ج.م</span>` : `<span style="font-size:13px; font-weight:900; color:var(--gold);">${Math.abs(val).toLocaleString('ar-EG')} ج.م</span>`}
        </div>
        ${hasKids ? node.children.map(c=>renderBSGroup(c,indent+1)).join('') : ''}`;
    };

    const totalAssets  = assetNode  ? sumGroup(assetNode)  : cashBalance;
    const totalLiab    = liabNode   ? sumGroup(liabNode)   : 0;
    const totalEquity  = equityNode ? sumGroup(equityNode) : (totalAssets - totalLiab);
    const isBalanced   = Math.abs((totalLiab+totalEquity) - totalAssets) < 1;

    tabContent = `
      <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:14px;">
        <span style="font-size:14px; font-weight:800;">🏦 قائمة المركز المالي</span>
        <span style="font-size:12px; color:rgba(255,255,255,0.4);">في ${monthNameFromKey(month)}</span>
        <div style="margin-right:auto; display:flex; gap:8px;">
          <span style="padding:5px 12px; border-radius:10px; font-size:11px; font-weight:800; background:${isBalanced?'rgba(63,143,107,0.15)':'rgba(166,55,59,0.15)'}; color:${isBalanced?'var(--ok)':'var(--red-light)'};">${isBalanced?'✅ الميزانية متوازنة':'⚠️ غير متوازنة'}</span>
          <button onclick="printFinancialReport('position','${month}','${branch}')" style="padding:6px 14px; border-radius:8px; background:rgba(37,99,235,0.15); color:var(--blue-light); border:1px solid rgba(37,99,235,0.3); cursor:pointer; font-family:inherit; font-size:12px; font-weight:700;">🖨️ طباعة</button>
        </div>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">
        <!-- الأصول -->
        <div class="card" style="padding:0; overflow:hidden;">
          <div style="padding:12px 14px; border-bottom:1px solid var(--line-soft); display:flex; justify-content:space-between;">
            <span style="font-weight:800; color:var(--blue-light);">🏗️ الأصول</span>
            <span style="font-weight:900; color:var(--gold);">${Math.abs(totalAssets).toLocaleString('ar-EG')} ج.م</span>
          </div>
          <div style="padding:8px 0;">
            <!-- نقدية الخزينة دائماً مرئية -->
            <div style="display:flex; justify-content:space-between; padding:8px 12px; border-bottom:1px solid rgba(255,255,255,0.04); background:rgba(255,255,255,0.02);">
              <span style="font-size:12.5px;">م / الخزينة (رصيد فعلي)</span>
              <span style="font-size:13px; font-weight:800; color:${cashBalance>=0?'var(--ok)':'var(--red-light)'};">${Math.abs(cashBalance).toLocaleString('ar-EG')} ج.م</span>
            </div>
            ${assetNode ? assetNode.children.map(c=>renderBSGroup(c,1)).join('') : ''}
          </div>
        </div>
        <!-- الالتزامات + حقوق الملكية -->
        <div>
          <div class="card" style="padding:0; overflow:hidden; margin-bottom:12px;">
            <div style="padding:12px 14px; border-bottom:1px solid var(--line-soft); display:flex; justify-content:space-between;">
              <span style="font-weight:800; color:var(--warn);">📋 الالتزامات</span>
              <span style="font-weight:900; color:var(--gold);">${Math.abs(totalLiab).toLocaleString('ar-EG')} ج.م</span>
            </div>
            <div style="padding:8px 0;">${liabNode ? liabNode.children.map(c=>renderBSGroup(c,1)).join('') : '<div style="padding:16px; text-align:center; opacity:.4; font-size:12px;">لا توجد التزامات مسجلة</div>'}</div>
          </div>
          <div class="card" style="padding:0; overflow:hidden;">
            <div style="padding:12px 14px; border-bottom:1px solid var(--line-soft); display:flex; justify-content:space-between;">
              <span style="font-weight:800; color:var(--gold);">🏛️ حقوق الملكية</span>
              <span style="font-weight:900; color:var(--gold);">${Math.abs(totalEquity).toLocaleString('ar-EG')} ج.م</span>
            </div>
            <div style="padding:8px 0;">
              ${equityNode ? equityNode.children.map(c=>renderBSGroup(c,1)).join('') : ''}
              <div style="display:flex; justify-content:space-between; padding:8px 12px; border-bottom:1px solid rgba(255,255,255,0.04);">
                <span style="font-size:12.5px;">أرباح الفترة (${monthNameFromKey(month)})</span>
                <span style="font-size:13px; font-weight:800; color:${netProfit>=0?'var(--ok)':'var(--red-light)'};">${Math.abs(netProfit).toLocaleString('ar-EG')} ج.م</span>
              </div>
            </div>
          </div>
          <div style="padding:12px 14px; border-radius:12px; background:rgba(255,255,255,0.04); margin-top:10px; display:flex; justify-content:space-between; align-items:center;">
            <span style="font-weight:900; font-size:13px;">إجمالي الالتزامات + حقوق الملكية</span>
            <span style="font-size:15px; font-weight:900; color:var(--gold);">${Math.abs(totalLiab+totalEquity).toLocaleString('ar-EG')} ج.م</span>
          </div>
        </div>
      </div>`;

  // ══════════════════════════════════════════════════════════
  //  TAB: قائمة التدفقات النقدية
  // ══════════════════════════════════════════════════════════
  } else if(tab==='cashflow'){
    const allTreasury = ((await sGet('ks_treasury_entries'))||[]).filter(e=>!e.deleted);
    const pEntries = allTreasury.filter(e=>e.entryDate&&e.entryDate.slice(0,7)===month&&branchFilter(e.branch));

    // تصنيف التدفقات: تشغيلية / استثمارية / تمويلية
    const OPS_CATS   = ['اشتراك','فيتنس','فيتنس / جيم','جماعي','جماعي خارجي','استروكر','الاعداد','ايرادات اخرى','معسكر','بطولة','الاتحاد','مصروفات','راتب','راتب مشاهر','سلف','عيد','وي فت','مرافق','شهر قادم'];
    const INV_CATS   = ['معدات','أثاث','أجهزة'];
    const FIN_CATS   = ['تمويل','رصيد مرحل','تأمين ملاعب مثبتة','ايجار مثبت','ايجار غير مثبت'];

    let opInflow=0, opOutflow=0, invInflow=0, invOutflow=0, finInflow=0, finOutflow=0;
    const opRows=[], invRows=[], finRows=[];

    pEntries.forEach(e=>{
      const sign = treasuryReceiptSign(e.receiptType||'وارد خزينة');
      const amt  = Number(e.amount||0);
      const isIn = sign > 0;
      const cat  = e.category||'';
      const row  = {desc: e.statement||e.beneficiaryName||cat, amount:amt, date:e.entryDate, in:isIn, cat};

      if(INV_CATS.some(c=>cat.includes(c))){ isIn ? (invInflow+=amt,invRows.push(row)) : (invOutflow+=amt,invRows.push(row)); }
      else if(FIN_CATS.includes(cat)){ isIn ? (finInflow+=amt,finRows.push(row)) : (finOutflow+=amt,finRows.push(row)); }
      else { isIn ? (opInflow+=amt,opRows.push(row)) : (opOutflow+=amt,opRows.push(row)); }
    });

    const netOp  = opInflow  - opOutflow;
    const netInv = invInflow - invOutflow;
    const netFin = finInflow - finOutflow;
    const netCash= netOp + netInv + netFin;

    const cfSection = (title, color, icon, rows, netAmt) => `
      <div class="card" style="padding:0; overflow:hidden; margin-bottom:12px;">
        <div style="padding:12px 14px; border-bottom:1px solid var(--line-soft); display:flex; justify-content:space-between; align-items:center;">
          <span style="font-weight:800; color:${color};">${icon} ${title}</span>

  // ══════════════════════════════════════════════════════════
  //  TAB: قائمة التغير في حقوق الملكية
  // ══════════════════════════════════════════════════════════
  } else if(tab==='equity'){
    // حساب الشهر السابق
    const [y,m2] = month.split('-').map(Number);
    const prevMonth = m2===1 ? `${y-1}-12` : `${y}-${String(m2-1).padStart(2,'0')}`;

    const allTreasury = ((await sGet('ks_treasury_entries'))||[]).filter(e=>!e.deleted);
    const sumPeriod = (mth, isRev) => allTreasury.filter(e=>e.entryDate?.slice(0,7)===mth&&branchFilter(e.branch)).reduce((s,e)=>{
      const exp = EXPENSE_CATS.includes(e.category);
      return (isRev ? !exp : exp) ? s+Number(e.amount||0) : s;
    },0);

    const prevRev = sumPeriod(prevMonth, true);
    const prevExp = sumPeriod(prevMonth, false);
    const prevNet = prevRev - prevExp;

    // رأس المال الافتراضي من الشجرة
    const tree = (await sGet('ks_chart_of_accounts')) || getDefaultChartOfAccounts();
    const equityNode = tree.find(n=>n.type==='حقوق الملكية');
    const capitalNode= equityNode?.children?.find(n=>n.name.includes('رأس المال'));
    const paidCap    = 0; // قابل للتعديل

    const openingEquity = prevNet + paidCap;

    const eqRow = (label, val, style='') => `

        <td style="padding:10px 14px; text-align:left; font-size:13px; font-weight:800; color:${val>=0?'var(--ok)':'var(--red-light)'};">${(val>=0?'+':'')}${Math.abs(val).toLocaleString('ar-EG')} ج.م</td>

        <span style="font-size:14px; font-weight:800;">🏛️ قائمة التغير في حقوق الملكية</span>
        <span style="font-size:12px; color:rgba(255,255,255,0.4);">${monthNameFromKey(prevMonth)} — ${monthNameFromKey(month)}</span>

        <table style="width:100%; border-collapse:collapse;">

            <th style="padding:10px 14px; font-size:11px; color:rgba(255,255,255,0.4); text-align:right;">البيان</th>
            <th style="padding:10px 14px; font-size:11px; color:rgba(255,255,255,0.4); text-align:left;">التغيير</th>

              <td style="padding:10px 14px; font-size:14px; font-weight:900; color:${netProfit>=0?'var(--ok)':'var(--red-light)'};">${(netProfit>=0?'+':'')}${Math.abs(netProfit).toLocaleString('ar-EG')} ج.م</td>

  // ══════════════════════════════════════════════════════════
  //  TAB 4: تسوية الاشتراكات (unchanged but with print)
  // ══════════════════════════════════════════════════════════
  } else if(tab==='subs'){
    // اشتراكات الأكاديمية
    const acRows = branchPlayers.map(p=>{
      const s = acSubs[p.id];

      const diff = Number(s.paidAmt||0) - Number(s.expected||0);
      return `
        <tr style="border-bottom:1px solid var(--line-soft);">
          <td style="padding:8px 6px; font-size:12.5px; font-weight:700;">${p.name}</td>

    // فيتنس
    const fitRows = fitSubs.filter(s=>s.playerId&&branchFilter(s.externalBranch||s.branch||'all')).map(s=>{

            <span style="padding:3px 8px; border-radius:20px; font-size:10.5px; font-weight:800; background:${s.paid?'rgba(63,143,107,0.2)':'rgba(166,55,59,0.2)'}; color:${s.paid?'var(--ok)':'var(--red-light)'};">${s.paid?'سدد ✅':'لم يسدد ❌'}</span>

    // إضافية

          <td style="padding:8px 4px; text-align:center;">
            <span style="padding:3px 8px; border-radius:20px; font-size:10.5px; font-weight:800; background:${s.paid?'rgba(63,143,107,0.2)':'rgba(166,55,59,0.2)'}; color:${s.paid?'var(--ok)':'var(--red-light)'};">${s.paid?'سدد ✅':'لم يسدد ❌'}</span>

    const subTable = (title, headers, rows, total, color) => `

        </table></div>
      </div>`;

    tabContent =
      subTable('🏸 اشتراكات الأكاديمية والفريق',
        [{label:'اللاعب'},{label:'الفرع'},{label:'المستحق',align:'left'},{label:'المحصّل',align:'left'},{label:'الفرق',align:'left'},{label:'الحالة',align:'center'}],
        acRows, subCollected, 'var(--ok)') +
      subTable('💪 اشتراكات الفيتنس',
        [{label:'اللاعب'},{label:'الفرع'},{label:'المستحق',align:'left'},{label:'المحصّل',align:'left'},{label:'الجلسات',align:'left'},{label:'الحالة',align:'center'}],

      subTable('🎯 التمارين الإضافية',
        [{label:'اللاعب'},{label:'الفرع'},{label:'نوع التمرين'},{label:'المستحق',align:'left'},{label:'المحصّل',align:'left'},{label:'الحالة',align:'center'}],
        extRows, extCollected, 'var(--warn)');

  // ══════════════════════════════════════════════════════════
  //  TAB 5: تحليل التصنيفات

  } else if(tab==='cats'){
    const grandTotal = catSorted.reduce((s,[,v])=>s+v,0);
    const catBars = catSorted.map(([c,v])=>{

      const pct = grandTotal ? Math.round(v/grandTotal*100) : 0;

          </div>
        </div>`;
    }).join('');

    // تحليل الفروع
    const branchTotals = {};
    periodEntries.forEach(e=>{
      const b = e.branch||'—';
      if(!branchTotals[b]) branchTotals[b]={rev:0,exp:0};
      if(isExpense(e)) branchTotals[b].exp+=Number(e.amount||0);
      else             branchTotals[b].rev+=Number(e.amount||0);
    });
    const branchRows = Object.entries(branchTotals).sort((a,b)=>(b[1].rev-b[1].exp)-(a[1].rev-a[1].exp)).map(([b,v])=>`
      <tr style="border-bottom:1px solid var(--line-soft);">
        <td style="padding:9px 8px; font-size:13px; font-weight:700;">${b}</td>
        <td style="padding:9px 8px; text-align:left; font-size:13px; color:var(--ok);">${fmt(v.rev)} ج.م</td>
        <td style="padding:9px 8px; text-align:left; font-size:13px; color:var(--red-light);">${fmt(v.exp)} ج.م</td>
        <td style="padding:9px 8px; text-align:left; font-size:13px; font-weight:900; color:${v.rev-v.exp>=0?'var(--ok)':'var(--red-light)'};">${fmt(v.rev-v.exp)} ج.م</td>
      </tr>`).join('');

    tabContent = `
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">

        </div>
        <div class="card" style="padding:0; overflow:hidden;">
          <div style="padding:12px 14px; border-bottom:1px solid var(--line-soft); font-weight:800;">🏢 تحليل الفروع</div>
          <table style="width:100%; border-collapse:collapse;">
            <thead><tr style="background:rgba(255,255,255,0.04);">
              <th style="padding:9px 8px; font-size:11px; color:rgba(255,255,255,0.5); text-align:right;">الفرع</th>
              <th style="padding:9px 8px; font-size:11px; color:var(--ok); text-align:left;">إيرادات</th>
              <th style="padding:9px 8px; font-size:11px; color:var(--red-light); text-align:left;">مصروفات</th>
              <th style="padding:9px 8px; font-size:11px; color:var(--gold); text-align:left;">صافي</th>
            </tr></thead>
            <tbody>${branchRows || '<tr><td colspan="4" style="padding:20px; text-align:center; opacity:.4;">لا توجد بيانات</td></tr>'}</tbody>
          </table>
        </div>
      </div>`;

  // ══════════════════════════════════════════════════════════
  //  TAB 0: شجرة الحسابات
  // ══════════════════════════════════════════════════════════
  } else if(tab === 'chart'){
    const tree = (await sGet('ks_chart_of_accounts')) || getDefaultChartOfAccounts();

    // حساب الأرصدة من الخزينة لكل حساب
    const allTreasury = ((await sGet('ks_treasury_entries'))||[]).filter(e=>!e.deleted);
    const catBalance = {};
    allTreasury.forEach(e=>{
      const c = e.category||'';
      catBalance[c] = (catBalance[c]||0) + Number(e.amount||0);
    });

    // بناء HTML الشجرة
    function renderNode(node, depth=0){
      const pad = depth * 20;
      const hasChildren = node.children && node.children.length > 0;
      const bal = catBalance[node.name] || 0;
      const typeColor = {
        'أصول':'var(--blue-light)',
        'التزامات':'var(--warn)',
        'حقوق الملكية':'var(--gold)',
        'إيرادات':'var(--ok)',
        'مصروفات':'var(--red-light)',
      }[node.type] || 'rgba(255,255,255,0.6)';

      const typeTag = node.type && depth===0 ? `
        <span style="padding:2px 10px; border-radius:12px; font-size:10px; font-weight:800; background:${typeColor}22; color:${typeColor}; margin-right:6px;">${node.type}</span>` : '';

      const balTag = !hasChildren && bal ? `
        <span style="margin-right:auto; font-size:12.5px; font-weight:900; color:${node.type==='مصروفات'?'var(--red-light)':'var(--ok)'};">${Number(bal).toLocaleString('ar-EG')} ج.م</span>` : '';

      const childrenHtml = hasChildren
        ? node.children.map(ch=>renderNode(ch, depth+1)).join('')
        : '';

      const isMain = depth === 0;
      const isSub  = depth === 1;

      return `
        <div class="acct-node" data-id="${node.id}" style="margin-right:${pad}px;">
          <div class="acct-row ${isMain?'acct-main':''}${isSub?' acct-sub':''}" 
               style="display:flex; align-items:center; gap:8px; padding:${isMain?'12px 14px':'8px 12px'}; 
                      border-bottom:1px solid rgba(255,255,255,0.05);
                      background:${isMain?'rgba(255,255,255,0.05)':depth===2?'rgba(255,255,255,0.02)':'transparent'};
                      border-right:${isMain?'3px solid '+typeColor:'none'};
                      cursor:pointer;"
               onclick="openAccountDetails('${node.id}')" title="اضغط لعرض بيانات الحساب الفعلية">
            ${hasChildren ? `<span class="acct-arrow" id="arr_${node.id}" onclick="event.stopPropagation(); toggleAcctNode('${node.id}')" style="color:rgba(255,255,255,0.5); font-size:11px; transition:.2s; flex-shrink:0; padding:2px 4px;">▼</span>` : `<span style="width:14px; flex-shrink:0;"></span>`}
            <span style="font-size:${isMain?'13.5px':isSub?'13px':'12.5px'}; font-weight:${isMain?900:isSub?700:500}; flex:1;">${node.code ? `<span style="color:rgba(255,255,255,0.35); font-size:11px; margin-left:6px;">${node.code}</span>` : ''}${node.name}</span>
            ${typeTag}
            ${balTag}
            <div style="display:flex; gap:4px; flex-shrink:0;" onclick="event.stopPropagation()">
              <button onclick="openAcctModal('edit','${node.id}')" style="padding:3px 8px; border-radius:6px; background:rgba(37,99,235,0.15); color:var(--blue-light); border:none; cursor:pointer; font-size:11px;">✏️</button>
              ${!hasChildren ? `<button onclick="deleteAcctNode('${node.id}')" style="padding:3px 8px; border-radius:6px; background:rgba(166,55,59,0.15); color:var(--red-light); border:none; cursor:pointer; font-size:11px;">🗑️</button>` : ''}
              <button onclick="openAcctModal('add','${node.id}')" style="padding:3px 8px; border-radius:6px; background:rgba(63,143,107,0.15); color:var(--ok); border:none; cursor:pointer; font-size:11px;">+</button>
            </div>
          </div>
          <div class="acct-children" id="ch_${node.id}" style="display:block;">
            ${childrenHtml}
          </div>
        </div>`;
    }

    const treeHtml = tree.map(n=>renderNode(n,0)).join('');

    // إجماليات
    const totalAssets   = tree.find(n=>n.type==='أصول')?.children?.reduce((s,c)=>s+(catBalance[c.name]||0)+((c.children||[]).reduce((ss,cc)=>ss+(catBalance[cc.name]||0),0)),0)||0;
    const totalRev      = tree.find(n=>n.type==='إيرادات')?.children?.reduce((s,c)=>s+(catBalance[c.name]||0)+((c.children||[]).reduce((ss,cc)=>ss+(catBalance[cc.name]||0),0)),0)||0;
    const totalExp      = tree.find(n=>n.type==='مصروفات')?.children?.reduce((s,c)=>s+(catBalance[c.name]||0)+((c.children||[]).reduce((ss,cc)=>ss+(catBalance[cc.name]||0),0)),0)||0;

    tabContent = `
      <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; align-items:center;">
        <button onclick="openAcctModal('addMain')" class="btn btn-primary" style="padding:8px 16px; font-size:13px;">+ إضافة حساب رئيسي</button>
        <button onclick="mergeBranchStructure()" class="btn btn-ghost" style="padding:8px 14px; font-size:12px; color:var(--gold);">🏢 إضافة هيكل الفروع</button>
        <input type="text" placeholder="🔍 ابحث في الشجرة بالاسم أو الرقم..." oninput="filterAcctTree(this.value)" style="padding:8px 12px; border-radius:10px; background:rgba(255,255,255,0.06); color:#fff; border:1px solid var(--line); font-family:inherit; font-size:12.5px; min-width:200px;">
        <button onclick="resetChartOfAccounts()" class="btn btn-ghost" style="padding:8px 14px; font-size:12px; color:rgba(255,255,255,0.4);">↺ استعادة الافتراضي</button>
        <button onclick="printChartOfAccounts()" class="btn btn-ghost" style="padding:8px 14px; font-size:12px; color:var(--blue-light);">🖨️ طباعة تقرير الشجرة</button>
        <div style="margin-right:auto; display:flex; gap:10px; flex-wrap:wrap;">
          <div style="padding:6px 14px; border-radius:10px; background:rgba(37,99,235,0.12); color:var(--blue-light); font-size:12px; font-weight:800;">إجمالي الأصول: ${Number(totalAssets).toLocaleString('ar-EG')} ج.م</div>
          <div style="padding:6px 14px; border-radius:10px; background:rgba(63,143,107,0.12); color:var(--ok); font-size:12px; font-weight:800;">الإيرادات: ${Number(totalRev).toLocaleString('ar-EG')} ج.م</div>
          <div style="padding:6px 14px; border-radius:10px; background:rgba(166,55,59,0.12); color:var(--red-light); font-size:12px; font-weight:800;">المصروفات: ${Number(totalExp).toLocaleString('ar-EG')} ج.م</div>
        </div>
      </div>
      <div class="card" style="padding:0; overflow:hidden;">
        <div style="padding:12px 16px; border-bottom:1px solid var(--line-soft); display:flex; align-items:center; gap:10px;">
          <span style="font-weight:800; font-size:14px;">🌳 شجرة الحسابات</span>
          <span style="font-size:12px; color:rgba(255,255,255,0.4);">قابلة للتعديل والتخصيص الكامل</span>
        </div>
        <div style="overflow-x:auto;">
          ${treeHtml || '<div style="padding:30px; text-align:center; opacity:.4;">الشجرة فارغة</div>'}
        </div>
      </div>`;

  // ══════════════════════════════════════════════════════════
  //  🎯 الموازنة التقديرية
  // ══════════════════════════════════════════════════════════
  } else if(tab==='budget'){
    const budgetGoals = (await sGet('ks_budget_goals'))||{};
    const monthGoals  = budgetGoals[month]||{};
    const allRevCats  = [...new Set(periodEntries.filter(e=>!isExpense(e)).map(e=>e.category||'إيراد'))];
    const allExpCats  = [...new Set(periodEntries.filter(e=> isExpense(e)).map(e=>e.category||'مصروف'))];
    const allCats     = [...new Set([...allRevCats,...allExpCats,...Object.keys(monthGoals).filter(k=>k!=='__overall__')])];

    const overallBudget  = Number(monthGoals['__overall__']||0);
    const overallActual  = totalRevenue;
    const overallVar     = overallActual - overallBudget;
    const overallPct     = overallBudget ? Math.round(overallActual/overallBudget*100) : 0;

    const catRows = allCats.map(c=>{
      const budget = Number(monthGoals[c]||0);
      const actual = periodEntries.filter(e=>e.category===c).reduce((s,e)=>s+Number(e.amount||0),0);
      const variance= actual - budget;
      const pct    = budget ? Math.round(actual/budget*100) : 0;
      const isExp  = EXPENSE_CATS.includes(c);
      const good   = isExp ? variance<=0 : variance>=0;
      return {c, budget, actual, variance, pct, isExp, good};
    }).filter(r=>r.budget>0||r.actual>0).sort((a,b)=>b.budget-a.budget);

    const printBudget = `<button onclick="printFinancialReport('budget','${month}','${branch}')" style="padding:6px 14px; border-radius:8px; background:rgba(37,99,235,0.15); color:var(--blue-light); border:1px solid rgba(37,99,235,0.3); cursor:pointer; font-family:inherit; font-size:12px; font-weight:700;">🖨️ طباعة</button>`;

    tabContent = `
      <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:14px;">
        <span style="font-size:14px; font-weight:800;">🎯 الموازنة التقديرية</span>
        <span style="font-size:12px; color:rgba(255,255,255,0.4);">${monthLabel(month)}</span>
        <div style="margin-right:auto; display:flex; gap:8px;">${printBudget}
          <button onclick="openBudgetModal('${month}')" class="btn btn-primary" style="padding:6px 16px; font-size:12px;">✏️ تعديل الموازنة</button>
        </div>
      </div>
      <!-- KPI -->
      <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:16px;">
        ${colCard('الميزانية المستهدفة', overallBudget, monthLabel(month), 'var(--blue-light)')}
        ${colCard('الإيرادات الفعلية', overallActual, overallPct+'% من الهدف', overallPct>=100?'var(--ok)':'var(--warn)')}
        ${colCard('الفارق', Math.abs(overallVar), overallVar>=0?'فائض ✅':'عجز ⚠️', overallVar>=0?'var(--ok)':'var(--red-light)')}
        ${colCard('نسبة التحقق', overallPct+'%', overallPct>=100?'هدف محقق 🎉':'جاري التحقيق', overallPct>=100?'var(--ok)':'var(--gold)')}
      </div>
      <!-- جدول الموازنة -->
      <div class="card" style="padding:0; overflow:hidden;">
        <div style="padding:12px 16px; border-bottom:1px solid var(--line-soft); font-weight:800;">📋 تفاصيل الموازنة بند بند</div>
        <div style="overflow-x:auto;">
          <table style="width:100%; border-collapse:collapse;">
            <thead><tr style="background:rgba(255,255,255,0.05);">
              <th style="padding:9px 10px; font-size:11px; color:rgba(255,255,255,0.4); text-align:right;">البند</th>
              <th style="padding:9px 10px; font-size:11px; color:rgba(255,255,255,0.4); text-align:center;">النوع</th>
              <th style="padding:9px 10px; font-size:11px; color:var(--blue-light); text-align:left;">المستهدف</th>
              <th style="padding:9px 10px; font-size:11px; color:var(--ok); text-align:left;">الفعلي</th>
              <th style="padding:9px 10px; font-size:11px; color:var(--gold); text-align:left;">الفارق</th>
              <th style="padding:9px 10px; font-size:11px; color:rgba(255,255,255,0.4); text-align:center;">التحقق</th>
              <th style="padding:9px 10px; font-size:11px; color:rgba(255,255,255,0.4); text-align:center;">إجراء</th>
            </tr></thead>
            <tbody>
              ${catRows.map(r=>`
                <tr style="border-bottom:1px solid var(--line-soft);">
                  <td style="padding:9px 10px; font-size:13px; font-weight:700;">${r.c}</td>
                  <td style="padding:9px 10px; text-align:center;"><span style="padding:2px 8px; border-radius:12px; font-size:10px; font-weight:800; background:${r.isExp?'rgba(166,55,59,0.15)':'rgba(63,143,107,0.15)'}; color:${r.isExp?'var(--red-light)':'var(--ok)'};">${r.isExp?'مصروف':'إيراد'}</span></td>
                  <td style="padding:9px 10px; font-size:13px; font-weight:700; color:var(--blue-light); text-align:left;">${r.budget?fmt(r.budget)+' ج.م':'—'}</td>
                  <td style="padding:9px 10px; font-size:13px; font-weight:700; color:var(--ok); text-align:left;">${r.actual?fmt(r.actual)+' ج.م':'—'}</td>
                  <td style="padding:9px 10px; font-size:13px; font-weight:800; color:${r.good?'var(--ok)':'var(--red-light)'}; text-align:left;">${r.variance>=0?'+':''}${fmt(r.variance)} ج.م</td>
                  <td style="padding:9px 10px; text-align:center;">
                    <div style="display:flex; flex-direction:column; align-items:center; gap:3px;">
                      <span style="font-size:12px; font-weight:800; color:${r.good?'var(--ok)':'var(--warn)'};">${r.pct}%</span>
                      <div style="width:60px; height:5px; border-radius:3px; background:rgba(255,255,255,0.1); overflow:hidden;">
                        <div style="height:100%; width:${Math.min(r.pct,100)}%; background:${r.good?'var(--ok)':'var(--warn)'}; border-radius:3px;"></div>
                      </div>
                    </div>
                  </td>
                  <td style="padding:9px 6px; text-align:center;">
                    <button onclick="openBudgetItemModal('${month}','${r.c}')" style="padding:3px 10px; border-radius:6px; background:rgba(37,99,235,0.15); color:var(--blue-light); border:none; cursor:pointer; font-size:11px;">✏️ تعديل</button>
                  </td>
                </tr>`).join('') || '<tr><td colspan="7" style="padding:24px; text-align:center; opacity:.4;">لا توجد موازنة لهذا الشهر — اضغط "تعديل الموازنة" لإنشائها</td></tr>'}
            </tbody>
            ${catRows.length ? `<tfoot>
              <tr style="background:rgba(255,255,255,0.06); border-top:2px solid var(--line);">
                <td colspan="2" style="padding:9px 10px; font-weight:900;">الإجمالي</td>
                <td style="padding:9px 10px; font-weight:900; color:var(--blue-light); text-align:left;">${fmt(catRows.reduce((s,r)=>s+r.budget,0))} ج.م</td>
                <td style="padding:9px 10px; font-weight:900; color:var(--ok); text-align:left;">${fmt(catRows.reduce((s,r)=>s+r.actual,0))} ج.م</td>
                <td style="padding:9px 10px; font-weight:900; text-align:left; color:overallVar>=0?'var(--ok)':'var(--red-light)';">${fmt(overallVar)} ج.م</td>
                <td colspan="2"></td>
              </tr>
            </tfoot>` : ''}
          </table>
        </div>
      </div>`;

  // ══════════════════════════════════════════════════════════
  //  🏢 مراكز التكلفة
  // ══════════════════════════════════════════════════════════
  } else if(tab==='costcenter'){
    const allTreasury = ((await sGet('ks_treasury_entries'))||[]).filter(e=>!e.deleted);
    const branches    = await getTreasuryBranches();
    const allAcSubs   = (await sGet('ks_subs_'+month))||{};
    const allTmSubs   = (await sGet('ks_team_subs_'+month))||{};
    const allPlayers2 = (await sGet('ks_players'))||[];

    // تجميع بيانات كل فرع
    const centers = {};
    branches.forEach(b=>{ centers[b]={rev:0,exp:0,subs:0,subsExp:0,players:0,entries:[]}; });

    allTreasury.forEach(e=>{
      const b=e.branch;
      if(!centers[b]) centers[b]={rev:0,exp:0,subs:0,subsExp:0,players:0,entries:[]};
      const isE=EXPENSE_CATS.includes(e.category||'');
      if(isE) centers[b].exp+=Number(e.amount||0);
      else    centers[b].rev+=Number(e.amount||0);
      if(e.entryDate?.slice(0,7)===month) centers[b].entries.push(e);
    });

    allPlayers2.filter(p=>p.role==='player'&&p.status!=='inactive').forEach(p=>{
      const b=p.branch;
      if(centers[b]) {
        centers[b].players++;
        const s=allAcSubs[p.id]||allTmSubs[p.id];
        if(s){ centers[b].subsExp+=Number(s.expected||0); centers[b].subs+=Number(s.paidAmt||0); }
      }
    });

    const sortedCenters = Object.entries(centers).sort((a,b)=>(b[1].rev-b[1].exp)-(a[1].rev-a[1].exp));
    const grandRev = sortedCenters.reduce((s,[,v])=>s+v.rev,0);
    const grandExp = sortedCenters.reduce((s,[,v])=>s+v.exp,0);

    tabContent = `
      <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:14px;">
        <span style="font-size:14px; font-weight:800;">🏢 مراكز التكلفة — الفروع</span>
        <span style="font-size:12px; color:rgba(255,255,255,0.4);">كامل الفترة — ${sortedCenters.length} فرع</span>
        <button onclick="printFinancialReport('costcenter','${month}','${branch}')" style="margin-right:auto; padding:6px 14px; border-radius:8px; background:rgba(37,99,235,0.15); color:var(--blue-light); border:1px solid rgba(37,99,235,0.3); cursor:pointer; font-family:inherit; font-size:12px; font-weight:700;">🖨️ طباعة</button>
      </div>
      <!-- مقارنة بصرية -->
      <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; margin-bottom:16px;">
        ${sortedCenters.slice(0,6).map(([b,v])=>{
          const net=v.rev-v.exp; const collR=v.subsExp?Math.round(v.subs/v.subsExp*100):0;
          return `<div style="background:rgba(255,255,255,0.04); border:1px solid var(--line); border-radius:12px; padding:14px;">
            <div style="font-size:13px; font-weight:800; margin-bottom:10px; color:var(--gold);">🏢 ${b}</div>
            <div style="font-size:11px; color:rgba(255,255,255,0.4); margin-bottom:2px;">إيرادات</div>
            <div style="font-size:14px; font-weight:900; color:var(--ok); margin-bottom:6px;">${fmt(v.rev)} ج.م</div>
            <div style="font-size:11px; color:rgba(255,255,255,0.4); margin-bottom:2px;">مصروفات</div>
            <div style="font-size:13px; font-weight:800; color:var(--red-light); margin-bottom:6px;">${fmt(v.exp)} ج.م</div>
            <div style="display:flex; justify-content:space-between; padding-top:8px; border-top:1px solid var(--line-soft);">
              <span style="font-size:11px; color:rgba(255,255,255,0.4);">صافي</span>
              <span style="font-size:13px; font-weight:900; color:${net>=0?'var(--ok)':'var(--red-light)'};">${fmt(net)} ج.م</span>
            </div>
            <div style="display:flex; justify-content:space-between; margin-top:4px;">
              <span style="font-size:11px; color:rgba(255,255,255,0.4);">تحصيل</span>
              <span style="font-size:12px; font-weight:800; color:${collR>=80?'var(--ok)':'var(--warn)'};">${collR}%</span>
            </div>
            <div style="height:4px; border-radius:2px; background:rgba(255,255,255,0.08); margin-top:6px; overflow:hidden;">
              <div style="height:100%; width:${Math.min(grandRev?Math.round(v.rev/grandRev*100):0,100)}%; background:var(--ok); border-radius:2px;"></div>
            </div>
          </div>`;
        }).join('')}
      </div>
      <!-- جدول تفصيلي -->
      <div class="card" style="padding:0; overflow:hidden;">
        <div style="padding:12px 16px; border-bottom:1px solid var(--line-soft); font-weight:800;">📊 جدول مراكز التكلفة — تفصيلي</div>
        <div style="overflow-x:auto;">
          <table style="width:100%; border-collapse:collapse;">
            <thead><tr style="background:rgba(255,255,255,0.05);">
              <th style="padding:9px 10px; font-size:11px; color:rgba(255,255,255,0.4); text-align:right;">الفرع (مركز التكلفة)</th>
              <th style="padding:9px 10px; font-size:11px; color:var(--ok); text-align:left;">إيرادات</th>
              <th style="padding:9px 10px; font-size:11px; color:var(--red-light); text-align:left;">مصروفات</th>
              <th style="padding:9px 10px; font-size:11px; color:var(--gold); text-align:left;">صافي</th>
              <th style="padding:9px 10px; font-size:11px; color:rgba(255,255,255,0.4); text-align:left;">تحصيل اشتراكات</th>
              <th style="padding:9px 10px; font-size:11px; color:rgba(255,255,255,0.4); text-align:center;">لاعبين</th>
              <th style="padding:9px 10px; font-size:11px; color:rgba(255,255,255,0.4); text-align:center;">% من الكل</th>
            </tr></thead>
            <tbody>
              ${sortedCenters.map(([b,v])=>{
                const net=v.rev-v.exp; const collR=v.subsExp?Math.round(v.subs/v.subsExp*100):0;
                const pct=grandRev?Math.round(v.rev/grandRev*100):0;
                return `<tr style="border-bottom:1px solid var(--line-soft);">
                  <td style="padding:9px 10px; font-size:13px; font-weight:800; color:var(--gold);">🏢 ${b}</td>
                  <td style="padding:9px 10px; font-size:13px; font-weight:700; color:var(--ok); text-align:left;">${fmt(v.rev)} ج.م</td>
                  <td style="padding:9px 10px; font-size:13px; font-weight:700; color:var(--red-light); text-align:left;">${fmt(v.exp)} ج.م</td>
                  <td style="padding:9px 10px; font-size:13px; font-weight:900; color:${net>=0?'var(--ok)':'var(--red-light)'}; text-align:left;">${fmt(net)} ج.م</td>
                  <td style="padding:9px 10px; text-align:left;">
                    <span style="font-size:12px; font-weight:800; color:${collR>=80?'var(--ok)':'var(--warn)'};">${collR}%</span>
                    <span style="font-size:11px; color:rgba(255,255,255,0.4); margin-right:4px;">(${fmt(v.subs)}/${fmt(v.subsExp)})</span>
                  </td>
                  <td style="padding:9px 10px; text-align:center; font-size:13px; font-weight:700;">${v.players}</td>
                  <td style="padding:9px 10px; text-align:center;">
                    <div style="display:flex; flex-direction:column; align-items:center; gap:3px;">
                      <span style="font-size:12px; font-weight:800;">${pct}%</span>
                      <div style="width:50px; height:4px; border-radius:2px; background:rgba(255,255,255,0.1); overflow:hidden;">
                        <div style="height:100%; width:${pct}%; background:var(--gold); border-radius:2px;"></div>
                      </div>
                    </div>
                  </td>
                </tr>`;}).join('')}
            </tbody>
            <tfoot><tr style="background:rgba(255,255,255,0.06); border-top:2px solid var(--line);">
              <td style="padding:9px 10px; font-weight:900;">الإجمالي الكلي</td>
              <td style="padding:9px 10px; font-weight:900; color:var(--ok); text-align:left;">${fmt(grandRev)} ج.م</td>
              <td style="padding:9px 10px; font-weight:900; color:var(--red-light); text-align:left;">${fmt(grandExp)} ج.م</td>

    // حساب الذمم بدون await داخل loop
    const debtors = [];

      let totalDebt=0, months_late=0, lastPaid='—';

        const {ac,tm} = subsCache[mk]||{ac:{},tm:{}};

        if(sub&&!sub.paid&&Number(sub.expected||0)>0){ totalDebt+=Number(sub.expected||0); months_late++; }
        if(sub?.paid&&lastPaid==='—') lastPaid=monthLabel(mk);

      if(totalDebt>0) debtors.push({...p, totalDebt, months_late, lastPaid});
    }
    debtors.sort((a,b)=>b.totalDebt-a.totalDebt);

    // الذمم الدائنة

                  <td style="padding:9px 10px; text-align:center; font-size:13px; font-weight:800; color:var(--warn);">${d.months_late} شهر</td>
                  <td style="padding:9px 10px; text-align:center; font-size:11.5px; color:rgba(255,255,255,0.4);">${d.lastPaid}</td>
                  <td style="padding:9px 10px; text-align:center;">
                    <span style="padding:3px 10px; border-radius:12px; font-size:10.5px; font-weight:800; background:${d.months_late>=3?'rgba(166,55,59,0.25)':d.months_late>=2?'rgba(240,197,132,0.2)':'rgba(255,255,255,0.08)'}; color:${d.months_late>=3?'var(--red-light)':d.months_late>=2?'var(--warn)':'rgba(255,255,255,0.6)'};">
                      ${d.months_late>=3?'عالية 🔴':d.months_late>=2?'متوسطة 🟡':'منخفضة 🟢'}
                    </span>
                  </td>
                </tr>`).join('') || '<tr><td colspan="6" style="padding:24px; text-align:center; color:var(--ok); font-weight:700;">✅ لا توجد متأخرات — جميع اللاعبين سددوا</td></tr>'}
            </tbody>
            ${debtors.length?`<tfoot><tr style="background:rgba(166,55,59,0.1); border-top:2px solid var(--line);">
              <td style="padding:9px 10px; font-weight:900;">الإجمالي</td><td></td>
              <td style="padding:9px 10px; font-weight:900; color:var(--red-light); text-align:left;">${fmt(totalDebt)} ج.م</td>
              <td colspan="3"></td>
            </tr></tfoot>`:''}
          </table>
        </div>
      </div>
      <!-- الذمم الدائنة -->
      <div class="card" style="padding:0; overflow:hidden;">
        <div style="padding:12px 16px; border-bottom:1px solid var(--line-soft); display:flex; justify-content:space-between; align-items:center;">

          <span style="font-size:12px; color:var(--ok); font-weight:700;">${fmt(creditorsTotal)} ج.م إجمالي</span>

        <div style="overflow-x:auto;">
          <table style="width:100%; border-collapse:collapse;">

              <th style="padding:9px 10px; font-size:11px; text-align:center;">إجراء</th>
            </tr></thead>
            <tbody>
              ${assets.map(a=>{
                const pct=a.cost?Math.round(a.totalDepreciation/a.cost*100):0;
                return `<tr style="border-bottom:1px solid var(--line-soft);">
                  <td style="padding:9px 10px; font-size:13px; font-weight:700;">${a.name}</td>
                  <td style="padding:9px 10px; font-size:11.5px; color:rgba(255,255,255,0.5);">${a.category||'—'}</td>
                  <td style="padding:9px 10px; font-size:11.5px; color:rgba(255,255,255,0.5);">${a.branch||'—'}</td>
                  <td style="padding:9px 10px; font-size:13px; font-weight:700; color:var(--blue-light); text-align:left;">${fmt(a.cost)} ج.م</td>
                  <td style="padding:9px 10px; text-align:center;">${a.usefulLife||'—'}</td>
                  <td style="padding:9px 10px; font-size:12.5px; font-weight:700; color:var(--warn); text-align:left;">${fmt(a.monthlyRate)} ج.م</td>
                  <td style="padding:9px 10px; font-size:12.5px; font-weight:700; color:var(--red-light); text-align:left;">
                    ${fmt(a.totalDepreciation)} ج.م
                    <div style="height:4px; border-radius:2px; background:rgba(255,255,255,0.08); margin-top:3px; overflow:hidden;">
                      <div style="height:100%; width:${pct}%; background:var(--red-light); border-radius:2px;"></div>
                    </div>
                  </td>
                  <td style="padding:9px 10px; font-size:13px; font-weight:900; color:${a.netValue>0?'var(--ok)':'var(--red-light)'}; text-align:left;">${fmt(a.netValue)} ج.م</td>
                  <td style="padding:9px 4px; text-align:center;">
                    <button onclick="openAssetModal('${a.id}')" style="padding:3px 8px; border-radius:6px; background:rgba(37,99,235,0.15); color:var(--blue-light); border:none; cursor:pointer; font-size:11px; display:block; margin-bottom:3px;">✏️</button>
                    <button onclick="runMonthlyDepreciation('${a.id}')" style="padding:3px 8px; border-radius:6px; background:rgba(240,197,132,0.15); color:var(--warn); border:none; cursor:pointer; font-size:11px;">↻ إهلاك</button>
                  </td>
                </tr>`;}).join('') || '<tr><td colspan="9" style="padding:24px; text-align:center; opacity:.4;">لا توجد أصول ثابتة مسجلة — اضغط "+ إضافة أصل"</td></tr>'}
            </tbody>
            ${assets.length?`<tfoot><tr style="background:rgba(255,255,255,0.06); border-top:2px solid var(--line);">
              <td colspan="3" style="padding:9px 10px; font-weight:900;">الإجمالي</td>
              <td style="padding:9px 10px; font-weight:900; color:var(--blue-light); text-align:left;">${fmt(totalCost)} ج.م</td>
              <td></td>
              <td style="padding:9px 10px; font-weight:900; color:var(--warn); text-align:left;">${fmt(monthlyDeprec)} ج.م</td>
              <td style="padding:9px 10px; font-weight:900; color:var(--red-light); text-align:left;">${fmt(totalDeprec)} ج.م</td>
              <td style="padding:9px 10px; font-weight:900; color:var(--ok); text-align:left;">${fmt(totalNetVal)} ج.م</td>
              <td></td>
            </tr></tfoot>`:''}
          </table>
        </div>
      </div>`;

  //  🔔 التنبيهات المحاسبية
  // ══════════════════════════════════════════════════════════
  } else if(tab==='period'){
    tabContent = await renderPeriodReportTab();

  } else if(tab==='fiscal'){
    tabContent = await renderFiscalTab();

  } else if(tab==='alerts'){
    const alertSettings  = (await sGet('ks_accounting_alerts'))||{minCash:5000, maxDebtMonths:2, collectionTarget:80, budgetWarning:90};
    const allTreasury3   = ((await sGet('ks_treasury_entries'))||[]).filter(e=>!e.deleted);
    const allPlayersAl   = (await sGet('ks_players'))||[];
    const acSubsAl       = (await sGet('ks_subs_'+month))||{};
    const tmSubsAl       = (await sGet('ks_team_subs_'+month))||{};
    const cashBal = allTreasury3.filter(e=>branchFilter(e.branch)).reduce((s,e)=>{
      const sg=treasuryReceiptSign(e.receiptType||'وارد خزينة'); return s+sg*Number(e.amount||0);
    },0);
    let alSubExp=0, alCollected=0;
    allPlayersAl.filter(p=>p.role==='player'&&p.status!=='inactive'&&branchFilter(p.branch)).forEach(p=>{
      const s=acSubsAl[p.id]||tmSubsAl[p.id];
      if(s){ alSubExp+=Number(s.expected||0); alCollected+=Number(s.paidAmt||0); }
    });
    const collRate2 = alSubExp>0?Math.round(alCollected/alSubExp*100):0;
    const alEntries  = allTreasury3.filter(e=>e.entryDate?.slice(0,7)===month&&branchFilter(e.branch));
    const alRevenue  = alEntries.filter(e=>!EXPENSE_CATS.includes(e.category||'')).reduce((s,e)=>s+Number(e.amount||0),0);
    const alExpenses = alEntries.filter(e=> EXPENSE_CATS.includes(e.category||'')).reduce((s,e)=>s+Number(e.amount||0),0);
    const alProfit   = alRevenue-alExpenses;
    const alMargin   = alRevenue?Math.round(alProfit/alRevenue*100):0;
    const budgetGoals2   = (await sGet('ks_budget_goals'))||{};
    const overallBudget2 = Number((budgetGoals2[month]||{})['__overall__']||0);
    const alerts2=[];
    if(cashBal<Number(alertSettings.minCash)) alerts2.push({level:'danger',icon:'🔴',title:'رصيد الخزينة منخفض',desc:`رصيد الخزينة ${fmt(Math.abs(cashBal))} ج.م — أقل من الحد الأدنى ${fmt(alertSettings.minCash)} ج.م`,action:'راجع التدفقات النقدية'});
    if(collRate2<Number(alertSettings.collectionTarget)) alerts2.push({level:'warn',icon:'🟡',title:'نسبة التحصيل منخفضة',desc:`نسبة التحصيل ${collRate2}% — الهدف ${alertSettings.collectionTarget}%`,action:'راجع الذمم المدينة'});
    if(overallBudget2>0&&alRevenue>0&&Math.round(alRevenue/overallBudget2*100)<Number(alertSettings.budgetWarning)) alerts2.push({level:'warn',icon:'🟡',title:'الإيرادات دون الميزانية',desc:`تحقق ${Math.round(alRevenue/overallBudget2*100)}% من الميزانية`,action:'راجع قائمة الدخل'});

function filterAcctTree(q){
  q=(q||'').trim().toLowerCase();
  document.querySelectorAll('.acct-node').forEach(n=>{ n.style.display=''; });
  if(!q) return;
  const nodes=[...document.querySelectorAll('.acct-node')];
  nodes.forEach(n=>{
    const hit = n.textContent.toLowerCase().includes(q);
    n.style.display = hit ? '' : 'none';
    if(hit){ const ch=n.querySelector('.acct-children'); if(ch) ch.style.display='block'; }
  });
}

function toggleAcctNode(id){
  const ch = document.getElementById('ch_'+id);
  const ar = document.getElementById('arr_'+id);
  if(!ch) return;
  const isOpen = ch.style.display !== 'none';
  ch.style.display = isOpen ? 'none' : 'block';
  if(ar) ar.style.transform = isOpen ? 'rotate(-90deg)' : '';
}

function findAcctNode(tree, id){
  for(const n of tree){
    if(n.id===id) return {node:n, parent:null, siblings:tree};
    if(n.children){
      const r = findAcctNodeIn(n.children, id, n);
      if(r) return r;
    }
  }
  return null;
}
function findAcctNodeIn(arr, id, parent){
  for(const n of arr){
    if(n.id===id) return {node:n, parent, siblings:arr};
    if(n.children){
      const r = findAcctNodeIn(n.children, id, n);
      if(r) return r;
    }
  }
  return null;
}

async function saveAcctNode(mode, nodeId){
  const name  = document.getElementById('acctName')?.value?.trim();
  const code  = document.getElementById('acctCode')?.value?.trim();
  const type  = document.getElementById('acctType')?.value;
  const notes = document.getElementById('acctNotes')?.value?.trim();
  if(!name){ showToast('❌ اسم الحساب مطلوب'); return; }

  let tree = (await sGet('ks_chart_of_accounts')) || getDefaultChartOfAccounts();
  const newNode = { id: uid(), code, name, type, notes, children:[] };

  if(mode==='addMain'){
    tree.push(newNode);
  } else if(mode==='add'){
    const found = findAcctNode(tree, nodeId);
    if(found?.node) found.node.children.push(newNode);
  } else if(mode==='edit'){
    const found = findAcctNode(tree, nodeId);
    if(found?.node){
      found.node.code  = code;
      found.node.name  = name;
      found.node.type  = type;
      found.node.notes = notes;
    }
  }

  await sSet('ks_chart_of_accounts', tree);
  // sync TREASURY_CATEGORIES إذا كان اسم جديد
  const allNames = [];
  function collectNames(nodes){ nodes.forEach(n=>{ if(!n.children?.length) allNames.push(n.name); else collectNames(n.children); }); }
  collectNames(tree);
  // نضيف الأسماء الجديدة لـ TREASURY_CATEGORIES بدون تكرار
  allNames.forEach(n=>{ if(!TREASURY_CATEGORIES.includes(n)) TREASURY_CATEGORIES.push(n); });

  closeModal();
  showToast('✅ تم حفظ الحساب');
  window._acctTab = 'chart';
  renderPage();
}

async function deleteAcctNode(nodeId){
  if(!confirm('حذف هذا الحساب؟')) return;
  let tree = (await sGet('ks_chart_of_accounts')) || getDefaultChartOfAccounts();
  function removeNode(arr, id){
    const idx = arr.findIndex(n=>n.id===id);
    if(idx>-1){ arr.splice(idx,1); return true; }
    for(const n of arr){ if(n.children && removeNode(n.children,id)) return true; }
    return false;
  }
  removeNode(tree, nodeId);
  await sSet('ks_chart_of_accounts', tree);
  showToast('تم الحذف');
  renderPage();
}

// ═══════════════════════════════════════════════════════════
//  📒 أدوات الشجرة: تسطيح + ترقيم تلقائي + هيكل الفروع
// ═══════════════════════════════════════════════════════════
const KS_ACC_BRANCHES   = ['توليب النرجس','توليب جاردنز','دايموند','المعادي'];
const KS_ACC_ACTIVITIES = ['Elite','Private','Group','Strokes'];
const KS_ACC_EXP_ITEMS  = ['رواتب','إيجار','مرافق','صيانة','أدوات','مصروفات أخرى'];
const DEBIT_NATURE_TYPES = ['أصول','مصروفات'];

function flattenAccounts(tree){
  const out=[];
  (function walk(nodes,depth,parent){
    (nodes||[]).forEach(n=>{
      out.push({...n, depth, parentId:parent?parent.id:null, parentName:parent?parent.name:'', isLeaf:!(n.children&&n.children.length)});
      if(n.children) walk(n.children,depth+1,n);
    });
  })(tree,0,null);
  return out;
}

function nextAcctCode(tree, parentNode){
  const siblings = parentNode ? (parentNode.children||[]) : tree;
  const prefix = parentNode ? String(parentNode.code||'') : '';
  const suffixes = siblings.map(s=>String(s.code||'')).filter(c=>c.startsWith(prefix) && c.length>prefix.length).map(c=>c.slice(prefix.length));
  const max = suffixes.reduce((m,s)=>Math.max(m, Number(s)||0), 0);
  const width = suffixes.length ? Math.max(...suffixes.map(s=>s.length)) : (prefix.length>=2 ? 2 : 1);
  return prefix + String(max+1).padStart(width,'0');
}

function ensureAcctChild(tree, parent, name, type){
  const list = parent ? (parent.children = parent.children||[]) : tree;
  let n = list.find(c=>c.name===name);
  if(!n){ n = {id:uid(), code:nextAcctCode(tree,parent), name, type, children:[]}; list.push(n); }
  return n;
}

function applyBranchStructure(tree){
  const root = t => tree.find(n=>n.type===t && !n.parentId) || tree.find(n=>n.type===t);
  const assets = root('أصول'), equity = root('حقوق الملكية'), rev = root('إيرادات'), exp = root('مصروفات');
  if(assets){
    const cur = ensureAcctChild(tree, assets, 'الأصول المتداولة', 'أصول');
    ensureAcctChild(tree, cur, 'بنك CIB', 'أصول');
    ensureAcctChild(tree, cur, 'العهدة', 'أصول');
  }
  if(equity){
    const cap = ensureAcctChild(tree, equity, 'رأس المال', 'حقوق الملكية');
    ensureAcctChild(tree, cap, 'أرباح مرحّلة', 'حقوق الملكية');
    ensureAcctChild(tree, cap, 'أرباح/خسائر العام', 'حقوق الملكية');
  }
  if(rev){
    const g = ensureAcctChild(tree, rev, 'إيرادات الفروع', 'إيرادات');
    KS_ACC_BRANCHES.forEach(b=>{
      const bn = ensureAcctChild(tree, g, 'إيرادات فرع '+b, 'إيرادات');
      KS_ACC_ACTIVITIES.forEach(a=>ensureAcctChild(tree, bn, a+' - '+b, 'إيرادات'));
    });
  }
  if(exp){
    const g = ensureAcctChild(tree, exp, 'مصروفات الفروع', 'مصروفات');
    KS_ACC_BRANCHES.forEach(b=>{
      const bn = ensureAcctChild(tree, g, 'مصروفات فرع '+b, 'مصروفات');
      KS_ACC_EXP_ITEMS.forEach(it=>ensureAcctChild(tree, bn, it+' - '+b, 'مصروفات'));
    });
  }
  return tree;
}

async function mergeBranchStructure(){
  if(!confirm('إضافة هيكل الفروع (إيرادات Elite/Private/Group/Strokes + مصروفات كل فرع) للشجرة الحالية؟ الحسابات الموجودة مش هتتمسح.')) return;
  let tree = (await sGet('ks_chart_of_accounts')) || getDefaultChartOfAccounts();
  applyBranchStructure(tree);
  await sSet('ks_chart_of_accounts', tree);
  showToast('✅ تم إضافة هيكل الفروع للشجرة');
  window._acctTab='chart'; renderPage();
}

// ═══════════════════════════════════════════════════════════
//  📚 دفتر الأستاذ الموحد: حركات الخزينة + القيود اليدوية
// ═══════════════════════════════════════════════════════════
async function getLedgerMovements(from, to, branch){
  const tree = (await sGet('ks_chart_of_accounts')) || getDefaultChartOfAccounts();
  const flat = flattenAccounts(tree);
  const byName = {}; flat.forEach(a=>{ if(!byName[a.name]) byName[a.name]=a; });
  const byId = {}; flat.forEach(a=>byId[a.id]=a);
  const inRange = d => d && (!from || d>=from) && (!to || d<=to);
  const brOk = b => !branch || branch==='all' || !b || b==='all' || b===branch;
  const acc = name => byName[name] || {id:'cat:'+name, name, type:''};
  const moves = [];

  const treasury = ((await sGet('ks_treasury_entries'))||[]).filter(e=>!e.deleted && inRange(e.entryDate) && brOk(e.branch));
  treasury.forEach(e=>{
    const amt = Number(e.amount||0); if(!amt) return;
    const rt = e.receiptType||'وارد خزينة';
    const cash = acc(/بنك|فيزا|انستاباي|إنستاباي/.test(rt) ? 'بنك' : 'م / الخزينة');
    const cat  = acc(e.category||'غير محدد');
    const inflow = treasuryReceiptSign(rt) > 0;
    const desc = e.statement || e.beneficiaryName || e.category || '';
    const base = {date:e.entryDate, desc, ref:e.receiptNo||'خزينة', source:'treasury', branch:e.branch||''};
    if(inflow){
      moves.push({...base, accId:cash.id, accName:cash.name, debit:amt, credit:0});
      moves.push({...base, accId:cat.id,  accName:cat.name,  debit:0, credit:amt});
    } else {
      moves.push({...base, accId:cat.id,  accName:cat.name,  debit:amt, credit:0});
      moves.push({...base, accId:cash.id, accName:cash.name, debit:0, credit:amt});
    }
  });

  const manual = ((await sGet('ks_manual_journal'))||[]).filter(j=>inRange(j.date) && brOk(j.branch));
  manual.forEach(j=>{
    (j.lines||[]).forEach(l=>{
      const a = (l.accId && byId[l.accId]) || acc(l.acc);
      const amt = Number(l.amount||0); if(!amt) return;
      moves.push({date:j.date, desc:l.desc||j.desc||'', ref:j.ref||'قيد', source:'manual', branch:j.branch||'',
        accId:a.id, accName:a.name, debit:l.side==='debit'?amt:0, credit:l.side==='credit'?amt:0});
    });
  });
  moves.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  return {moves, tree, flat, byId, byName};
}

function descendantIds(node){
  const ids=[node.id];
  (node.children||[]).forEach(c=>ids.push(...descendantIds(c)));
  return ids;
}

function accountTotals(flat, moves){
  const own = {};
  moves.forEach(m=>{ const o=own[m.accId]=own[m.accId]||{debit:0,credit:0}; o.debit+=m.debit; o.credit+=m.credit; });
  const tot = {};
  flat.forEach(a=>{
    const ids = descendantIds(a); let d=0,c=0;
    ids.forEach(id=>{ if(own[id]){ d+=own[id].debit; c+=own[id].credit; } });
    tot[a.id]={debit:d, credit:c, balance: DEBIT_NATURE_TYPES.includes(a.type) ? d-c : c-d};
  });
  return tot;
}

}
async function getActiveFY(){

async function closeFiscalYear(id){
  if(!isCoachOrSenior()){ showToast('❌ إقفال السنة متاح للإدارة العليا فقط'); return; }
  const fys = await getFiscalYears(); const fy = fys.find(f=>f.id===id); if(!fy) return;
  const {moves, flat} = await getLedgerMovements(fy.start, fy.end, 'all');
  const tot = accountTotals(flat, moves);
  const tops = flat.filter(a=>a.depth===0);
  const rev = tops.filter(a=>a.type==='إيرادات').reduce((s,a)=>s+tot[a.id].balance,0);
  const exp = tops.filter(a=>a.type==='مصروفات').reduce((s,a)=>s+tot[a.id].balance,0);
  // الحركات النقدية غير المصنفة في الشجرة
  const unmapped = moves.filter(m=>m.accId.startsWith('cat:'));
  const EXP = ['مصروفات','راتب','راتب مشاهر','سلف','عيد','ايجار مثبت','ايجار غير مثبت','وي فت','مرافق','تمويل','رصيد مرحل','شهر قادم','تأمين ملاعب مثبتة'];
  const extraRev = unmapped.filter(m=>!EXP.includes(m.accName)).reduce((s,m)=>s+m.credit-m.debit,0);
  const extraExp = unmapped.filter(m=> EXP.includes(m.accName)).reduce((s,m)=>s+m.debit-m.credit,0);
  const net = (rev+extraRev) - (exp+extraExp);
  if(!confirm(`إقفال ${fy.name}\n\nالإيرادات: ${(rev+extraRev).toLocaleString()} ج.م\nالمصروفات: ${(exp+extraExp).toLocaleString()} ج.م\nصافي ${net>=0?'الربح':'الخسارة'}: ${Math.abs(net).toLocaleString()} ج.م\n\nهيتعمل قيد تحويل الصافي إلى "أرباح مرحّلة"، وبعد الإقفال مش هينفع تضيف أو تعدل قيود في الفترة دي. متأكد؟`)) return;

  let tree = (await sGet('ks_chart_of_accounts')) || getDefaultChartOfAccounts();
  applyBranchStructure(tree); await sSet('ks_chart_of_accounts', tree);
  const f2 = flattenAccounts(tree);
  const pl = f2.find(a=>a.name==='أرباح/خسائر العام'), re = f2.find(a=>a.name==='أرباح مرحّلة');
  if(Math.abs(net)>0.01){
    const all = (await sGet('ks_manual_journal'))||[];
    const lines = net>0
      ? [{side:'debit', acc:pl.name, accId:pl.id, amount:net, desc:'إقفال صافي الربح'}, {side:'credit', acc:re.name, accId:re.id, amount:net, desc:'ترحيل إلى الأرباح المرحّلة'}]
      : [{side:'debit', acc:re.name, accId:re.id, amount:-net, desc:'ترحيل الخسارة'}, {side:'credit', acc:pl.name, accId:pl.id, amount:-net, desc:'إقفال صافي الخسارة'}];
    all.push({id:uid(), date:fy.end, desc:'قيد إقفال '+fy.name, branch:'all', lines, amount:Math.abs(net), type:'قيد إقفال', isClosing:true,
      debitAcc:lines[0].acc, creditAcc:lines[1].acc, ref: await nextJournalRef(fy.end), createdAt:new Date().toISOString(), createdBy:session.name});
    await sSet('ks_manual_journal', all);
  }
  fy.status='closed'; fy.closedAt=new Date().toISOString(); fy.closedBy=session.name; fy.netResult=net;
  await sSet('ks_fiscal_years', fys);
  showToast('🔒 تم إقفال السنة المالية وترحيل الصافي للأرباح المرحّلة');
  renderPage();
}
async function reopenFiscalYear(id){
  if(!isCoachOrSenior()){ showToast('❌ متاح للإدارة العليا فقط'); return; }
  if(!confirm('فتح السنة المالية تاني؟ قيد الإقفال هيتمسح.')) return;
  const fys = await getFiscalYears(); const fy = fys.find(f=>f.id===id); if(!fy) return;
  let all = (await sGet('ks_manual_journal'))||[];
  all = all.filter(j=>!(j.isClosing && j.date===fy.end));
  await sSet('ks_manual_journal', all);
  fy.status='open'; fy.reopenedAt=new Date().toISOString(); fy.reopenedBy=session.name;
  await sSet('ks_fiscal_years', fys);
  showToast('🔓 تم فتح السنة المالية'); renderPage();
}

async function nextJournalRef(date){
  const y = (date||todayISO()).slice(0,4);
  const all = (await sGet('ks_manual_journal'))||[];
  const nums = all.map(j=>String(j.ref||'')).filter(r=>r.startsWith('ق-'+y+'-')).map(r=>Number(r.split('-')[2])||0);
  return 'ق-'+y+'-'+String((nums.length?Math.max(...nums):0)+1).padStart(4,'0');
}
